[project]
name = "luminalium"
version = "0.1.0"
description = "A PowerPoint assistant application"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.0.0",
    "pyside6-fluent-widgets>=1.0.0",
    "psutil>=5.9.0",
    "pillow>=10.0.0",
    "jsonschema>=4.25.0",
    "referencing>=0.36.0",
    "pynput>=1.7.0; sys_platform == 'linux'",
    "ty>=0.0.31",
    "aiohttp>=3.9.0",
    "winrt-windows.ui.notifications>=2.0.0; sys_platform == 'win32'",
    "winrt-windows.data.xml.dom>=2.0.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pyright>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ppt_assistant", "plugins"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
target-version = "py311"
line-length = 88
