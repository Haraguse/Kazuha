[project]
name = "luminalium"
version = "0.1.0"
description = "A PowerPoint assistant application"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.0.0",
    "pyside6-fluent-widgets>=1.0.0",
    "psutil>=5.9.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pyright>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ppt_assistant", "plugins"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = ["Windows", "Linux"]
