        function updateSystemStatus(data) {
            // Get display settings from config
            const showBattery = currentConfig ? (currentConfig.statusBarShowBattery !== false) : true;
            const showVolume = currentConfig ? (currentConfig.statusBarShowVolume !== false) : true;
            const showNetwork = currentConfig ? (currentConfig.statusBarShowNetwork !== false) : true;
            const showMusic = currentConfig ? (currentConfig.statusBarShowMusic !== false) : true;
            
            // Battery
            const batteryItem = document.getElementById('status-battery');
            const batteryText = document.getElementById('battery-text');
            const batteryIcon = document.querySelector('#status-battery .icon-mask');
            
            if (showBattery) {
                batteryItem.style.display = 'flex';
                if (data.is_desktop) {
                    const newBatteryText = "台式机";
                    if (batteryText.innerText !== newBatteryText) {
                        updateStatusDisplay(batteryText, newBatteryText);
                        lastStatusValues.battery = newBatteryText;
                    }
                    batteryIcon.className = 'icon-mask icon-desktop';
                } else {
                    const newBatteryText = data.battery_percent + '%';
                    if (batteryText.innerText !== newBatteryText) {
                        updateStatusDisplay(batteryText, newBatteryText);
                        lastStatusValues.battery = newBatteryText;
                    }
                    if (data.battery_charging) {
                        batteryIcon.className = 'icon-mask icon-battery-charging';
                    } else {
                        batteryIcon.className = 'icon-mask icon-battery';
                    }
                }
            } else {
                batteryItem.style.display = 'none';
            }
            
            // Network
            const netItem = document.getElementById('status-network');
            const netIcon = document.querySelector('#status-network .icon-mask');
            if (showNetwork) {
                netItem.style.display = 'flex';
                if (data.network_online) {
                    netIcon.className = 'icon-mask icon-wifi';
                } else {
                    netIcon.className = 'icon-mask icon-wifi-off';
                }
            } else {
                netItem.style.display = 'none';
            }
            
            // Volume
            const volItem = document.getElementById('status-volume');
            const volText = volItem.querySelector('.status-text');
            if (showVolume && data.volume >= 0) {
                 volItem.style.display = 'flex';
                 const newVolText = data.volume + '%';
                 if (volText.innerText !== newVolText) {
                     updateStatusDisplay(volText, newVolText);
                     lastStatusValues.volume = newVolText;
                 }
            } else {
                 volItem.style.display = 'none';
            }
            
            // SMTC
            let fullTitle = data.smtc_title || data.smtc_status || '';
            if (data.smtc_title && data.smtc_artist) {
                fullTitle = data.smtc_title + ' - ' + data.smtc_artist;
            }
            currentMusicState = {
                visible: !!(showMusic && data.smtc_status && data.smtc_status !== 'Closed' && data.smtc_status !== 'Stopped'),
                status: String(data.smtc_status || ''),
                baseText: String(fullTitle).trim(),
                artist: String(data.smtc_artist || ''),
                positionMs: Math.max(0, Number(data.smtc_position_ms) || 0),
                durationMs: Math.max(0, Number(data.smtc_duration_ms) || 0),
                syncedAtMs: Date.now(),
                rawTitle: String(data.smtc_title || ''),
                artworkDataUrl: String(data.smtc_artwork_data_url || '')
            };
            renderMusicStatus(true);
        }

        function initSlider() {
            const thumb = document.getElementById('clear-thumb');
            const container = document.getElementById('clear-slider');
            const text = container.querySelector('.slider-text');
            let isDragging = false;
            let startX = 0;
            let currentX = 0;
            const maxDrag = 156;

            function onStart(e) {
                isDragging = true;
                startX = (e.touches ? e.touches[0].clientX : e.clientX) - currentX;
                thumb.style.transition = 'none';
                text.style.opacity = 1;
            }

            function onMove(e) {
                if (!isDragging) return;
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let newX = clientX - startX;
                
                if (newX < 0) newX = 0;
                if (newX > maxDrag) newX = maxDrag;
                
                currentX = newX;
                thumb.style.transform = `translateX(${currentX}px)`;
                
                text.style.opacity = 1 - (currentX / maxDrag);
            }

            function onEnd() {
                if (!isDragging) return;
                isDragging = false;
                thumb.style.transition = animationsDisabled() ? 'none' : 'transform 0.3s ease';
                
                if (currentX > maxDrag * 0.8) {
                    currentX = maxDrag;
                    thumb.style.transform = `translateX(${currentX}px)`;
                    if (bridge) bridge.clearScreen();
                    
                    setTimeout(() => {
                        currentX = 0;
                        thumb.style.transform = `translateX(0px)`;
                        text.style.opacity = 1;
                        document.getElementById('eraser-settings').classList.remove('visible');
                    }, motionDelay(300));
                } else {
                    currentX = 0;
                    thumb.style.transform = `translateX(0px)`;
                    text.style.opacity = 1;
                }
            }

            thumb.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            
            thumb.addEventListener('touchstart', onStart);
            document.addEventListener('touchmove', onMove);
            document.addEventListener('touchend', onEnd);
        }
        
        window.addEventListener('load', initSlider);

        const observer = new ResizeObserver(entries => {
            sendMaskUpdate();
        });

        document.querySelectorAll('.interactive').forEach(el => observer.observe(el));

        function scheduleMaskUpdate() {
            if (typeof sendMaskUpdate !== 'function') return;
            requestAnimationFrame(() => requestAnimationFrame(sendMaskUpdate));
            setTimeout(sendMaskUpdate, motionDelay(360));
        }


        // Toolbar Collapse Logic
        let isToolbarCollapsed = false;
        let toolbarTouchStartY = 0;
        let toolbarTouchStartX = 0;

        function toggleToolbar(collapsed) {
            if (typeof collapsed === 'undefined') collapsed = !isToolbarCollapsed;
            isToolbarCollapsed = collapsed;
            
            const container = document.getElementById('toolbar-container');
            if (collapsed) {
                container.classList.add('collapsed');
                container.classList.remove('half-collapsed');
                stopHalfCollapseTimer();
            } else {
                container.classList.remove('collapsed');
                resetHalfCollapseTimer();
            }
            
            scheduleMaskUpdate();
        }

        let halfCollapseTimer = null;
        let halfCollapseEnabled = false;

        function stopHalfCollapseTimer() {
            if (halfCollapseTimer) {
                clearTimeout(halfCollapseTimer);
                halfCollapseTimer = null;
            }
        }

        function resetHalfCollapseTimer() {
            stopHalfCollapseTimer();
            const container = document.getElementById('toolbar-container');
            if (container.classList.contains('half-collapsed')) {
                container.classList.remove('half-collapsed');
                scheduleMaskUpdate();
            }
            if (!halfCollapseEnabled || isToolbarCollapsed) return;
            halfCollapseTimer = setTimeout(() => {
                const c = document.getElementById('toolbar-container');
                if (!isToolbarCollapsed && !c.classList.contains('half-collapsed')) {
                    c.classList.add('half-collapsed');
                    scheduleMaskUpdate();
                }
            }, 3000);
        }

        function onToolbarInteraction() {
            if (!halfCollapseEnabled) return;
            const container = document.getElementById('toolbar-container');
            if (container.classList.contains('half-collapsed')) {
                container.classList.remove('half-collapsed');
                scheduleMaskUpdate();
            }
            resetHalfCollapseTimer();
        }

        // Gestures
        const toolbarEl = document.getElementById('toolbar');
        const handleEl = document.getElementById('toolbar-handle');

        toolbarEl.addEventListener('mouseenter', () => onToolbarInteraction());
        toolbarEl.addEventListener('click', () => onToolbarInteraction());
        toolbarEl.addEventListener('touchstart', () => onToolbarInteraction(), {passive: true});
        
        // Handle Click
        handleEl.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleToolbar(false);
        });

        // Toolbar Swipe Down (Collapse)
        toolbarEl.addEventListener('mousedown', e => {
            toolbarTouchStartY = e.clientY;
            toolbarTouchStartX = e.clientX;
        });
        
        toolbarEl.addEventListener('touchstart', e => {
            if(e.touches.length > 0) {
                toolbarTouchStartY = e.touches[0].clientY;
                toolbarTouchStartX = e.touches[0].clientX;
            }
        }, {passive: true});

        function handleToolbarSwipe(e, clientX, clientY) {
            const diffY = clientY - toolbarTouchStartY;
            const diffX = clientX - toolbarTouchStartX;
            const config = currentConfig || {};
            const pos = config.toolbarPosition || 'bottom';
            const threshold = 40; // Pixel threshold

            if (pos === 'bottom') {
                if (diffY > threshold) toggleToolbar(true);
            } else if (pos === 'top') {
                if (diffY < -threshold) toggleToolbar(true);
            } else if (pos === 'left') {
                if (diffX < -threshold) toggleToolbar(true);
            } else if (pos === 'right') {
                if (diffX > threshold) toggleToolbar(true);
            }
        }

        toolbarEl.addEventListener('mouseup', e => {
            handleToolbarSwipe(e, e.clientX, e.clientY);
        });
        
        toolbarEl.addEventListener('touchend', e => {
            if (e.changedTouches.length > 0) {
                handleToolbarSwipe(e, e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
        });
        
        // Handle Swipe Up (Expand)
        handleEl.addEventListener('mousedown', e => {
            toolbarTouchStartY = e.clientY;
            toolbarTouchStartX = e.clientX;
        });
        
        handleEl.addEventListener('touchstart', e => {
             if(e.touches.length > 0) {
                toolbarTouchStartY = e.touches[0].clientY;
                toolbarTouchStartX = e.touches[0].clientX;
            }
        }, {passive: true});
        
        function handleHandleSwipe(e, clientX, clientY) {
            const diffY = clientY - toolbarTouchStartY;
            const diffX = clientX - toolbarTouchStartX;
            const config = currentConfig || {};
            const pos = config.toolbarPosition || 'bottom';
            const threshold = 30; 

            if (pos === 'bottom') {
                if (diffY < -threshold) toggleToolbar(false);
            } else if (pos === 'top') {
                if (diffY > threshold) toggleToolbar(false);
            } else if (pos === 'left') {
                if (diffX > threshold) toggleToolbar(false);
            } else if (pos === 'right') {
                if (diffX < -threshold) toggleToolbar(false);
            }
        }
        
        handleEl.addEventListener('mouseup', e => {
            handleHandleSwipe(e, e.clientX, e.clientY);
        });
        
        handleEl.addEventListener('touchend', e => {
            if (e.changedTouches.length > 0) {
                handleHandleSwipe(e, e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
        });

        // Override sendMaskUpdate to exclude collapsed toolbar
        function sendMaskUpdate() {
            if (!bridge) return;
            requestAnimationFrame(() => {
                const rects = [];
                const isCollapsed = document.getElementById('toolbar-container').classList.contains('collapsed');
                
                document.querySelectorAll('.interactive').forEach(el => {
                    // Special handling for page selector to ensure it's detected even if transition is running
                    if (el.id === 'page-selector') {
                        if (el.classList.contains('visible')) {
                            // Force send full rect for sidebar
                            const isLeft = el.classList.contains('left-side');
                            rects.push({
                                x: isLeft ? 0 : (window.innerWidth - 260 - 64), // Larger buffer for right side
                                y: 0,
                                width: 324, // Significantly wider interaction area (260 + 64)
                                height: window.innerHeight
                            });
                        }
                        return;
                    }

                    // Explicit handling for media popup because window mask clips visual output.
                    // Its soft transitions/shadow can be outside normal layout bounds.
                    if (el.id === 'media-popup') {
                        if (el.classList.contains('visible')) {
                            const r = el.getBoundingClientRect();
                            rects.push({
                                x: Math.max(0, r.x - 2),
                                y: Math.max(0, r.y - 2),
                                width: r.width + 4,
                                height: r.height + 4
                            });
                        }
                        return;
                    }
                    
                    if (el.offsetParent === null) return;
                    
                    const style = window.getComputedStyle(el);
                    if (style.opacity === '0' || style.pointerEvents === 'none' || style.visibility === 'hidden') return;
                    
                    // Skip toolbar if collapsed (redundant with pointerEvents check but explicit)
                    if (isCollapsed && el.id === 'toolbar') return;
                    
                    // Skip handle if NOT collapsed (handle is only interactive when collapsed)
                    if (!isCollapsed && el.id === 'toolbar-handle') return;

                    const r = el.getBoundingClientRect();
                    if (r.width === 0 || r.height === 0) return;
                    
                    rects.push({
                        x: r.x,
                        y: r.y,
                        width: r.width,
                        height: r.height
                    });
                });
                bridge.updateMask(rects, window.noop);
            });
        }
    </script>
