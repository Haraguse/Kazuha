<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay</title>
    <style>
        @font-face {
            font-family: "Google Sans Flex";
            src: url("../../fonts/Google Sans Flex.ttf") format("truetype");
            font-display: swap;
        }

        @font-face {
            font-family: "MiSans VF";
            src: url("../../fonts/MiSansVF.ttf") format("truetype");
            font-display: swap;
        }

        @font-face {
            font-family: "MiSans Japanese VF";
            src: url("../../fonts/MiSansJapaneseVF.ttf") format("truetype");
            font-display: swap;
        }

        @font-face {
            font-family: "MiSans TC VF";
            src: url("../../fonts/MiSansTCVF.ttf") format("truetype");
            font-display: swap;
        }

        :root {
            --bg-app: #f2f3f5;
            --bg-surface: #ffffff;
            --text-primary: #1a1c1e;
            --text-secondary: #5e6368;
            --accent-color: #5B8DEF;
            --divider: rgba(0, 0, 0, 0.08);
            --item-hover: rgba(0, 0, 0, 0.05);
            --shadow-main: 0 4px 12px rgba(0, 0, 0, 0.06);
            --font-stack: "Google Sans Flex", "MiSans VF", "Segoe UI", system-ui, -apple-system, sans-serif;

            /* Light Mode Defaults */
            --overlay-toolbar-bg: rgba(255, 255, 255, 0.95);
            --overlay-toolbar-border: rgba(0, 0, 0, 0.08);
            --overlay-toolbar-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --overlay-toolbar-fg: #333333;
            
            --overlay-button-hover: rgba(0, 0, 0, 0.06);
            --overlay-button-active: rgba(0, 0, 0, 0.12);
            
            --overlay-status-bg: rgba(255, 255, 255, 0.98);
            --overlay-status-fg: #333333;
            --overlay-status-sep: rgba(0, 0, 0, 0.1);
            
            --overlay-page-bg: var(--overlay-toolbar-bg);
            --overlay-page-border: var(--overlay-toolbar-border);
            --overlay-page-fg: #333333;
            --overlay-page-hint: rgba(0, 0, 0, 0.5);
            --overlay-page-hover: var(--overlay-button-hover);
            --overlay-page-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);

            /* Popup & Controls (Light) */
            --overlay-popup-bg: rgba(255, 255, 255, 0.98);
            --overlay-popup-border: rgba(0, 0, 0, 0.08);
            --overlay-popup-shadow: none;
            
            --overlay-control-bg: rgba(0, 0, 0, 0.06);
            --overlay-control-hover: rgba(0, 0, 0, 0.1);
            --overlay-control-active: rgba(0, 0, 0, 0.15);
            
            --overlay-text-primary: #333333;
            --overlay-text-secondary: rgba(0, 0, 0, 0.6);
            
            --overlay-thumb-bg: #FFFFFF;
            --overlay-thumb-icon: #333333;

            --overlay-dialog-mask: rgba(0, 0, 0, 0.2);
            --overlay-dialog-bg: rgba(255, 255, 255, 0.98);
            --overlay-dialog-border: rgba(0, 0, 0, 0.08);
            --overlay-dialog-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
            --overlay-dialog-title: #1a1c1e;
            --overlay-dialog-text: rgba(0, 0, 0, 0.65);
        }

        :root[data-disable-animations="true"] *,
        :root[data-disable-animations="true"] *::before,
        :root[data-disable-animations="true"] *::after {
            transition: none !important;
            scroll-behavior: auto !important;
        }

        [data-theme="dark"] {
            --bg-app: #121212;
            --bg-surface: #1E1E1E;
            --text-primary: #E5E5E5;
            --text-secondary: #909090;
            --accent-color: #7BA4F5;
            --divider: rgba(255, 255, 255, 0.08);
            --item-hover: rgba(255, 255, 255, 0.05);
            --shadow-main: 0 8px 32px rgba(0, 0, 0, 0.3);

            /* Dark Mode Overrides */
            --overlay-toolbar-bg: rgba(40, 40, 40, 0.95);
            --overlay-toolbar-border: rgba(255, 255, 255, 0.15);
            --overlay-toolbar-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            --overlay-toolbar-fg: #FFFFFF;
            
            --overlay-button-hover: rgba(255, 255, 255, 0.1);
            --overlay-button-active: rgba(255, 255, 255, 0.2);
            
            --overlay-status-bg: rgba(0, 0, 0, 0.85);
            --overlay-status-fg: #FFFFFF;
            --overlay-status-sep: rgba(255, 255, 255, 0.2);
            
            --overlay-page-bg: var(--overlay-toolbar-bg);
            --overlay-page-border: var(--overlay-toolbar-border);
            --overlay-page-fg: #FFFFFF;
            --overlay-page-hint: rgba(255, 255, 255, 0.6);
            --overlay-page-hover: var(--overlay-button-hover);
            --overlay-page-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            
            /* Popup & Controls (Dark) */
            --overlay-popup-bg: rgba(30, 30, 30, 0.98);
            --overlay-popup-border: rgba(255, 255, 255, 0.1);
            --overlay-popup-shadow: none;
            
            --overlay-control-bg: rgba(255, 255, 255, 0.1);
            --overlay-control-hover: rgba(255, 255, 255, 0.15);
            --overlay-control-active: rgba(255, 255, 255, 0.2);
            
            --overlay-text-primary: #FFFFFF;
            --overlay-text-secondary: rgba(255, 255, 255, 0.6);
            
            --overlay-thumb-bg: #FFFFFF;
            --overlay-thumb-icon: #000000;

            --overlay-dialog-mask: rgba(0, 0, 0, 0.35);
            --overlay-dialog-bg: rgba(24, 24, 24, 0.96);
            --overlay-dialog-border: rgba(255, 255, 255, 0.12);
            --overlay-dialog-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
            --overlay-dialog-title: #FFFFFF;
            --overlay-dialog-text: rgba(255, 255, 255, 0.68);
        }

        [data-theme-id="year-of-horse"] {

            --accent-color: #D32F2F;
            --overlay-toolbar-bg: #FFEBEE;

            --overlay-toolbar-fg: #B71C1C;

            --overlay-button-hover: rgba(211, 47, 47, 0.15);
            --overlay-button-active: rgba(211, 47, 47, 0.25);
            
            --overlay-status-bg: rgba(183, 28, 28, 0.9);

            --overlay-status-sep: rgba(255, 255, 255, 0.6);
            
            --overlay-page-bg: #FFEBEE;
            --overlay-page-border: rgba(211, 47, 47, 0.25);
            --overlay-page-fg: #B71C1C;
            --overlay-page-hint: rgba(183, 28, 28, 0.7);
            --overlay-page-hover: rgba(211, 47, 47, 0.15);
            --overlay-page-shadow: rgba(183, 28, 28, 0.2);
            
            --overlay-popup-bg: #FFEBEE;

            --overlay-dialog-bg: #FFEBEE;

            --overlay-dialog-text: rgba(183, 28, 28, 0.6);

            --overlay-popup-border: rgba(255, 69, 0, 0.3);

            --overlay-page-bg: #451212;
            --overlay-page-border: rgba(255, 69, 0, 0.3);

            --overlay-control-hover: rgba(255, 69, 0, 0.22);
            --overlay-control-active: rgba(255, 69, 0, 0.3);
            
            --overlay-text-primary: #FFD700;
            --overlay-text-secondary: #FFB347;
            
            --overlay-thumb-bg: #FF4500;
            --overlay-thumb-icon: #451212;
            
            --overlay-dialog-bg: #451212;
            --overlay-dialog-border: rgba(255, 69, 0, 0.3);
            --overlay-dialog-title: #FFD700;
            --overlay-dialog-text: #FFB347;
        }

        /* Year of Horse Background Pattern */
        [data-theme-id="year-of-horse"] .flipper {
            background-image: radial-gradient(circle at 50% 0%, rgba(230, 0, 0, 0.12), transparent 70%),
                              radial-gradient(circle at 50% 100%, rgba(230, 0, 0, 0.08), transparent 70%);
            background-size: cover;
        }
        [data-theme="dark"][data-theme-id="year-of-horse"] .flipper {
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 69, 0, 0.15), transparent 70%),
                              radial-gradient(circle at 50% 100%, rgba(255, 69, 0, 0.1), transparent 70%);
        }

        body {
            background: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
            font-family: var(--font-stack);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        .disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.8);
        }

        #status-bar {
            width: 100%;
            height: 32px;
            background: var(--overlay-status-bg);
            color: var(--overlay-status-fg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-sizing: border-box;
            font-size: 12px;
            font-weight: 900;
            /* backdrop-filter: blur(10px); */
            opacity: 0;
            transition: opacity 0.3s;
            border-bottom: 1px solid var(--overlay-status-sep);
            position: relative;
        }

        #status-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        #status-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #time-display {
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 0.02em;
        }

        #timer-area {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(74, 133, 246, 0.15);
            opacity: 0;
            transition: opacity 0.3s;
        }

        #timer-area.active {
            opacity: 1;
        }

        #timer-display {
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 0.02em;
            min-width: 60px;
            text-align: center;
            color: #7BA4F5;
        }

        #timer-label {
            font-size: 11px;
            font-weight: 500;
            opacity: 0.7;
            color: #7BA4F5;
        }

        /* Digit animation for status bar */
        .status-digit-wrapper {
            display: inline-grid;
            place-items: center;
            position: relative;
            overflow: visible;
            vertical-align: bottom;
        }

        .status-digit-wrapper > span {
            grid-area: 1 / 1;
            backface-visibility: hidden;
            will-change: transform, opacity, filter;
        }

        .status-separator {
            display: inline-block;
            width: 0.6em;
        }

        .status-digit-old {
            animation: statusDigitExit 0.03s ease-in forwards;
        }

        .status-digit-new {
            animation: statusDigitEnter 0.3s cubic-bezier(0.2, 1.25, 0.4, 1) forwards;
        }

        @keyframes statusDigitExit {
            0% {
                transform: translateY(0) scale(1);
                filter: blur(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-100%) scale(0.7);
                filter: blur(10px);
                opacity: 0;
            }
        }

        @keyframes statusDigitEnter {
            0% {
                transform: translateY(100%) scale(0.7);
                filter: blur(10px);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                filter: blur(0);
                opacity: 1;
            }
        }

        @keyframes musicFlipOut {
            0% {
                transform: translateY(0) scale(1);
                filter: blur(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-100%) scale(0.7);
                filter: blur(10px);
                opacity: 0;
            }
        }

        @keyframes musicFlipIn {
            0% {
                transform: translateY(100%) scale(0.7);
                filter: blur(10px);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                filter: blur(0);
                opacity: 1;
            }
        }

        .status-music-flip {
            animation: musicFlipOut 0.03s ease-in forwards;
        }

        .status-music-flip-in {
            animation: musicFlipIn 0.3s cubic-bezier(0.2, 1.25, 0.4, 1) forwards;
        }

        #status-bar.visible {
            opacity: 1;
        }
        
        #system-status {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-text {
            font-size: 14px;
            font-weight: 900;
            color: var(--overlay-status-fg);
            white-space: pre;
        }
        
        .status-item .icon-mask {
            width: 16px;
            height: 16px;
            background-color: var(--overlay-status-fg);
        }

        /* Media Popup */
        #media-popup {
            position: fixed;
            top: 40px;
            left: 0;
            transform: translateY(-10px);
            width: 360px;
            height: 140px;
            border-radius: 12px;
            background: #2a2a2a;
            border: 1px solid var(--overlay-popup-border);
            box-shadow: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.2, 1.25, 0.4, 1), transform 0.3s cubic-bezier(0.2, 1.25, 0.4, 1), left 0.3s cubic-bezier(0.2, 1.25, 0.4, 1);
            z-index: 1000;
            box-sizing: border-box;
        }
        #media-popup.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .media-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-size: cover;
            background-position: center;
            filter: blur(40px) brightness(0.7);
            transform: scale(1.5);
        }
        .media-artwork-bg {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: 60%;
            object-fit: cover;
            z-index: 1;
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 40%);
            mask-image: linear-gradient(to right, transparent 0%, black 40%);
        }
        .media-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 20px 20px 16px 20px;
            box-sizing: border-box;
            color: #fff;
        }
        .media-titles {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 65%;
            margin-bottom: 8px;
        }
        .media-title {
            font-size: 18px;
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .media-artist {
            font-size: 13px;
            font-weight: 500;
            opacity: 0.9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .media-controls {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            margin-top: auto;
            margin-bottom: 0;
        }
        .media-right-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .media-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            opacity: 1;
        }
        .media-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            opacity: 1;
        }
        .media-btn:active {
            transform: none;
        }
        .media-btn .icon-mask {
            width: 20px;
            height: 20px;
            background-color: #fff;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
        }
        .media-play-btn {
            background: transparent !important;
        }
        .media-play-btn .icon-mask {
            width: 22px;
            height: 22px;
            background-color: #fff;
        }

        #center-area {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .flipper {
            width: 54px;
            height: 160px;
            background: var(--overlay-page-bg);
            border: 0.5px solid var(--overlay-page-border);
            border-radius: 27px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* box-shadow: var(--overlay-page-shadow); */
            pointer-events: auto;
            /* backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px); */
            transition: background 0.3s, border-color 0.3s;
        }

        .flipper:active {
            transform: scale(0.95);
        }

        /* Flipper Bottom Layout */
        .flipper.flipper-bottom {
            height: 54px;
            width: 160px;
            flex-direction: row;
            align-items: center;
            border-radius: 27px;
            position: absolute;
            bottom: 20px;
            /* Reset transform from center layout */
            transform: none !important; 
        }

        #left-flipper.flipper-bottom {
            left: 20px;
        }

        #right-flipper.flipper-bottom {
            right: 20px;
        }

        /* Strict edge alignment for flipper bottom layout */
        #left-flipper.flipper-bottom.strict-edge-alignment {
            left: 0px;
        }

        #right-flipper.flipper-bottom.strict-edge-alignment {
            right: 0px;
        }

        .flipper.flipper-bottom.strict-edge-alignment {
            bottom: 0px;
        }
        
        .flipper.flipper-bottom .flipper-btn {
            margin: 0 4px;
        }
        
        .flipper.flipper-bottom .icon-previous {
            transform: rotate(0deg);
        }
        
        .flipper.flipper-bottom .icon-next {
            transform: rotate(0deg);
        }

        .flipper.flipper-bottom .page-info-container {
             padding: 0 4px;
             flex-direction: row;
        }

        #ink-prompt {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: var(--overlay-dialog-mask);
            width: 100vw;
            height: 100vh;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 9999;
            pointer-events: auto;
        }

        #ink-prompt.visible {
            display: flex;
        }

        .ink-card {
            min-width: 320px;
            max-width: 520px;
            padding: 22px 24px;
            border-radius: 16px;
            background: var(--overlay-dialog-bg);
            border: 1px solid var(--overlay-dialog-border);
            box-shadow: var(--overlay-dialog-shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
        }

        .ink-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--overlay-dialog-title);
        }

        .ink-text {
            font-size: 14px;
            font-weight: 700;
            color: var(--overlay-dialog-text);
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .ink-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 4px;
        }

        .ink-btn {
            border: 0;
            border-radius: 10px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.08);
            color: var(--overlay-dialog-title);
        }

        .ink-btn:hover {
            filter: brightness(1.02);
        }

        .ink-btn.confirm {
            background: var(--accent-color);
            color: #ffffff;
        }
        
        .flipper-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px;
            flex: none;
        }
        
        .flipper-btn:hover {
            background: var(--overlay-page-hover);
        }

        .flipper-btn:active {
            background: var(--overlay-button-active);
        }
        
        .flipper-btn:first-child {
            border-radius: 50%;
            margin-bottom: 0;
        }
        
        .flipper-btn:last-child {
            border-radius: 50%;
            margin-top: 0;
        }
        
        .flipper .icon-previous {
            transform: rotate(90deg);
        }
        
        .flipper .icon-next {
            transform: rotate(90deg);
        }

        .page-info-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            padding: 4px 0;
        }

        .page-count-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
        }

        .page-curr {
            font-size: 16px;
            font-weight: bold;
            color: var(--overlay-page-fg);
        }

        .page-total-grp {
            font-size: 10px;
            color: var(--overlay-page-hint);
            margin-left: 2px;
        }

        .page-label {
            font-size: 10px;
            color: var(--overlay-page-hint);
            margin-top: -2px;
        }

        #toolbar-container {
            position: absolute;
            pointer-events: none;
            z-index: 100;
            display: flex;
            padding: 20px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        #toolbar-container.strict-edge-alignment {
            padding: 0px;
        }

        /* Bottom Position (Default) */
        #toolbar-container.pos-bottom {
            bottom: 0;
            left: 0;
            right: 0;
            justify-content: center;
            align-items: flex-end;
        }

        /* Top Position */
        #toolbar-container.pos-top {
            top: 0;
            left: 0;
            right: 0;
            justify-content: center;
            align-items: flex-start;
        }

        /* Left Position */
        #toolbar-container.pos-left {
            top: 0;
            bottom: 0;
            left: 0;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        /* Right Position */
        #toolbar-container.pos-right {
            top: 0;
            bottom: 0;
            right: 0;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
        }

        /* Adjust toolbar for vertical layout */
        #toolbar-container.pos-left #toolbar,
        #toolbar-container.pos-right #toolbar {
            flex-direction: column;
            width: auto;
            height: auto;
        }

        #toolbar-container.pos-left .separator,
        #toolbar-container.pos-right .separator {
            width: 24px;
            height: 1px;
            margin: 4px auto;
        }


        #toolbar-handle {
            position: absolute;
            width: 32px;
            height: 12px;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            z-index: 101;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        #toolbar-handle:hover {
            opacity: 1;
        }

        .handle-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: var(--overlay-toolbar-fg);
            margin: 0 2px;
            opacity: 0.5;
        }

        #toolbar {
            background: var(--overlay-toolbar-bg);
            border: 0.5px solid var(--overlay-toolbar-border);
            border-radius: 999px;
            padding: 8px 8px 8px 12px;
            display: flex;
            gap: 4px;
            /* box-shadow: var(--overlay-toolbar-shadow); */
            transition: opacity 0.3s, transform 0.3s;
            position: relative;

            -webkit-backdrop-filter: blur(25px); */

            position: relative;
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 12px;
            color: var(--accent-color);
            font-weight: 600;
            background: rgba(50, 117, 245, 0.1);
            margin: auto 8px auto 0;
        }

        .compat-label::after {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 1px solid rgba(50, 117, 245, 0.35);
        }
        
        .tool-btn {
            width: 38px;
            height: 38px;

            background: var(--overlay-button-hover);

            background: var(--overlay-button-active);

            background: rgba(224, 62, 62, 0.14);

        .tool-btn img {
            width: 20px;

            background: rgba(255, 255, 255, 0.15);
            margin: auto 4px;

        }

        }

            width: 5px;
            height: 48px;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            margin: auto 6px;

        #toolbar-container.pos-left.collapsed #toolbar {

        }

    <script>
        // Patch to suppress WebChannel callback errors
        // These errors occur when callbacks are lost due to page reloads or channel resets
        (function() {
            const originalConsoleError = console.error;
            console.error = function(...args) {
                // Filter out the specific WebChannel callback error
                if (args.length > 0 && typeof args[0] === 'string' && 
                    args[0].includes('execCallbacks') && args[0].includes('is not a function')) {
                    // Silently ignore this error
                    return;
                }
                originalConsoleError.apply(console, args);
            };
        })();

        let bridge = createBridgePlaceholder();
        let webChannelReady = false;
        let webChannelInitAttempts = 0;
        let webChannelInitTimer = null;
        const WEBCHANNEL_INIT_DELAY_MS = 50;
        const WEBCHANNEL_INIT_MAX_ATTEMPTS = 200;

        function scheduleWebChannelInit(reason) {
            if (webChannelReady || webChannelInitTimer || webChannelInitAttempts >= WEBCHANNEL_INIT_MAX_ATTEMPTS) {
                return;
            }
            webChannelInitTimer = window.setTimeout(() => {
                webChannelInitTimer = null;
                initWebChannel(reason);
            }, WEBCHANNEL_INIT_DELAY_MS);
        }

        function initWebChannel(reason = 'direct') {
            if (webChannelReady) {
                return;
            }

            webChannelInitAttempts += 1;
            const transport = window.qt && window.qt.webChannelTransport;
            if (typeof QWebChannel !== 'function') {
                if (webChannelInitAttempts === 1 || webChannelInitAttempts % 20 === 0) {
                    console.warn(`[Overlay] QWebChannel constructor not ready (${reason}, attempt ${webChannelInitAttempts}).`);
                }
                scheduleWebChannelInit('constructor-wait');
                return;
            }
            if (!transport) {
                if (webChannelInitAttempts === 1 || webChannelInitAttempts % 20 === 0) {
                    console.warn(`[Overlay] qt.webChannelTransport not ready (${reason}, attempt ${webChannelInitAttempts}).`);
                }
                scheduleWebChannelInit('transport-wait');
                return;
            }

            try {
                new QWebChannel(transport, function(channel) {
                    webChannelReady = true;
                    bridge = (channel && channel.objects && channel.objects.bridge) || createBridgePlaceholder();
                    console.log(`[Overlay] QWebChannel ready after ${webChannelInitAttempts} attempt(s).`);
                    if (bridge && typeof bridge.requestInitState === 'function') {
                        bridge.requestInitState();
                    }
                });
            } catch (error) {
                console.error(`[Overlay] Failed to initialize QWebChannel on attempt ${webChannelInitAttempts}:`, error);
                if (webChannelInitAttempts < WEBCHANNEL_INIT_MAX_ATTEMPTS) {
                    scheduleWebChannelInit('exception-retry');
                }
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => initWebChannel('dom-content-loaded'), { once: true });
        } else {
            initWebChannel('document-ready');

        function rgbToHex(r, g, b) {
            const toHex = value => Number(value).toString(16).padStart(2, '0').toUpperCase();
            return '#' + toHex(r) + toHex(g) + toHex(b);
        }

        function normalizeHexColor(color) {
            if (!color) return '';
            const raw = String(color).trim();
            if (raw.startsWith('#')) {
                if (raw.length === 4) {
                    return ('#' + raw[1] + raw[1] + raw[2] + raw[2] + raw[3] + raw[3]).toUpperCase();
                }
                return raw.toUpperCase();
            }
            const match = raw.match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i);
            if (!match) return raw.toUpperCase();
            return rgbToHex(match[1], match[2], match[3]);
        }

        function activateColorTab(tab) {
            const items = Array.from(document.querySelectorAll('.pivot-item'));
            const activeIndex = tab === 'highlight' ? 1 : 0;
            items.forEach((item, index) => item.classList.toggle('active', index === activeIndex));
            document.querySelectorAll('.pivot-content').forEach(content => {
                content.classList.toggle('active', content.id === 'tab-' + tab);
            });
        }

        function findColorOption(hex, preferredTab) {
            const normalized = normalizeHexColor(hex);
            if (preferredTab) {
                const tabContent = document.getElementById('tab-' + preferredTab);
                if (tabContent) {
                    const preferredMatch = Array.from(tabContent.querySelectorAll('.color-option')).find(opt =>
                        normalizeHexColor(window.getComputedStyle(opt).backgroundColor) === normalized
                    );
                    if (preferredMatch) return preferredMatch;
                }
            }
            return Array.from(document.querySelectorAll('.color-option')).find(opt =>
                normalizeHexColor(window.getComputedStyle(opt).backgroundColor) === normalized
            ) || null;
        }

        function syncColorPickerState() {
            const preset = PEN_COLOR_PRESETS[normalizeHexColor(currentPenColor && currentPenColor.hex)] || null;
            const displayColor = {
                ...(preset || {}),
                ...(currentPenColor || DEFAULT_PEN_COLOR)
            };

            if (!displayColor.tab) {
                displayColor.tab = (preset && preset.tab) || DEFAULT_PEN_COLOR.tab;
            }

            const matchedOption = findColorOption(displayColor.hex, displayColor.tab);

            activateColorTab(displayColor.tab);
            document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('active'));
            if (matchedOption) matchedOption.classList.add('active');

            updateColorInfo(
                displayColor.name || DEFAULT_PEN_COLOR.name,
                displayColor.rgb || DEFAULT_PEN_COLOR.rgb,
                normalizeHexColor(displayColor.hex || DEFAULT_PEN_COLOR.hex)
            );
            currentPenColor = displayColor;
        }

        function resetPenColorState() {
            currentPenColor = { ...DEFAULT_PEN_COLOR };

        let opacityHelperDiv = null;

        function applyOpacity() {
            if (!currentConfig) return;
            
            const toolbarOpacity = currentConfig.toolbarOpacity !== undefined ? currentConfig.toolbarOpacity : 1.0;
            const sidePageOpacity = currentConfig.sidePageOpacity !== undefined ? currentConfig.sidePageOpacity : 1.0;
            
            // Get base colors from CSS variables
            const rootStyle = getComputedStyle(document.documentElement);
            const toolbarBgVar = rootStyle.getPropertyValue('--overlay-toolbar-bg').trim();
            const pageBgVar = rootStyle.getPropertyValue('--overlay-page-bg').trim();
            
            function resolveColor(colorStr, opacity) {
                if (!colorStr) return '';
                
                if (!opacityHelperDiv) {
                    opacityHelperDiv = document.createElement('div');
                    opacityHelperDiv.style.visibility = 'hidden';
                    opacityHelperDiv.style.position = 'absolute';
                    opacityHelperDiv.style.pointerEvents = 'none';
                    document.body.appendChild(opacityHelperDiv);
                }
                
                opacityHelperDiv.style.color = colorStr;
                const computed = getComputedStyle(opacityHelperDiv).color;
                
                const match = computed.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
                if (match) {
                    let a = match[4] !== undefined ? parseFloat(match[4]) : 1;
                    a *= opacity;
                    return `rgba(${match[1]}, ${match[2]}, ${match[3]}, ${a})`;
                }
                return colorStr;
            }
            
            const toolbar = document.getElementById('toolbar');
            if (toolbar) {
                // Remove inline background-color if present (from previous version)
                toolbar.style.removeProperty('background-color');
                // Set the variable locally to override global value but respect CSS rules
                const newColor = resolveColor(toolbarBgVar, toolbarOpacity);
                toolbar.style.setProperty('--overlay-toolbar-bg', newColor);
            }
            
            document.querySelectorAll('.flipper').forEach(el => {
                el.style.removeProperty('background-color');
                const newColor = resolveColor(pageBgVar, sidePageOpacity);
                el.style.setProperty('--overlay-page-bg', newColor);
            });
        }

        function updateConfig(config) {
            currentConfig = config;
            applyAnimationPreference();
            
            applyOpacity();
            
            halfCollapseEnabled = config.toolbarAutoHalfCollapse || false;
            if (halfCollapseEnabled) {
                resetHalfCollapseTimer();
            } else {

                document.getElementById('toolbar-container').classList.remove('half-collapsed');
            }
            
            toggleStatusBar(config.showStatusBar);

            const toolbarContainer = document.getElementById('toolbar-container');
            if (!toolbarContainer.dataset.maskBound) {
                toolbarContainer.addEventListener('transitionend', () => scheduleMaskUpdate());
                toolbarContainer.dataset.maskBound = '1';
            }
            
            // Remove existing position classes
            toolbarContainer.classList.remove('pos-top', 'pos-bottom', 'pos-left', 'pos-right');
            
            // Add new position class
            const pos = config.toolbarPosition || 'bottom';
            toolbarContainer.classList.add('pos-' + pos);

            const flipperPos = config.flipperPosition || 'center';
            const leftFlipper = document.getElementById('left-flipper');
            const rightFlipper = document.getElementById('right-flipper');
            
            // Handle strict edge alignment
            const strictEdgeAlignment = config.strictEdgeAlignment || false;
            if (strictEdgeAlignment) {
                toolbarContainer.classList.add('strict-edge-alignment');
                [leftFlipper, rightFlipper].forEach(el => {
                    if (el) el.classList.add('strict-edge-alignment');
                });
            } else {
                toolbarContainer.classList.remove('strict-edge-alignment');
                [leftFlipper, rightFlipper].forEach(el => {
                    if (el) el.classList.remove('strict-edge-alignment');
                });
            }
            
            // Reset Flipper styles
            [leftFlipper, rightFlipper].forEach(el => {
                if (!el) return;
                el.classList.remove('flipper-bottom');
                // Don't reset transform here as it might be set by side toolbar logic later
                // But we should ensure we start clean if we switch modes
                if (flipperPos === 'center') {
                     el.style.position = '';
                     el.style.bottom = '';
                     el.style.left = '';
                     el.style.right = '';
                }
            });

            const toolbar = document.getElementById('toolbar');

            // Apply Scale and SafeArea
            const scale = config.scale || 1.0;
            const safeArea = strictEdgeAlignment ? 0 : (config.safeArea || 0);
            
            // Apply safe area to bottom flippers
            if (flipperPos === 'bottom') {
                 [leftFlipper, rightFlipper].forEach(el => {
                    if (!el) return;
                    el.classList.add('flipper-bottom');
                    el.style.bottom = (strictEdgeAlignment ? 0 : 20 + safeArea) + 'px';
                });
                
                if (leftFlipper) leftFlipper.style.left = (strictEdgeAlignment ? 0 : 20 + safeArea) + 'px';
                if (rightFlipper) rightFlipper.style.right = (strictEdgeAlignment ? 0 : 20 + safeArea) + 'px';
            }
            
            toolbar.style.transform = `scale(${scale})`;
            toolbar.style.transformOrigin = {
                'bottom': 'center bottom',
                'top': 'center top',
                'left': 'left center',
                'right': 'right center'
            }[pos] || 'center bottom';

            // Reset margins/padding
            toolbarContainer.style.paddingBottom = '';
            toolbarContainer.style.paddingTop = '';
            toolbarContainer.style.paddingLeft = '';
            toolbarContainer.style.paddingRight = '';

            if (pos === 'bottom') {
                toolbarContainer.style.paddingBottom = (strictEdgeAlignment ? 0 : 20 + safeArea) + 'px';
            } else if (pos === 'top') {
                toolbarContainer.style.paddingTop = (strictEdgeAlignment ? 0 : 20 + safeArea) + 'px';
            } else if (pos === 'left') {
                toolbarContainer.style.paddingLeft = (strictEdgeAlignment ? 0 : 20 + safeArea) + 'px';
            } else if (pos === 'right') {
                toolbarContainer.style.paddingRight = (strictEdgeAlignment ? 0 : 20 + safeArea) + 'px';
            }

            // Adjust center-area padding to avoid overlap with side toolbar
            const centerArea = document.getElementById('center-area');
            if (centerArea) {
                // Reset horizontal padding (previously added)
                centerArea.style.paddingLeft = '';
                centerArea.style.paddingRight = '';
                
                // Reset vertical padding
                centerArea.style.paddingTop = '';
                centerArea.style.paddingBottom = '';
                
                const leftFlipper = document.getElementById('left-flipper');
                const rightFlipper = document.getElementById('right-flipper');
                
                // Reset transforms
                if (leftFlipper) leftFlipper.style.transform = '';
                if (rightFlipper) rightFlipper.style.transform = '';
                
                // Reset Toolbar Container overrides
                toolbarContainer.style.justifyContent = '';
                toolbarContainer.style.paddingTop = '';
                toolbarContainer.style.paddingBottom = '';
                
                if (pos === 'left') {
                    // Toolbar to Bottom-ish
                    toolbarContainer.style.justifyContent = 'flex-end';
                    toolbarContainer.style.paddingBottom = `calc(${strictEdgeAlignment ? 0 : 20}px + ${strictEdgeAlignment ? 0 : safeArea}px)`;
                    
                    // Flipper to Top-ish (via transform)
                    // Only apply if NOT in bottom mode
                    if (flipperPos !== 'bottom') {
                        if (leftFlipper) {
                            leftFlipper.style.transform = `translateY(-15vh)`;
                        }
                    }
                } else if (pos === 'right') {
                    // Toolbar to Bottom-ish
                    toolbarContainer.style.justifyContent = 'flex-end';
                    toolbarContainer.style.paddingBottom = `calc(${strictEdgeAlignment ? 0 : 20}px + ${strictEdgeAlignment ? 0 : safeArea}px)`;
                    
                    // Flipper to Top-ish
                    // Only apply if NOT in bottom mode
                    if (flipperPos !== 'bottom') {
                        if (rightFlipper) {
                            rightFlipper.style.transform = `translateY(-15vh)`;

            // Apply PopWindowScale & Position

            const colorPicker = document.getElementById('color-picker');
            const eraserSettings = document.getElementById('eraser-settings');
            
            [colorPicker, eraserSettings].forEach(el => {
                if(!el) return;
                // Reset styles
                el.style.top = '';
                el.style.bottom = '';
                el.style.left = '';
                el.style.right = '';
                el.style.transform = '';
                el.style.transformOrigin = '';
                
                // Remove side-layout class by default (though now removed entirely)
                if (el.id === 'color-picker') el.classList.remove('side-layout');
                
                if (pos === 'bottom') {
                    el.style.top = 'auto';

                    el.style.transformOrigin = 'center bottom';

                    el.style.bottom = 'auto';
                    el.style.left = '50%';
                    el.style.transform = `translateX(-50%) scale(${popScale})`;
                    el.style.transformOrigin = 'center top';

                    el.style.top = 'auto';
                    el.style.bottom = '90px';
                    el.style.transform = `scale(${popScale})`;
                    el.style.transformOrigin = 'right bottom';

            const clearSlider = document.getElementById('clear-slider');

            if (config.disabledTools && config.disabledTools.includes('clear')) {
                if(clearSlider) clearSlider.classList.add('disabled');
                if(clearBtn) clearBtn.classList.add('disabled');
            } else {
                if(clearSlider) clearSlider.classList.remove('disabled');
                if(clearBtn) clearBtn.classList.remove('disabled');
            }

            if (config.clearMode === 'button') {
                if(clearSlider) clearSlider.style.display = 'none';
                if(clearBtn) clearBtn.style.display = 'flex';
            } else {
                if(clearSlider) clearSlider.style.display = 'flex';
                if(clearBtn) clearBtn.style.display = 'none';
            }

            toolbar.innerHTML = '';
            
            // Compatibility Mode Label
            if (config.compatibilityMode) {
                let compatLabel = document.createElement('div');
                compatLabel.className = 'compat-label';
                compatLabel.innerText = "兼";
                toolbar.appendChild(compatLabel);
            }

            const order = config.toolbarOrder || ["select", "pen", "eraser", "clear", "spotlight", "board_in_board", "timer", "apps"];
            
            order.forEach(item => {
                if (item === 'clear') return;
                
                if (config.compatibilityMode && (item === 'pen' || item === 'eraser')) return;

                if (item === 'spotlight' && !config.showSpotlight) return;
                if (item === 'board_in_board' && !config.showBoardInBoard) return;
                if (item === 'timer' && !config.showTimer) return;
                
                let btn = document.createElement('div');
                btn.className = 'tool-btn';
                btn.id = 'btn-' + item;
                
                if (config.disabledTools && config.disabledTools.includes(item)) {
                    btn.classList.add('disabled');
                }
                
                let iconClass = '';
                let clickHandler = '';

                
                switch(item) {
                    case 'select':
                        iconClass = 'icon-mouse';
                        clickHandler = "selectTool('select')";
                        if (currentTool === 'select') btn.classList.add('active');
                        break;
                    case 'pen':
                        iconClass = 'icon-pen';
                        clickHandler = "selectTool('pen')";
                        if (currentTool === 'pen') btn.classList.add('active');
                        break;
                    case 'eraser':
                        iconClass = 'icon-eraser';
                        clickHandler = "selectTool('eraser')";
                        if (currentTool === 'eraser') btn.classList.add('active');

                    case 'spotlight':
                        iconClass = 'icon-spotlight';

            document.getElementById('page-selector').classList.remove('visible');
            document.getElementById('media-popup').classList.remove('visible');

            document.getElementById('right-flipper').classList.remove('hidden-flipper');
            document.body.classList.remove('popup-active');
            const ae = document.activeElement;
            if (ae && typeof ae.blur === 'function') ae.blur();
            if (typeof bridge !== 'undefined' && bridge && typeof bridge.releaseFocus === 'function') {
                bridge.releaseFocus();
            }
            scheduleMaskUpdate();
        }

        function togglePageSelector(e) {
            if (e && typeof e.stopPropagation === 'function') {
                e.stopPropagation();
            }
            const selector = document.getElementById('page-selector');
            if (selector.classList.contains('visible')) {
                selector.classList.remove('visible');
                document.getElementById('left-flipper').classList.remove('hidden-flipper');
                document.getElementById('right-flipper').classList.remove('hidden-flipper');
                document.body.classList.remove('popup-active');
            } else {
                closePopup();
                
                // Only render if empty or page count changed
                const grid = document.getElementById('page-grid-content');
                if (grid.children.length !== totalPage) {
                    renderPageSelector();
                } else {
                    // Just update active state
                    document.querySelectorAll('.page-item').forEach((item, index) => {
                         if ((index + 1) === currentPage) item.classList.add('active');
                         else item.classList.remove('active');
                    });
                }
                
                selector.classList.add('visible');
                document.body.classList.add('popup-active');
                
                // Determine side based on click position
                let isLeft = false;
                if (e && e.clientX < window.innerWidth / 2) {
                    isLeft = true;
                }
                
                if (isLeft) {
                    selector.classList.add('left-side');
                    document.getElementById('left-flipper').classList.add('hidden-flipper');
                } else {
                    selector.classList.remove('left-side');
                    document.getElementById('right-flipper').classList.add('hidden-flipper');
                }
                
                // Force layout reset
                selector.setAttribute('style', '');
                selector.style.position = 'fixed';
                selector.style.top = '24px';
                selector.style.bottom = '24px';
                selector.style.width = '260px';
                selector.style.maxHeight = 'none';
                selector.style.borderRadius = '16px';
                selector.style.border = '1px solid var(--overlay-popup-border)';
                
                if (isLeft) {
                    selector.style.left = '16px';
                    selector.style.right = 'auto';
                } else {
                    selector.style.right = '16px';
                    selector.style.left = 'auto';
                }

                // Important: clear transform to allow CSS class to handle it
                // We need to do this slightly after adding the class to ensure transition works
                requestAnimationFrame(() => {
                    selector.style.transform = ''; 
                });

                // Notify backend about mask update to include the sidebar
                // We do this after a small delay to ensure the DOM has updated and transition started
                setTimeout(() => {
                    if (typeof sendMaskUpdate === 'function') sendMaskUpdate();
                }, motionDelay(50));

                if (typeof bridge !== 'undefined' && bridge && typeof bridge.resizeNudge === 'function') {
                    bridge.resizeNudge();
                }
                
                // Auto scroll to current page
                setTimeout(() => {
                    const activeItem = selector.querySelector('.page-item.active');
                    if (activeItem) {
                        activeItem.scrollIntoView({ block: 'center', behavior: motionBehavior() });
                    }
                }, motionDelay(300)); // Wait for transition

        // Tracks which thumbnails have been requested or are cached
        const thumbnailCache = new Set();
        
        function renderPageSelector() {
            const grid = document.getElementById('page-grid-content');
            grid.innerHTML = '';
            
            for (let i = 1; i <= totalPage; i++) {
                const item = document.createElement('div');
                item.className = 'page-item';
                if (i === currentPage) item.classList.add('active');
                
                const img = document.createElement('img');
                img.id = 'thumb-' + i;
                img.alt = 'Slide ' + i;
                
                // Loading Spinner
                const spinner = document.createElement('div');
                spinner.className = 'loading-spinner';
                spinner.id = 'spinner-' + i;
                spinner.innerHTML = `
                  <svg viewBox="0 0 27 27">
                    <circle class="spinner-ring" cx="13.5" cy="13.5" r="10"></circle>
                    <g class="spinner-orbit">
                      <circle class="spinner-dot" cx="13.5" cy="8.0" r="2.5"></circle>
                    </g>
                  </svg>
                `;
                
                const num = document.createElement('div');
                num.className = 'page-num';
                num.innerText = i;
                
                item.appendChild(spinner);
                item.appendChild(img);
                item.appendChild(num);
                item.onclick = () => selectPage(i);
                grid.appendChild(item);
            }
            
            // Request thumbnails for current page ±5 pages first
            requestThumbnailsForRange(
                Math.max(1, currentPage - 5),
                Math.min(totalPage, currentPage + 5)
            );
            
            // Setup scroll listener for dynamic loading
            const selector = document.getElementById('page-selector');
            const grid_el = document.getElementById('page-grid-content');
            if (selector && !selector._scrollListenerAttached) {
                selector.addEventListener('scroll', onPageGridScroll);
                selector._scrollListenerAttached = true;
            }
            
            // Start background caching
            startBackgroundThumbnailCaching();
        }
        
        function requestThumbnailsForRange(start, end) {
            for (let i = start; i <= end; i++) {
                if (!thumbnailCache.has(i)) {
                    thumbnailCache.add(i);
                    if (bridge && typeof bridge.requestThumbnail === 'function') {
                        bridge.requestThumbnail(i);
                    }
                }
            }
        }
        
        function onPageGridScroll() {
            const selector = document.getElementById('page-selector');
            if (!selector) return;
            
            const rect = selector.getBoundingClientRect();
            const scrollTop = selector.scrollTop;
            const itemHeight = 160; // Approximate height of page-item
            
            // Calculate visible range
            const visibleStart = Math.max(1, Math.floor(scrollTop / itemHeight));
            const visibleEnd = Math.min(totalPage, Math.ceil((scrollTop + selector.clientHeight) / itemHeight) + 2);
            
            // Request thumbnails for visible range ±3 pages
            const rangeStart = Math.max(1, visibleStart - 3);
            const rangeEnd = Math.min(totalPage, visibleEnd + 3);
            
            requestThumbnailsForRange(rangeStart, rangeEnd);
        }
        
        function startBackgroundThumbnailCaching() {
            // Start background caching if not already running
            if (window._thumbnailCachingRunning) return;
            window._thumbnailCachingRunning = true;
            
            if (bridge && typeof bridge.startBackgroundThumbnailCaching === 'function') {
                bridge.startBackgroundThumbnailCaching(totalPage);
            }
        }

        // Track whether the current PPT slide has remaining animation steps.

        let hasRemainingAnimation = false;

        function updatePageInfo(current, total) {
            currentPage = current;
            totalPage = total;
            
            const isCompat = currentConfig && currentConfig.compatibilityMode;

            if (isCompat) {
                document.getElementById('curr-page-l').innerText = '-';
                document.getElementById('total-page-l').innerText = '';
                document.getElementById('curr-page-r').innerText = '-';
                document.getElementById('total-page-r').innerText = '';
            } else {
                document.getElementById('curr-page-l').innerText = current;
                document.getElementById('total-page-l').innerText = '/' + total;
                document.getElementById('curr-page-r').innerText = current;
                document.getElementById('total-page-r').innerText = '/' + total;
            }
            
            // If selector is visible, update active state
            // If page count changed, clear grid so next toggle rebuilds it
            const grid = document.getElementById('page-grid-content');
            if (!isCompat && grid.children.length > 0 && grid.children.length !== total) {
                 grid.innerHTML = ''; // Force rebuild next time
            } else if (grid.children.length > 0) {
                 document.querySelectorAll('.page-item').forEach((item, index) => {
                     if ((index + 1) === currentPage) item.classList.add('active');
                     else item.classList.remove('active');
                 });
            }
            
            const disabledTools = (currentConfig && currentConfig.disabledTools) ? currentConfig.disabledTools : [];
            
            // Fix: Select only previous buttons (left arrow)
            const allBtns = document.querySelectorAll('.flipper-btn');
            
            allBtns.forEach(btn => {
                const isPrev = btn.querySelector('.icon-previous');
                const isNext = btn.querySelector('.icon-next');
                
                if (isPrev) {
                    if ((!isCompat && current <= 1) || disabledTools.includes('prev')) {
                        btn.classList.add('disabled');
                    } else {
                        btn.classList.remove('disabled');
                    }
                } else if (isNext) {
                    // Keep next enabled on the last slide if animations are still pending
                    const atLastSlide = !isCompat && current >= total;
                    const nextBlocked = atLastSlide && !hasRemainingAnimation;
                    if (nextBlocked || disabledTools.includes('next')) {
                        btn.classList.add('disabled');
                    } else {
                        btn.classList.remove('disabled');
                    }
                }
            });
        }

        function updateAnimationInfo(hasRemaining) {
            hasRemainingAnimation = !!hasRemaining;
            // Re-evaluate the next button state with the new info.
            updatePageInfo(currentPage, totalPage);
        }

        function setTheme(isDark, accentColor, themeId) {
            const variant = isDark ? 'dark' : 'light';
            
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');

        function getStatusDisplayChar(char) {
            return char === ' ' ? '\u00A0' : char;
        }

        function getStatusLogicalChar(text) {
            return String(text || '').replace(/\u00A0/g, ' ');
        }

        function updateStatusDisplay(element, newText, animateAll = false) {
            if (!element) return;
            const chars = newText.split('');
            const wrappers = element.querySelectorAll('.status-digit-wrapper');
            const charCount = chars.filter(c => c !== '|').length;

            // If length mismatch, rebuild
            if (wrappers.length !== charCount) {
                element.innerHTML = '';
                chars.forEach(char => {
                    if (char === '|') {
                        const sep = document.createElement('span');
                        sep.className = 'status-separator';
                        element.appendChild(sep);
                    } else {
                        const wrap = document.createElement('span');
                        wrap.className = 'status-digit-wrapper';
                        const span = document.createElement('span');
                        span.textContent = getStatusDisplayChar(char);
                        wrap.appendChild(span);
                        element.appendChild(wrap);
                    }
                });
                return;
            }

            // Update existing - map chars to wrappers, skipping '|'
            let wrapperIndex = 0;
            chars.forEach(char => {
                if (char === '|') return;
                
                const wrap = wrappers[wrapperIndex++];
                if (!wrap) return;
                
                const currentSpan = wrap.firstElementChild;
                if (!currentSpan) return;
                
                // Check if value changed
                if (getStatusLogicalChar(currentSpan.textContent) !== char) {
                    // Only animate digits (0-9), not letters or symbols when animateAll is false
                    const isDigit = /\d/.test(char);
                    const shouldAnimate = !animationsDisabled() && (animateAll || isDigit);
                    
                    if (shouldAnimate && !currentSpan.classList.contains('status-digit-old')) {
                        const newSpan = document.createElement('span');
                        newSpan.textContent = getStatusDisplayChar(char);
                        newSpan.className = 'status-digit-new';

                        currentSpan.className = 'status-digit-old';
                        wrap.appendChild(newSpan);

                        setTimeout(() => {
                            if (currentSpan.parentNode === wrap) {
                                wrap.removeChild(currentSpan);
                            }
                            newSpan.className = '';
                        }, motionDelay(350));
                    } else {
                        currentSpan.textContent = getStatusDisplayChar(char);
                    }
                }
            });
        }

        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayMap = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const day = dayMap[now.getDay()];
            
            let timeString = '';
            
            // Check if showTime config exists, default to true if not set
            const showTime = currentConfig ? (currentConfig.statusBarShowTime !== false) : true;
            const showSeconds = currentConfig ? currentConfig.statusBarShowSeconds : false;
            
            if (showTime) {
                if (showSeconds) {
                    timeString = `${hours}:${minutes}:${seconds}|${month}月${date}日 ${day}`;
                } else {
                    timeString = `${hours}:${minutes}|${month}月${date}日 ${day}`;
                }
            }
            
            const timeDisplay = document.getElementById('time-display');
            if (timeDisplay) {
                // Only update if text actually changes
                if (timeString !== lastTimeString) {
                    updateStatusDisplay(timeDisplay, timeString);
                    lastTimeString = timeString;
                }
                timeDisplay.style.display = showTime ? 'inline' : 'none';
            }
        }

        function updateTimerStatus() {
            try {
                const timerDisplay = document.getElementById('timer-display');
                const timerArea = document.getElementById('timer-area');
                if (!timerDisplay || !timerArea) return;

                // Get timer state from bridge
                bridge.getTimerState(function(result) {
                    try {
                        const state = JSON.parse(result);
                        if (state.isRunning && state.totalSeconds > 0) {
                            timerDisplay.textContent = state.displayText;
                            timerArea.classList.add('active');
                        } else {
                            timerArea.classList.remove('active');
                        }
                    } catch (e) {
                        console.error('Error parsing timer state:', e);
                    }
                });
            } catch (e) {
                console.error('Error updating timer status:', e);
            }
        }
        
        // Update every 500ms to catch second changes faster
        setInterval(updateTime, 500);
        setInterval(updateTimerStatus, 200); // More frequent for timer
        updateTime();

        function formatMusicTime(totalSeconds) {
            const wholeSeconds = Math.max(0, Math.floor(Number(totalSeconds) || 0));
            const minutes = Math.floor(wholeSeconds / 60);
            const seconds = wholeSeconds % 60;
            return `${minutes}分${String(seconds).padStart(2, '0')}秒`;
        }

        function hideMusicStatus() {
            const smtcItem = document.getElementById('status-smtc');
            const smtcText = smtcItem ? smtcItem.querySelector('.status-text') : null;
            const musicIcon = document.getElementById('smtc-music-icon');
            const artworkThumb = document.getElementById('smtc-artwork-thumb');
            if (smtcItem) smtcItem.style.display = 'none';
            if (smtcText) smtcText.textContent = '';
            if (artworkThumb) {
                artworkThumb.src = '';
                artworkThumb.style.display = 'none';

            if (musicIcon) musicIcon.style.display = '';
            lastStatusValues.music = '';
            lastStatusValues.musicBase = '';

        function renderMusicStatus(flipTitle = false) {
            const showMusic = currentConfig ? (currentConfig.statusBarShowMusic !== false) : true;
            const smtcItem = document.getElementById('status-smtc');
            const smtcText = smtcItem ? smtcItem.querySelector('.status-text') : null;
            const musicIcon = document.getElementById('smtc-music-icon');
            const artworkThumb = document.getElementById('smtc-artwork-thumb');
            if (!smtcItem || !smtcText) return;

            if (!showMusic || !currentMusicState.visible) {
                hideMusicStatus();
                return;
            }

            smtcItem.style.display = 'flex';

            if (artworkThumb && currentMusicState.artworkDataUrl) {
                if (lastStatusArtworkUrl !== currentMusicState.artworkDataUrl) {
                    artworkThumb.src = currentMusicState.artworkDataUrl;
                    lastStatusArtworkUrl = currentMusicState.artworkDataUrl;
                }
                artworkThumb.style.display = '';
                if (musicIcon) musicIcon.style.display = 'none';
            } else {
                if (artworkThumb) {
                    if (lastStatusArtworkUrl !== '') {
                        artworkThumb.src = '';
                        lastStatusArtworkUrl = '';
                    }
                    artworkThumb.style.display = 'none';
                }
                if (musicIcon) musicIcon.style.display = '';
            }

            const newMusicText = buildMusicStatusText({
                smtc_title: currentMusicState.baseText,
                smtc_status: currentMusicState.status
            });
            if (!newMusicText) {
                hideMusicStatus();
                return;
            }
            if (smtcText.textContent === newMusicText) {
                return;
            }

            const updateMusicDigits = () => {
                updateStatusDisplay(smtcText, newMusicText);
                lastStatusValues.music = newMusicText;
                lastStatusValues.musicBase = currentMusicState.baseText;
            };

            if (flipTitle && !animationsDisabled() && lastStatusValues.musicBase !== currentMusicState.baseText) {
                smtcText.classList.remove('status-music-flip-in');
                smtcText.classList.add('status-music-flip');

                setTimeout(() => {
                    smtcText.textContent = '';
                    updateMusicDigits();
                    smtcText.classList.remove('status-music-flip');
                    smtcText.classList.add('status-music-flip-in');

                    setTimeout(() => {
                        smtcText.classList.remove('status-music-flip-in');
                    }, motionDelay(300));
                }, motionDelay(30));
                return;
            }

            updateMusicDigits();
            
            if (isMediaPopupVisible) {
                updateMediaPopupPosition();
            }
        }
