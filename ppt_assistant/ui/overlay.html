        function initInkCanvas() {
            if (inkCanvasInited) return;
            inkCanvasInited = true;

            const canvas = document.getElementById('ink-canvas');
            if (!canvas) return;

            // Get device pixel ratio for sharp rendering
            function setupCanvas() {
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                inkCtx = canvas.getContext('2d');
                inkCtx.scale(dpr, dpr);
            }

            setupCanvas();
            window.addEventListener('resize', () => {
                setupCanvas();
                redrawAllStrokes();
                // While the pen is inactive, strokes are shown via the static background.
                // Regenerate that snapshot after a resize so it matches the new canvas.
                if (!inkActive && inkStrokes.length > 0) {
                    const bg = document.getElementById('ink-stroke-bg');
                    const cvs = document.getElementById('ink-canvas');
                    if (bg && cvs) {
                        const dataUrl = cvs.toDataURL();
                        bg.style.backgroundImage = 'url(' + dataUrl + ')';
                        // Sync the standalone StrokeBgWindow so it matches the new canvas.
                        if (typeof bridge !== 'undefined' && bridge && typeof bridge.showStrokeBg === 'function') {
                            try { bridge.showStrokeBg(dataUrl); } catch (e) {}
                        }
                    }
                }
            });

            // ── Pointer event handlers ──────────────────────────────────
            function getPos(e) {
                return { x: e.clientX, y: e.clientY };
            }

            function startStroke(e) {
                if (!inkActive) return;
                e.preventDefault();
                const pos = getPos(e);
                inkIsDrawing = true;
                inkCurrentStroke = {
                    points: [pos],
                    color: getCurrentInkColor(),
                    width: getCurrentInkWidth(),
                    mode: getCurrentInkMode(),
                    strokeId: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                };
                // Lock Y for highlighter — purely horizontal stroke
                if (inkCurrentStroke.mode === INK_MODE_HIGHLIGHT) {
                    inkCurrentStroke.lockedY = pos.y;
                }
            }

            function moveStroke(e) {
                if (!inkIsDrawing || !inkActive) return;
                e.preventDefault();
                const pos = getPos(e);
                // Highlighter: lock Y to starting position for pure horizontal motion
                if (inkCurrentStroke.mode === INK_MODE_HIGHLIGHT) {
                    pos.y = inkCurrentStroke.lockedY;
                }
                const last = inkCurrentStroke.points[inkCurrentStroke.points.length - 1];
                inkCurrentStroke.points.push(pos);
                drawSegment(last, pos, inkCurrentStroke);
            }

            function endStroke(e) {
                if (!inkIsDrawing) return;
                inkIsDrawing = false;
                if (inkCurrentStroke && inkCurrentStroke.points.length > 0) {
                    inkStrokes.push(inkCurrentStroke);
                    // Prevent unbounded memory growth
                    if (inkStrokes.length > INK_STROKES_MAX) {
                        inkStrokes.splice(0, inkStrokes.length - INK_STROKES_MAX);
                    }
                }
                inkCurrentStroke = null;
            }

            // Register pointer events (captures pen, touch, mouse)
            canvas.addEventListener('pointerdown', startStroke);
            canvas.addEventListener('pointermove', moveStroke);
            canvas.addEventListener('pointerup', endStroke);
            canvas.addEventListener('pointerleave', endStroke);
            canvas.addEventListener('pointercancel', endStroke);

            // Prevent default touch behavior (scrolling)
            canvas.addEventListener('touchstart', e => { if (inkActive) e.preventDefault(); }, { passive: false });
            canvas.addEventListener('touchmove', e => { if (inkActive) e.preventDefault(); }, { passive: false });
        }

        function getCurrentInkColor() {
            // In self-developed mode, prefer config-driven colors (inkPenColor / inkHighlightColor)
            // so settings-page changes take effect immediately. Fall back to currentPenColor.hex
            // (and ultimately '#000000') if the config color is empty.
            if ((currentConfig || {}).penMode === 'self-developed') {
                if (getCurrentInkMode() === INK_MODE_HIGHLIGHT) {
                    return inkHighlightColor || (currentPenColor && currentPenColor.hex) || '#FFFF00';
                }
                return inkPenColor || (currentPenColor && currentPenColor.hex) || '#000000';
            }
            const raw = currentPenColor && currentPenColor.hex;
            return raw || '#000000';
        }

        function getCurrentInkWidth() {
            const mode = getCurrentInkMode();
            if (mode === INK_MODE_HIGHLIGHT) return inkHighlightWidth;
            if (mode === INK_MODE_ERASER) return inkEraserWidth;
            return inkPenWidth;
        }

        function getCurrentInkMode() {
            if (currentTool === 'highlight') return INK_MODE_HIGHLIGHT;
            if (currentTool === 'eraser') return INK_MODE_ERASER;
            return INK_MODE_PEN;
        }

        // SelfPen rendering hooks (variables ready, algorithms to be implemented):
        // - selfPenFrameRateMode: throttle/RAF scheduling
        // - selfPenPenEffect: pressure/velocity-based width modulation
        // - selfPenPalmErase: multi-touch palm erasure
        function drawSegment(p1, p2, stroke) {
            if (!inkCtx) return;
            const ctx = inkCtx;
            ctx.save();

            if (stroke.mode === INK_MODE_ERASER) {
                // Eraser: use destination-out compositing
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
                ctx.lineWidth = stroke.width;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            } else if (stroke.mode === INK_MODE_HIGHLIGHT) {
                // Highlighter: flat rectangular stroke like real chisel-tip pen
                const color = stroke.color || '#FFFF00';
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
                ctx.globalAlpha = inkHighlightOpacity;
                ctx.lineWidth = stroke.width;
                ctx.lineCap = 'butt';
                ctx.lineJoin = 'miter';
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            } else {
                // Normal pen
                const color = stroke.color || '#000000';
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
                ctx.globalAlpha = 1.0;
                ctx.lineWidth = stroke.width;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }

            ctx.restore();
        }

        function redrawAllStrokes() {
            if (!inkCtx) return;
            const canvas = document.getElementById('ink-canvas');
            if (!canvas) return;
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            inkCtx = canvas.getContext('2d');
            inkCtx.scale(dpr, dpr);

            for (const stroke of inkStrokes) {
                if (stroke.mode === INK_MODE_ERASER) {
                    // For eraser strokes, we need to re-apply over existing strokes
                    // This is approximate: just draw eraser with destination-out
                    for (let i = 1; i < stroke.points.length; i++) {
                        drawSegment(stroke.points[i - 1], stroke.points[i], stroke);
                    }
                } else {
                    for (let i = 1; i < stroke.points.length; i++) {
                        drawSegment(stroke.points[i - 1], stroke.points[i], stroke);
                    }
                }
            }
        }

        function clearInkCanvas() {
            if (!inkCtx) return;
            const canvas = document.getElementById('ink-canvas');
            if (!canvas) return;
            inkCtx.clearRect(0, 0, canvas.width, canvas.height);
            inkStrokes = [];
            inkCurrentStroke = null;
            inkIsDrawing = false;
            // Clear static stroke background too
            const bg = document.getElementById('ink-stroke-bg');
            if (bg) bg.style.backgroundImage = '';
            // Hide standalone stroke bg window
            if (typeof bridge !== 'undefined' && bridge && typeof bridge.hideStrokeBg === 'function') {
                try { bridge.hideStrokeBg(); } catch (e) {}
            }
            sendMaskUpdate();
        }

        function clearAllInkState() {
            clearInkCanvas();
            for (const key of Object.keys(perPageStrokes)) {
                delete perPageStrokes[key];
            }
            currentPage = 0;
        }

        function syncInkCanvasMode() {
            const config = currentConfig || {};
            const isSelfDev = config.penMode === 'self-developed';
            const isPenTool = (currentTool === 'pen' || currentTool === 'highlight' || currentTool === 'eraser');
            inkActive = isSelfDev && isPenTool;

            const canvas = document.getElementById('ink-canvas');
            if (!canvas) return;

            if (inkActive) {
                // Clear static stroke bg so live canvas is visible
                const bg = document.getElementById('ink-stroke-bg');
                if (bg) bg.style.backgroundImage = '';
                canvas.classList.add('active');
                // Set cursor based on tool
                if (currentTool === 'eraser') {
                    canvas.style.cursor = 'cell';
                } else {
                    canvas.style.cursor = 'crosshair';
                }
                // Replay stored strokes onto the live canvas — setupCanvas() may have
                // cleared it (resetting canvas.width/height wipes all content), so
                // without this the previously drawn strokes would be invisible.
                if (inkStrokes.length > 0) {
                    try { redrawAllStrokes(); } catch (e) { console.error('[InkPage] redraw on activate:', e); }
                }
                // Hide the standalone stroke bg window — the live canvas takes over
                if (typeof bridge !== 'undefined' && bridge && typeof bridge.hideStrokeBg === 'function') {
                    try { bridge.hideStrokeBg(); } catch (e) {}
                }
            } else {
                canvas.classList.remove('active');
                canvas.style.cursor = 'crosshair';
                // Snapshot canvas strokes into a standalone transparent window so
                // they stay visible even after overlay mask shrinks to toolbar-only
                // (Qt setMask clips visual output outside the mask region).
                if (inkStrokes.length > 0 && isSelfDev) {
                    try { redrawAllStrokes(); } catch (e) { console.error('[InkPage] redraw before snapshot:', e); }
                    // Also set the in-page bg as a fallback (harmless if clipped by mask)
                    const bg = document.getElementById('ink-stroke-bg');
                    // Synchronous so showStrokeBg runs before sendMaskUpdate() shrinks the mask (avoids flicker).
                    var dataUrl = canvas.toDataURL();
                    if (bg) bg.style.backgroundImage = 'url(' + dataUrl + ')';
                    if (typeof bridge !== 'undefined' && bridge && typeof bridge.showStrokeBg === 'function') {
                        try { bridge.showStrokeBg(dataUrl); } catch (e) {}
                    }
                } else {
                    // No strokes → hide standalone stroke bg window
                    if (typeof bridge !== 'undefined' && bridge && typeof bridge.hideStrokeBg === 'function') {
                        try { bridge.hideStrokeBg(); } catch (e) {}
                    }
                }
            }
            // Update window mask: full-screen when drawing, toolbar-only otherwise
            sendMaskUpdate();
        }

        function handleClearScreen() {
            const selfDev = (currentConfig || {}).penMode === 'self-developed';
            if (selfDev) {
                clearInkCanvas();
            } else if (bridge) {
                bridge.clearScreen(window.noop);
            }
        }

        function positionThicknessPanel(anchorEl) {
            const panel = document.getElementById('thickness-panel');
            if (!panel || !anchorEl) return;
            const anchorRect = anchorEl.getBoundingClientRect();
            const gap = 8;
            // Match panel height to anchor so slider fills the same vertical space
            panel.style.height = anchorRect.height + 'px';
            const panelRect = panel.getBoundingClientRect();
            let left = anchorRect.right + gap;
            // Flip to left side if overflow right edge
            if (left + panelRect.width > window.innerWidth) {
                left = anchorRect.left - panelRect.width - gap;
            }
            // Vertical: align tops
            let top = anchorRect.top;
            // If overflows bottom, shift up
            if (top + panelRect.height > window.innerHeight) {
                top = window.innerHeight - panelRect.height - 8;
            }
            if (top < 8) top = 8;
            panel.style.left = left + 'px';
            panel.style.top = top + 'px';
        }

        function closePopup() {
            document.getElementById('color-picker').classList.remove('visible');
            document.getElementById('eraser-settings').classList.remove('visible');
            document.getElementById('thickness-panel').classList.remove('visible');
            document.getElementById('page-selector').classList.remove('visible');
            document.getElementById('media-popup').classList.remove('visible');
            isMediaPopupVisible = false;
            document.getElementById('left-flipper').classList.remove('hidden-flipper');
            document.getElementById('right-flipper').classList.remove('hidden-flipper');
            document.body.classList.remove('popup-active');
            const ae = document.activeElement;
            if (ae && typeof ae.blur === 'function') ae.blur();
            if (typeof bridge !== 'undefined' && bridge && typeof bridge.releaseFocus === 'function') {
                bridge.releaseFocus();
            }
            scheduleMaskUpdate();
        }

        function togglePageSelector(e) {
            if (e && typeof e.stopPropagation === 'function') {
                e.stopPropagation();
            }
            const selector = document.getElementById('page-selector');
            if (selector.classList.contains('visible')) {
                selector.classList.remove('visible');
                document.getElementById('left-flipper').classList.remove('hidden-flipper');
                document.getElementById('right-flipper').classList.remove('hidden-flipper');
                document.body.classList.remove('popup-active');
            } else {
                closePopup();
                
                // Only render if empty or page count changed
                const grid = document.getElementById('page-grid-content');
                if (grid.children.length !== totalPage) {
                    renderPageSelector();
                } else {
                    // Just update active state
                    document.querySelectorAll('.page-item').forEach((item, index) => {
                         if ((index + 1) === currentPage) item.classList.add('active');
                         else item.classList.remove('active');
                    });
                }
                
                selector.classList.add('visible');
                document.body.classList.add('popup-active');
                
                // Determine side based on click position
                let isLeft = false;
                if (e && e.clientX < window.innerWidth / 2) {
                    isLeft = true;
                }
                
                if (isLeft) {
                    selector.classList.add('left-side');
                    document.getElementById('left-flipper').classList.add('hidden-flipper');
                } else {
                    selector.classList.remove('left-side');
                    document.getElementById('right-flipper').classList.add('hidden-flipper');
                }
                
                // Force layout reset
                selector.setAttribute('style', '');
                selector.style.position = 'fixed';
                selector.style.top = '24px';
                selector.style.bottom = '24px';
                selector.style.width = '260px';
                selector.style.maxHeight = 'none';
                selector.style.borderRadius = '16px';
                selector.style.border = '1px solid var(--overlay-popup-border)';
                
                if (isLeft) {
                    selector.style.left = '16px';
                    selector.style.right = 'auto';
                } else {
                    selector.style.right = '16px';
                    selector.style.left = 'auto';
                }

                // Important: clear transform to allow CSS class to handle it
                // We need to do this slightly after adding the class to ensure transition works
                requestAnimationFrame(() => {
                    selector.style.transform = ''; 
                });

                // Notify backend about mask update to include the sidebar
                // We do this after a small delay to ensure the DOM has updated and transition started
                setTimeout(() => {
                    if (typeof sendMaskUpdate === 'function') sendMaskUpdate();
                }, motionDelay(50));

                if (typeof bridge !== 'undefined' && bridge && typeof bridge.resizeNudge === 'function') {
                    bridge.resizeNudge();
                }
                
                // Auto scroll to current page
                setTimeout(() => {
                    const activeItem = selector.querySelector('.page-item.active');
                    if (activeItem) {
                        activeItem.scrollIntoView({ block: 'center', behavior: motionBehavior() });
                    }
                }, motionDelay(300)); // Wait for transition
            }
        }

        // Tracks which thumbnails have been requested or are cached
        const thumbnailCache = new Set();
        
        function renderPageSelector() {
            const grid = document.getElementById('page-grid-content');
            grid.innerHTML = '';
            
            for (let i = 1; i <= totalPage; i++) {
                const item = document.createElement('div');
                item.className = 'page-item';
                if (i === currentPage) item.classList.add('active');
                
                const img = document.createElement('img');
                img.id = 'thumb-' + i;
                img.alt = 'Slide ' + i;
                
                // Loading Spinner
                const spinner = document.createElement('div');
                spinner.className = 'loading-spinner';
                spinner.id = 'spinner-' + i;
                spinner.innerHTML = `
                  <svg viewBox="0 0 27 27">
                    <circle class="spinner-ring" cx="13.5" cy="13.5" r="10"></circle>
                    <g class="spinner-orbit">
                      <circle class="spinner-dot" cx="13.5" cy="8.0" r="2.5"></circle>
                    </g>
                  </svg>
                `;
                
                const num = document.createElement('div');
                num.className = 'page-num';
                num.innerText = i;
                
                item.appendChild(spinner);
                item.appendChild(img);
                item.appendChild(num);
                item.onclick = () => selectPage(i);
                grid.appendChild(item);
            }
            
            // Request thumbnails for current page ±5 pages first
            requestThumbnailsForRange(
                Math.max(1, currentPage - 5),
                Math.min(totalPage, currentPage + 5)
            );
            
            // Setup scroll listener for dynamic loading
            const selector = document.getElementById('page-selector');
            const grid_el = document.getElementById('page-grid-content');
            if (selector && !selector._scrollListenerAttached) {
                selector.addEventListener('scroll', onPageGridScroll);
                selector._scrollListenerAttached = true;
            }
            
            // Start background caching
            startBackgroundThumbnailCaching();
        }
        
        function requestThumbnailsForRange(start, end) {
            for (let i = start; i <= end; i++) {
                if (!thumbnailCache.has(i)) {
                    thumbnailCache.add(i);
                    if (bridge && typeof bridge.requestThumbnail === 'function') {
                        bridge.requestThumbnail(i);
                    }
                }
            }
        }
        
        function onPageGridScroll() {
            const selector = document.getElementById('page-selector');
            if (!selector) return;
            
            const rect = selector.getBoundingClientRect();
            const scrollTop = selector.scrollTop;
            const itemHeight = 160; // Approximate height of page-item
            
            // Calculate visible range
            const visibleStart = Math.max(1, Math.floor(scrollTop / itemHeight));
            const visibleEnd = Math.min(totalPage, Math.ceil((scrollTop + selector.clientHeight) / itemHeight) + 2);
            
            // Request thumbnails for visible range ±3 pages
            const rangeStart = Math.max(1, visibleStart - 3);
            const rangeEnd = Math.min(totalPage, visibleEnd + 3);
            
            requestThumbnailsForRange(rangeStart, rangeEnd);
        }
        
        function startBackgroundThumbnailCaching() {
            // Start background caching if not already running
            if (window._thumbnailCachingRunning) return;
            window._thumbnailCachingRunning = true;
            
            if (bridge && typeof bridge.startBackgroundThumbnailCaching === 'function') {
                bridge.startBackgroundThumbnailCaching(totalPage);
            }
        }

        function updatePageThumbnail(index, url) {
            const img = document.getElementById('thumb-' + index);
            const spinner = document.getElementById('spinner-' + index);
            if (img) {
                img.src = url;
                img.onload = () => {
                    img.classList.add('loaded');
                    if (spinner) spinner.classList.add('hidden');
                };
            }
        }

        function selectPage(page) {
            if (bridge && typeof bridge.gotoSlide === 'function') {
                bridge.gotoSlide(page);
            }
            closePopup();
        }

        function setActiveToolUI(tool) {
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            const btnId = (tool === 'highlight') ? 'pen' : tool;
            const btn = document.getElementById('btn-' + btnId);
            if (btn) btn.classList.add('active');
            currentTool = tool;
        }

        function resetToolState(tool) {
            closePopup();
            setActiveToolUI(tool || 'select');
            syncInkCanvasMode();
        }

        function selectTool(tool) {
            const picker = document.getElementById('color-picker');
            const eraserSettings = document.getElementById('eraser-settings');

            if ((tool === 'pen' || tool === 'highlight') && (currentTool === 'pen' || currentTool === 'highlight')) {
                if (picker.classList.contains('visible')) {
                    closePopup();
                } else {
                    closePopup();
                    syncColorPickerState();
                    picker.classList.add('visible');
                    syncThicknessPanelContent();
                    document.body.classList.add('popup-active');
                    if (typeof sendMaskUpdate === 'function') sendMaskUpdate();
                    if (typeof bridge !== 'undefined' && bridge && typeof bridge.resizeNudge === 'function') {
                        bridge.resizeNudge();
                    }
                }
                return;
            } else if (tool === 'eraser' && currentTool === 'eraser') {
                 if (eraserSettings.classList.contains('visible')) {
                     closePopup();
                 } else {
                     closePopup();
                     eraserSettings.classList.add('visible');
                     document.body.classList.add('popup-active');
                     if (typeof sendMaskUpdate === 'function') sendMaskUpdate();
                     if (typeof bridge !== 'undefined' && bridge && typeof bridge.resizeNudge === 'function') {
                         bridge.resizeNudge();
                     }
                 }
                 return;
            } else {
                closePopup();
            }

            currentTool = tool;
            setActiveToolUI(tool);
            syncInkCanvasMode();
            
            if (bridge) {
                const cfg = currentConfig || {};
                const isSelfDev = cfg.penMode === 'self-developed';
                if (tool === 'select') {
                    bridge.setTool('arrow');
                } else if (!isSelfDev) {
                    // COM mode: delegate pen/eraser to PowerPoint
                    if (tool === 'pen') bridge.setTool('pen');
                    else if (tool === 'highlight') bridge.setTool('highlight');
                    else if (tool === 'eraser') bridge.setTool('eraser');
                }
                // Self-developed mode: skip bridge for pen/highlight/eraser — canvas handles it
            }
        }
        
        function selectColor(r, g, b, el) {
            document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('active'));
            if(el) el.classList.add('active');
            const hex = rgbToHex(r, g, b);
            const selectedTab = el && el.closest('.pivot-content')
                ? el.closest('.pivot-content').id.replace('tab-', '')
                : DEFAULT_PEN_COLOR.tab;
            const isComMode = (currentConfig || {}).penMode !== 'self-developed';
            if (isComMode && selectedTab === 'highlight') {
                // COM 模式无法通过 COM 接口更改荧光笔颜色，忽略此次选色
                closePopup();
                return;
            }
            currentPenColor = PEN_COLOR_PRESETS[hex]
                ? { ...PEN_COLOR_PRESETS[hex], tab: selectedTab }
                : { tab: selectedTab, name: '当前颜色', rgb: `${r} ${g} ${b}`, hex };
            syncColorPickerState();
            
            const tool = selectedTab === 'highlight' ? 'highlight' : 'pen';
            if (currentTool !== tool) {
                currentTool = tool;
                if (bridge) {
                    const selfDev = (currentConfig || {}).penMode === 'self-developed';
                    if (!selfDev) bridge.setTool(tool);
                }
                syncInkCanvasMode();
            }
            
            if (bridge) {
                const selfDev = (currentConfig || {}).penMode === 'self-developed';
                if (!selfDev) bridge.setPenColor(r, g, b);
                if (selfDev && bridge && bridge.setSelfPenSetting) {
                    if (currentPenColor.tab === 'highlight') bridge.setSelfPenSetting('HighlightColor', currentPenColor.hex);
                    else bridge.setSelfPenSetting('PenColor', currentPenColor.hex);
                }
            }
            closePopup();
        }


        function switchColorTab(tab, el) {
            activateColorTab(tab);
            const matchedOption = findColorOption(currentPenColor && currentPenColor.hex, tab);
            if (!matchedOption) {
                currentPenColor = getDefaultColorForTab(tab);
            } else {
                currentPenColor = {
                    ...(currentPenColor || {}),
                    tab
                };
            }
            syncColorPickerState();

            const tool = tab === 'highlight' ? 'highlight' : 'pen';
            if (currentTool !== tool) {
                currentTool = tool;
                setActiveToolUI(tool);
                if (bridge) {
                    const selfDev = (currentConfig || {}).penMode === 'self-developed';
                    if (!selfDev) bridge.setTool(tool);
                }
            }
            syncHighlightColorAvailability();
            syncThicknessPanelContent();
        }

        function updateColorInfo(name, rgb, hex) {
            document.getElementById('info-name').innerText = name;
            document.getElementById('info-rgb').innerText = 'RGB (' + rgb + ')';
            document.getElementById('info-hex').innerText = hex;
        }

        // Track whether the current PPT slide has remaining animation steps.
        // Updated by the Python backend via updateAnimationInfo().
        let hasRemainingAnimation = false;

        // ─── Per-page ink stroke storage ─────────────────────────────────
        const perPageStrokes = {};

        function saveInkPageState(page) {
            if (!page) return;
            const isSelfDev = (currentConfig || {}).penMode === 'self-developed';
            if (!isSelfDev) return;
            perPageStrokes[page] = {
                strokes: inkStrokes.length > 0 ? [...inkStrokes] : [],
                snapshot: null
            };
        }

        function restoreInkPageState(page) {
            const isSelfDev = (currentConfig || {}).penMode === 'self-developed';
            if (!isSelfDev) return;
            const data = perPageStrokes[page];
            const canvas = document.getElementById('ink-canvas');
            const bg = document.getElementById('ink-stroke-bg');
            if (!canvas || !bg) return;

            if (!data || (data.strokes.length === 0 && !data.snapshot)) {
                clearInkCanvas();
                return;
            }

            // Restore stroke data
            inkStrokes = data.strokes.length > 0 ? data.strokes : [];
            inkCurrentStroke = null;
            inkIsDrawing = false;

            if (inkActive) {
                // Pen active: replay strokes onto live canvas, clear static bg
                bg.style.backgroundImage = '';
                canvas.classList.add('active');
                try { redrawAllStrokes(); } catch (e) { console.error('[InkPage] redraw error:', e); }
                // Hide standalone stroke bg window
                if (typeof bridge !== 'undefined' && bridge && typeof bridge.hideStrokeBg === 'function') {
                    try { bridge.hideStrokeBg(); } catch (e) {}
                }
            } else {
                // Pen inactive: show via standalone stroke bg window, clear canvas
                if (data.strokes.length > 0) {
                    // Redraw strokes and generate snapshot on demand
                    try { redrawAllStrokes(); } catch (e) { console.error('[InkPage] redraw on restore:', e); }
                    var dataUrl = canvas.toDataURL();
                    bg.style.backgroundImage = 'url(' + dataUrl + ')';
                    if (typeof bridge !== 'undefined' && bridge && typeof bridge.showStrokeBg === 'function') {
                        try { bridge.showStrokeBg(dataUrl); } catch (e) {}
                    }
                } else {
                    clearInkCanvas();
                }
                canvas.classList.remove('active');
                const ctx = canvas.getContext('2d');
                if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            sendMaskUpdate();
        }

        function updatePageInfo(current, total) {
            // Per-page ink save/restore — must happen BEFORE currentPage overwrite
            const isSelfDev = (currentConfig || {}).penMode === 'self-developed';
            if (isSelfDev && currentPage !== 0 && currentPage !== current) {
                try {
                    console.log('[InkPage] updatePageInfo: saving page', currentPage, 'restoring page', current);
                    saveInkPageState(currentPage);
                    restoreInkPageState(current);
                } catch (e) {
                    console.error('[InkPage] save/restore error:', e);
                }
            } else {
                console.log('[InkPage] updatePageInfo: skip save/restore, isSelfDev:', isSelfDev, 'currentPage:', currentPage, 'newPage:', current);
            }

            currentPage = current;
            totalPage = total;
            
            const isCompat = currentConfig && currentConfig.compatibilityMode;

            if (isCompat) {
                document.getElementById('curr-page-l').innerText = '-';
                document.getElementById('total-page-l').innerText = '';
                document.getElementById('curr-page-r').innerText = '-';
                document.getElementById('total-page-r').innerText = '';
            } else {
                document.getElementById('curr-page-l').innerText = current;
                document.getElementById('total-page-l').innerText = '/' + total;
                document.getElementById('curr-page-r').innerText = current;
                document.getElementById('total-page-r').innerText = '/' + total;
            }
            
            // If selector is visible, update active state
            // If page count changed, clear grid so next toggle rebuilds it
            const grid = document.getElementById('page-grid-content');
            if (!isCompat && grid.children.length > 0 && grid.children.length !== total) {
                 grid.innerHTML = ''; // Force rebuild next time
            } else if (grid.children.length > 0) {
                 document.querySelectorAll('.page-item').forEach((item, index) => {
                     if ((index + 1) === currentPage) item.classList.add('active');
                     else item.classList.remove('active');
                 });
            }
            
            const disabledTools = (currentConfig && currentConfig.disabledTools) ? currentConfig.disabledTools : [];
            
            // Fix: Select only previous buttons (left arrow)
            const allBtns = document.querySelectorAll('.flipper-btn');
            
            allBtns.forEach(btn => {
                const isPrev = btn.querySelector('.icon-previous');
                const isNext = btn.querySelector('.icon-next');
                
                if (isPrev) {
                    if ((!isCompat && current <= 1) || disabledTools.includes('prev')) {
                        btn.classList.add('disabled');
                    } else {
                        btn.classList.remove('disabled');
                    }
                } else if (isNext) {
                    if (disabledTools.includes('next')) {
                        btn.classList.add('disabled');
                    } else {
                        btn.classList.remove('disabled');
                    }
                }
            });
        }

        function updateAnimationInfo(hasRemaining) {
            hasRemainingAnimation = !!hasRemaining;
            // Re-evaluate the next button state with the new info.
            updatePageInfo(currentPage, totalPage);
        }

        function setTheme(isDark, accentColor, themeId) {
            const variant = isDark ? 'dark' : 'light';
            
            if (!window.initialSettings) window.initialSettings = {};
            if (!window.initialSettings.Appearance) window.initialSettings.Appearance = {};
            window.initialSettings.Appearance.ResolvedIsDark = !!isDark;
            window.initialSettings.Appearance.ThemeId = themeId || 'default';
            window.initialSettings.Appearance.ThemeMode = isDark ? 'Dark' : 'Light';
            
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            
            document.documentElement.setAttribute('data-theme-variant', variant);
            
            if (themeId) {
                document.documentElement.setAttribute('data-theme-id', themeId);
            } else {
                document.documentElement.removeAttribute('data-theme-id');
            }

            if (typeof window.__applyUnifiedTheme === 'function') {
                window.__applyUnifiedTheme();
            }

            if (accentColor && (!themeId || themeId === 'default')) {
                document.documentElement.style.setProperty('--accent-color', accentColor);
            }
            
            // Re-apply opacity as base colors might have changed
            if (typeof applyOpacity === 'function') applyOpacity();

        function getStatusDisplayChar(char) {
            return char === ' ' ? '\u00A0' : char;
        }

        function getStatusLogicalChar(text) {
            return String(text || '').replace(/\u00A0/g, ' ');
        }

        function updateStatusDisplay(element, newText, animateAll = false) {
            if (!element) return;
            const chars = newText.split('');
            const wrappers = element.querySelectorAll('.status-digit-wrapper');
            const charCount = chars.filter(c => c !== '|').length;

            // If length mismatch, rebuild
            if (wrappers.length !== charCount) {
                element.innerHTML = '';
                chars.forEach(char => {
                    if (char === '|') {
                        const sep = document.createElement('span');
                        sep.className = 'status-separator';
                        element.appendChild(sep);
                    } else {
                        const wrap = document.createElement('span');
                        wrap.className = 'status-digit-wrapper';
                        const span = document.createElement('span');
                        span.textContent = getStatusDisplayChar(char);
                        wrap.appendChild(span);
                        element.appendChild(wrap);
                    }
                });
                return;
            }

            // Update existing - map chars to wrappers, skipping '|'
            let wrapperIndex = 0;
            chars.forEach(char => {
                if (char === '|') return;
                
                const wrap = wrappers[wrapperIndex++];
                if (!wrap) return;
                
                const currentSpan = wrap.firstElementChild;
                if (!currentSpan) return;
                
                // Check if value changed
                if (getStatusLogicalChar(currentSpan.textContent) !== char) {
                    // Only animate digits (0-9), not letters or symbols when animateAll is false
                    const isDigit = /\d/.test(char);
                    const shouldAnimate = !animationsDisabled() && (animateAll || isDigit);
                    
                    if (shouldAnimate && !currentSpan.classList.contains('status-digit-old')) {
                        const newSpan = document.createElement('span');
                        newSpan.textContent = getStatusDisplayChar(char);
                        newSpan.className = 'status-digit-new';

                        currentSpan.className = 'status-digit-old';
                        wrap.appendChild(newSpan);

                        setTimeout(() => {
                            if (currentSpan.parentNode === wrap) {
                                wrap.removeChild(currentSpan);
                            }
                            newSpan.className = '';
                        }, motionDelay(350));
                    } else {
                        currentSpan.textContent = getStatusDisplayChar(char);
                    }
                }
            });
        }

        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayMap = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const day = dayMap[now.getDay()];
            
            let timeString = '';
            
            // Check if showTime config exists, default to true if not set
            const showTime = currentConfig ? (currentConfig.statusBarShowTime !== false) : true;
            const showSeconds = currentConfig ? currentConfig.statusBarShowSeconds : false;
            
            if (showTime) {
                if (showSeconds) {
                    timeString = `${hours}:${minutes}:${seconds}|${month}月${date}日 ${day}`;
                } else {
                    timeString = `${hours}:${minutes}|${month}月${date}日 ${day}`;
                }
            }
            
            const timeDisplay = document.getElementById('time-display');
            if (timeDisplay) {
                // Only update if text actually changes
                if (timeString !== lastTimeString) {
                    updateStatusDisplay(timeDisplay, timeString);
                    lastTimeString = timeString;
                }
                timeDisplay.style.display = showTime ? 'inline' : 'none';
            }
        }

        function updateTimerStatus() {
            try {
                const timerDisplay = document.getElementById('timer-display');
                const timerArea = document.getElementById('timer-area');
                if (!timerDisplay || !timerArea) return;

                // Get timer state from bridge
                bridge.getTimerState(function(result) {
                    try {
                        const state = JSON.parse(result);
                        if (state.isRunning && state.totalSeconds > 0) {
                            timerDisplay.textContent = state.displayText;
                            timerArea.classList.add('active');
                        } else {
                            timerArea.classList.remove('active');
                        }
                    } catch (e) {
                        console.error('Error parsing timer state:', e);
                    }
                });
            } catch (e) {
                console.error('Error updating timer status:', e);
            }
        }
        
        // Restartable clock timer: interval depends on whether seconds are shown.
        // updateTimerStatus is now driven by the Python-side timer_manager.updated signal
        // via _on_timer_updated, so the 200ms polling interval is no longer needed.
        let _clockTimerId = null;
        function _startClockTimer() {
            if (_clockTimerId) clearInterval(_clockTimerId);
            const showSeconds = (currentConfig || {}).statusBarShowSeconds;
            _clockTimerId = setInterval(updateTime, showSeconds ? 1000 : 10000);
        }
        _startClockTimer();
        updateTime();

        function formatMusicTime(totalSeconds) {
            const wholeSeconds = Math.max(0, Math.floor(Number(totalSeconds) || 0));
            const minutes = Math.floor(wholeSeconds / 60);
            const seconds = wholeSeconds % 60;

        }

        function renderMusicStatus(flipTitle = false) {
            const showMusic = currentConfig ? (currentConfig.statusBarShowMusic !== false) : true;
            const smtcItem = document.getElementById('status-smtc');
            const smtcText = smtcItem ? smtcItem.querySelector('.status-text') : null;
            const musicIcon = document.getElementById('smtc-music-icon');
            const artworkThumb = document.getElementById('smtc-artwork-thumb');
            if (!smtcItem || !smtcText) return;

            if (!showMusic || !currentMusicState.visible) {
                hideMusicStatus();
                return;
            }

            smtcItem.style.display = 'flex';

            if (artworkThumb && currentMusicState.artworkDataUrl) {
                if (lastStatusArtworkUrl !== currentMusicState.artworkDataUrl) {
                    artworkThumb.src = currentMusicState.artworkDataUrl;
                    lastStatusArtworkUrl = currentMusicState.artworkDataUrl;
                }
                artworkThumb.style.display = '';
                if (musicIcon) musicIcon.style.display = 'none';
            } else {
                if (artworkThumb) {
                    if (lastStatusArtworkUrl !== '') {
                        artworkThumb.src = '';
                        lastStatusArtworkUrl = '';
                    }
                    artworkThumb.style.display = 'none';
                }
                if (musicIcon) musicIcon.style.display = '';
            }

            const newMusicText = buildMusicStatusText({
                smtc_title: currentMusicState.baseText,
                smtc_status: currentMusicState.status
            });
            if (!newMusicText) {
                hideMusicStatus();
                return;
            }
            if (smtcText.textContent === newMusicText) {
                return;
            }

            const updateMusicDigits = () => {
                updateStatusDisplay(smtcText, newMusicText);
                lastStatusValues.music = newMusicText;
                lastStatusValues.musicBase = currentMusicState.baseText;
            };

            if (flipTitle && !animationsDisabled() && lastStatusValues.musicBase !== currentMusicState.baseText) {
                smtcText.classList.remove('status-music-flip-in');
                smtcText.classList.add('status-music-flip');

                setTimeout(() => {
                    smtcText.textContent = '';
                    updateMusicDigits();
                    smtcText.classList.remove('status-music-flip');
                    smtcText.classList.add('status-music-flip-in');

        function initSlider() {
            const thumb = document.getElementById('clear-thumb');
            const container = document.getElementById('clear-slider');
            const text = container.querySelector('.slider-text');
            let isDragging = false;
            let startX = 0;
            let currentX = 0;
            const maxDrag = 156;

            function onStart(e) {
                isDragging = true;
                startX = (e.touches ? e.touches[0].clientX : e.clientX) - currentX;
                thumb.style.transition = 'none';
                text.style.opacity = 1;
            }

            function onMove(e) {
                if (!isDragging) return;
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let newX = clientX - startX;
                
                if (newX < 0) newX = 0;
                if (newX > maxDrag) newX = maxDrag;
                
                currentX = newX;
                thumb.style.transform = `translateX(${currentX}px)`;
                
                text.style.opacity = 1 - (currentX / maxDrag);
            }

            function onEnd() {
                if (!isDragging) return;
                isDragging = false;
                thumb.style.transition = animationsDisabled() ? 'none' : 'transform 0.3s ease';
                
                if (currentX > maxDrag * 0.8) {
                    currentX = maxDrag;
                    thumb.style.transform = `translateX(${currentX}px)`;
                    if (bridge) {
                        const selfDev = (currentConfig || {}).penMode === 'self-developed';
                        if (selfDev) {
                            clearInkCanvas();
                        } else {
                            bridge.clearScreen();
                        }
                    }
                    
                    setTimeout(() => {
                        currentX = 0;
                        thumb.style.transform = `translateX(0px)`;
                        text.style.opacity = 1;
                        document.getElementById('eraser-settings').classList.remove('visible');
                    }, motionDelay(300));
                } else {
                    currentX = 0;
                    thumb.style.transform = `translateX(0px)`;
                    text.style.opacity = 1;
                }
            }

            thumb.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            
            thumb.addEventListener('touchstart', onStart);
            document.addEventListener('touchmove', onMove);
            document.addEventListener('touchend', onEnd);
        }
        
        window.addEventListener('load', initSlider);

        let _maskResizeScheduled = false;
        const observer = new ResizeObserver(entries => {
            if (!_maskResizeScheduled) {
                _maskResizeScheduled = true;
                requestAnimationFrame(() => {
                    _maskResizeScheduled = false;
                    sendMaskUpdate();
                });
            }
        });

        _interactiveEls.forEach(el => observer.observe(el));

        let _maskUpdateScheduled = false;
        function scheduleMaskUpdate() {
            if (_maskUpdateScheduled) return;
            _maskUpdateScheduled = true;
            requestAnimationFrame(() => {
                _maskUpdateScheduled = false;
                sendMaskUpdate();
            });
            setTimeout(() => {
                _maskUpdateScheduled = false;
                sendMaskUpdate();

        // Toolbar Collapse Logic

        function toggleToolbar(collapsed) {
            if (typeof collapsed === 'undefined') collapsed = !isToolbarCollapsed;
            isToolbarCollapsed = collapsed;
            
            const container = document.getElementById('toolbar-container');
            if (collapsed) {
                container.classList.add('collapsed');
                container.classList.remove('half-collapsed');

            scheduleMaskUpdate();

        let halfCollapseTimer = null;
        let halfCollapseEnabled = false;

        function stopHalfCollapseTimer() {
            if (halfCollapseTimer) {
                clearTimeout(halfCollapseTimer);
                halfCollapseTimer = null;
            }
        }

        function resetHalfCollapseTimer() {
            stopHalfCollapseTimer();
            const container = document.getElementById('toolbar-container');
            if (container.classList.contains('half-collapsed')) {
                container.classList.remove('half-collapsed');
                scheduleMaskUpdate();
            }
            if (!halfCollapseEnabled || isToolbarCollapsed) return;
            halfCollapseTimer = setTimeout(() => {
                const c = document.getElementById('toolbar-container');

                    c.classList.add('half-collapsed');

        function onToolbarInteraction() {
            if (!halfCollapseEnabled) return;
            const container = document.getElementById('toolbar-container');
            if (container.classList.contains('half-collapsed')) {
                container.classList.remove('half-collapsed');
                scheduleMaskUpdate();
            }
            resetHalfCollapseTimer();

        // Gestures
        const toolbarEl = document.getElementById('toolbar');
        const handleEl = document.getElementById('toolbar-handle');

        toolbarEl.addEventListener('mouseenter', () => onToolbarInteraction());
        toolbarEl.addEventListener('click', () => onToolbarInteraction());
        toolbarEl.addEventListener('touchstart', () => onToolbarInteraction(), {passive: true});
        
        // Handle Click
        handleEl.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleToolbar(false);
        });

        // Toolbar Swipe Down (Collapse)
        toolbarEl.addEventListener('mousedown', e => {
            toolbarTouchStartY = e.clientY;
            toolbarTouchStartX = e.clientX;
        });
        
        toolbarEl.addEventListener('touchstart', e => {
            if(e.touches.length > 0) {
                toolbarTouchStartY = e.touches[0].clientY;
                toolbarTouchStartX = e.touches[0].clientX;
            }
        }, {passive: true});

        function handleToolbarSwipe(e, clientX, clientY) {
            const diffY = clientY - toolbarTouchStartY;
            const diffX = clientX - toolbarTouchStartX;
            const config = currentConfig || {};
            const pos = config.toolbarPosition || 'bottom';
            const threshold = 40; // Pixel threshold

            if (pos === 'bottom') {
                if (diffY > threshold) toggleToolbar(true);
            } else if (pos === 'top') {
                if (diffY < -threshold) toggleToolbar(true);
            } else if (pos === 'left') {
                if (diffX < -threshold) toggleToolbar(true);
            } else if (pos === 'right') {
                if (diffX > threshold) toggleToolbar(true);
            }
        }

        toolbarEl.addEventListener('mouseup', e => {
            handleToolbarSwipe(e, e.clientX, e.clientY);
        });
        
        toolbarEl.addEventListener('touchend', e => {
            if (e.changedTouches.length > 0) {
                handleToolbarSwipe(e, e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
        });
        
        // Handle Swipe Up (Expand)
        handleEl.addEventListener('mousedown', e => {
            toolbarTouchStartY = e.clientY;
            toolbarTouchStartX = e.clientX;
        });
        
        handleEl.addEventListener('touchstart', e => {
             if(e.touches.length > 0) {
                toolbarTouchStartY = e.touches[0].clientY;
                toolbarTouchStartX = e.touches[0].clientX;
            }
        }, {passive: true});
        
        function handleHandleSwipe(e, clientX, clientY) {
            const diffY = clientY - toolbarTouchStartY;
            const diffX = clientX - toolbarTouchStartX;
            const config = currentConfig || {};
            const pos = config.toolbarPosition || 'bottom';
            const threshold = 30; 

            if (pos === 'bottom') {
                if (diffY < -threshold) toggleToolbar(false);
            } else if (pos === 'top') {
                if (diffY > threshold) toggleToolbar(false);
            } else if (pos === 'left') {
                if (diffX > threshold) toggleToolbar(false);
            } else if (pos === 'right') {
                if (diffX < -threshold) toggleToolbar(false);
            }
        }
        
        handleEl.addEventListener('mouseup', e => {
            handleHandleSwipe(e, e.clientX, e.clientY);
        });
        
        handleEl.addEventListener('touchend', e => {
            if (e.changedTouches.length > 0) {
                handleHandleSwipe(e, e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
        });

        // Override sendMaskUpdate to exclude collapsed toolbar
        // Updated: synchronous execution (no rAF) to eliminate timing windows where mask is stale.
        // Removed hasStrokeBg early return — toolbar mask always applies so buttons stay clickable.
        function sendMaskUpdate() {
            if (!bridge) return;

            // Pen active → full-screen mask to capture drawing events
            if (inkActive) {
                bridge.updateMask([{
                    x: 0,
                    y: 0,
                    width: window.innerWidth,
                    height: window.innerHeight
                }], window.noop);
                return;
            }

            // Collect interactive element rects → toolbar-only mask.
            // Area outside the toolbar has no mask → events pass through to PPT normally.
            const rects = [];
            const isCollapsed = document.getElementById('toolbar-container').classList.contains('collapsed');

            // First pass: batch-read all layout-dependent properties (offsetParent,
            // computedStyle, getBoundingClientRect) to avoid layout thrashing.
            // page-selector needs no layout reads; media-popup only reads rect when visible.
            const info = [];
            for (let i = 0; i < _interactiveEls.length; i++) {
                const el = _interactiveEls[i];
                const entry = { el: el, id: el.id };
                if (el.id === 'media-popup') {
                    entry.visible = el.classList.contains('visible');
                    entry.rect = entry.visible ? el.getBoundingClientRect() : null;
                } else if (el.id !== 'page-selector') {
                    entry.offsetParent = el.offsetParent;
                    const style = window.getComputedStyle(el);
                    entry.opacity = style.opacity;
                    entry.pointerEvents = style.pointerEvents;
                    entry.visibility = style.visibility;
                    entry.rect = el.getBoundingClientRect();
                }
                info.push(entry);
            }

            // Second pass: build rects from cached reads (no layout reads here).
            for (let i = 0; i < info.length; i++) {
                const entry = info[i];
                const el = entry.el;

                // Special handling for page selector to ensure it's detected even if transition is running
                if (entry.id === 'page-selector') {
                    if (el.classList.contains('visible')) {
                        // Force send full rect for sidebar
                        const isLeft = el.classList.contains('left-side');
                        rects.push({
                            x: isLeft ? 0 : (window.innerWidth - 260 - 64), // Larger buffer for right side
                            y: 0,
                            width: 324, // Significantly wider interaction area (260 + 64)
                            height: window.innerHeight
                        });
                    }
                    continue;
                }

                // Explicit handling for media popup because window mask clips visual output.
                // Its soft transitions/shadow can be outside normal layout bounds.
                if (entry.id === 'media-popup') {
                    if (entry.visible) {
                        const r = entry.rect;
                        rects.push({
                            x: Math.max(0, r.x - 2),
                            y: Math.max(0, r.y - 2),
                            width: r.width + 4,
                            height: r.height + 4
                        });
                    }
                    continue;
                }

                if (entry.offsetParent === null) continue;

                if (entry.opacity === '0' || entry.pointerEvents === 'none' || entry.visibility === 'hidden') continue;

                // Skip toolbar if collapsed (redundant with pointerEvents check but explicit)
                if (isCollapsed && entry.id === 'toolbar') continue;

                // Skip handle if NOT collapsed (handle is only interactive when collapsed)
                if (!isCollapsed && entry.id === 'toolbar-handle') continue;

                const r = entry.rect;
                if (r.width === 0 || r.height === 0) continue;

                rects.push({
                    x: r.x,
                    y: r.y,
                    width: r.width,
                    height: r.height
                });
            }
            bridge.updateMask(rects, window.noop);
        }
    </script>
