      <div id="toolbar-guide-backdrop"></div>
      <div id="toolbar-guide-spotlight"></div>
      <div id="toolbar-guide-card">
        <div class="toolbar-guide-content">
          <div class="toolbar-guide-title"></div>
          <div class="toolbar-guide-desc"></div>
        </div>
        <div class="toolbar-guide-dots"></div>
        <div class="toolbar-guide-actions">
          <button class="toolbar-guide-btn toolbar-guide-skip"></button>
          <button class="toolbar-guide-btn toolbar-guide-prev"></button>
          <button class="toolbar-guide-btn toolbar-guide-next"></button>
        </div>
      </div>
    </div>

    <script>
        function createBridgePlaceholder() {
            const noop = () => {};
            return {
                requestInitState: noop,
                setPenColor: noop,
                setTool: noop,
                prevPage: noop,
                nextPage: noop,
                gotoSlide: noop,
                clearScreen: noop,
                endShow: noop,
                showLastSlideExitPrompt: noop,
                inkPromptResult: noop,
                toggleSpotlight: noop,
                toggleBoard: noop,
                toggleTimer: noop,
                secRandomQuickDraw: noop,
                launchApp: noop,
                updateMask: noop,
                releaseFocus: noop,
                resizeNudge: noop,
                requestThumbnail: noop,
                startBackgroundThumbnailCaching: noop,
                mediaPlayPause: noop,
                mediaPrev: noop,
                mediaNext: noop,
                markToolbarGuideCompleted: noop
            };
        }

        if (typeof window.noop !== 'function') {
            window.noop = function() {};
        }

        let bridge = createBridgePlaceholder();
        let webChannelReady = false;
        let webChannelInitializing = false;
        let webChannelInitAttempts = 0;
        let webChannelInitTimer = null;
        let webChannelInitWatchdog = null;
        let overlayToastTimer = null;
        const WEBCHANNEL_INIT_DELAY_MS = 50;
        const WEBCHANNEL_INIT_MAX_ATTEMPTS = 200;
        const WEBCHANNEL_INIT_TIMEOUT_MS = 2000;

        function showOverlayToast(message, isError = false) {
            const toast = document.getElementById('overlay-toast');
            if (!toast) return;

            const text = String(message || '').trim();
            if (!text) return;

            toast.textContent = text;
            toast.classList.remove('error', 'info', 'visible');
            toast.classList.add(isError ? 'error' : 'info');

            void toast.offsetWidth;
            toast.classList.add('visible');

            if (overlayToastTimer) {
                window.clearTimeout(overlayToastTimer);
            }
            overlayToastTimer = window.setTimeout(() => {
                toast.classList.remove('visible');
            }, 2600);
        }

        window.showOverlayToast = showOverlayToast;

        function clearWebChannelInitWatchdog() {
            if (webChannelInitWatchdog) {
                window.clearTimeout(webChannelInitWatchdog);
                webChannelInitWatchdog = null;
            }
        }

        function scheduleWebChannelInit(reason) {
            if (webChannelReady || webChannelInitTimer || webChannelInitAttempts >= WEBCHANNEL_INIT_MAX_ATTEMPTS) {
                return;
            }
            webChannelInitTimer = window.setTimeout(() => {
                webChannelInitTimer = null;
                initWebChannel(reason);
            }, WEBCHANNEL_INIT_DELAY_MS);
        }

        function initWebChannel(reason = 'direct') {
            if (webChannelReady || webChannelInitializing) {
                return;
            }

            webChannelInitAttempts += 1;
            const transport = window.qt && window.qt.webChannelTransport;
            if (typeof QWebChannel !== 'function') {
                if (webChannelInitAttempts === 1 || webChannelInitAttempts % 20 === 0) {
                    console.warn(`[Overlay] QWebChannel constructor not ready (${reason}, attempt ${webChannelInitAttempts}).`);
                }
                scheduleWebChannelInit('constructor-wait');
                return;
            }
            if (!transport) {
                if (webChannelInitAttempts === 1 || webChannelInitAttempts % 20 === 0) {
                    console.warn(`[Overlay] qt.webChannelTransport not ready (${reason}, attempt ${webChannelInitAttempts}).`);
                }
                scheduleWebChannelInit('transport-wait');
                return;
            }

            try {
                webChannelInitializing = true;
                clearWebChannelInitWatchdog();
                webChannelInitWatchdog = window.setTimeout(() => {
                    webChannelInitializing = false;
                    webChannelInitWatchdog = null;
                    console.warn(`[Overlay] QWebChannel init timed out (${reason}, attempt ${webChannelInitAttempts}).`);
                    if (!webChannelReady && webChannelInitAttempts < WEBCHANNEL_INIT_MAX_ATTEMPTS) {
                        scheduleWebChannelInit('timeout-retry');
                    }
                }, WEBCHANNEL_INIT_TIMEOUT_MS);

                new QWebChannel(transport, function(channel) {
                    clearWebChannelInitWatchdog();
                    webChannelInitializing = false;
                    webChannelReady = true;
                    bridge = (channel && channel.objects && channel.objects.bridge) || createBridgePlaceholder();
                    console.log(`[Overlay] QWebChannel ready after ${webChannelInitAttempts} attempt(s).`);
                    if (bridge && typeof bridge.requestInitState === 'function') {
                        bridge.requestInitState();
                    }
                });
            } catch (error) {
                clearWebChannelInitWatchdog();
                webChannelInitializing = false;
                console.error(`[Overlay] Failed to initialize QWebChannel on attempt ${webChannelInitAttempts}:`, error);
                if (webChannelInitAttempts < WEBCHANNEL_INIT_MAX_ATTEMPTS) {
                    scheduleWebChannelInit('exception-retry');
                }
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => initWebChannel('dom-content-loaded'), { once: true });
        } else {
            initWebChannel('document-ready');
        }
        window.addEventListener('load', () => scheduleWebChannelInit('window-load'), { once: true });
        requestAnimationFrame(() => scheduleWebChannelInit('raf'));

        let currentTool = 'select';
        let currentConfig = null;
        let currentPage = 1;
        let totalPage = 1;

        // Cached .interactive elements — avoid repeated querySelectorAll calls in hot paths
        const _interactiveEls = Array.from(document.querySelectorAll('.interactive'));

        function animationsDisabled() {
            return !!currentConfig?.disableAnimations;
        }

        function motionBehavior() {
            return animationsDisabled() ? 'auto' : 'smooth';
        }

        function motionDelay(ms) {
            return animationsDisabled() ? 0 : ms;
        }

        function applyAnimationPreference() {
            document.documentElement.setAttribute('data-disable-animations', animationsDisabled() ? 'true' : 'false');
        }
        const DEFAULT_TOOL_COLORS = Object.freeze({
            pen: Object.freeze({ tab: 'pen', name: '黑色', rgb: '0 0 0', hex: '#000000' }),
            highlight: Object.freeze({ tab: 'highlight', name: '黄色', rgb: '255 255 0', hex: '#FFFF00' })
        });
        const DEFAULT_PEN_COLOR = DEFAULT_TOOL_COLORS.pen;
        const PEN_COLOR_PRESETS = Object.freeze({
            '#FFFFFF': { tab: 'pen', name: '白色', rgb: '255 255 255', hex: '#FFFFFF' },
            '#000000': { tab: 'pen', name: '黑色', rgb: '0 0 0', hex: '#000000' },
            '#E7E6E6': { tab: 'pen', name: '浅灰色', rgb: '231 230 230', hex: '#E7E6E6' },
            '#44546A': { tab: 'pen', name: '蓝灰色', rgb: '68 84 106', hex: '#44546A' },
            '#4472C4': { tab: 'pen', name: '蓝色', rgb: '68 114 196', hex: '#4472C4' },
            '#ED7D31': { tab: 'pen', name: '橙色', rgb: '237 125 49', hex: '#ED7D31' },
            '#A5A5A5': { tab: 'pen', name: '灰色', rgb: '165 165 165', hex: '#A5A5A5' },
            '#FFC000': { tab: 'pen', name: '金色', rgb: '255 192 0', hex: '#FFC000' },
            '#5B9BD5': { tab: 'pen', name: '浅蓝色', rgb: '91 155 213', hex: '#5B9BD5' },
            '#70AD47': { tab: 'pen', name: '绿色', rgb: '112 173 71', hex: '#70AD47' },
            '#C00000': { tab: 'pen', name: '深红色', rgb: '192 0 0', hex: '#C00000' },
            '#FF0000': { tab: 'pen', name: '红色', rgb: '255 0 0', hex: '#FF0000' },
            '#FFFF00': { tab: 'pen', name: '黄色', rgb: '255 255 0', hex: '#FFFF00' },
            '#92D050': { tab: 'pen', name: '浅绿色', rgb: '146 208 80', hex: '#92D050' },
            '#FF69B4': { tab: 'pen', name: '骚粉色', rgb: '255 105 180', hex: '#FF69B4' },
            '#00BCD4': { tab: 'pen', name: '亮青色', rgb: '0 188 212', hex: '#00BCD4' },
            '#002060': { tab: 'pen', name: '深蓝色', rgb: '0 32 96', hex: '#002060' },
            '#7030A0': { tab: 'pen', name: '紫色', rgb: '112 48 160', hex: '#7030A0' }
        });
        let currentPenColor = { ...DEFAULT_PEN_COLOR };

        function getDefaultColorForTab(tab) {
            return {
                ...(DEFAULT_TOOL_COLORS[tab] || DEFAULT_PEN_COLOR)
            };
        }

        document.addEventListener('click', (e) => {
            if (!document.body.classList.contains('popup-active')) return;

            const isClickInside = e.target.closest('#color-picker') ||
                                  e.target.closest('#eraser-settings') ||
                                  e.target.closest('#page-selector') ||
                                  e.target.closest('.tool-btn');

            if (!isClickInside) {
                closePopup();
            }
        });

        function rgbToHex(r, g, b) {
            const toHex = value => Number(value).toString(16).padStart(2, '0').toUpperCase();
            return '#' + toHex(r) + toHex(g) + toHex(b);
        }

        function normalizeHexColor(color) {
            if (!color) return '';
            const raw = String(color).trim();
            if (raw.startsWith('#')) {
                if (raw.length === 4) {
                    return ('#' + raw[1] + raw[1] + raw[2] + raw[2] + raw[3] + raw[3]).toUpperCase();
                }
                return raw.toUpperCase();
            }
            const match = raw.match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i);
            if (!match) return raw.toUpperCase();
            return rgbToHex(match[1], match[2], match[3]);
        }

        function activateColorTab(tab) {
            const items = Array.from(document.querySelectorAll('.pivot-item'));
            const activeIndex = tab === 'highlight' ? 1 : 0;
            items.forEach((item, index) => item.classList.toggle('active', index === activeIndex));
            document.querySelectorAll('.pivot-content').forEach(content => {
                content.classList.toggle('active', content.id === 'tab-' + tab);
            });
        }

        function findColorOption(hex, preferredTab) {
            const normalized = normalizeHexColor(hex);
            if (preferredTab) {
                const tabContent = document.getElementById('tab-' + preferredTab);
                if (tabContent) {
                    const preferredMatch = Array.from(tabContent.querySelectorAll('.color-option')).find(opt =>
                        normalizeHexColor(window.getComputedStyle(opt).backgroundColor) === normalized
                    );
                    if (preferredMatch) return preferredMatch;
                }
            }
            return Array.from(document.querySelectorAll('.color-option')).find(opt =>
                normalizeHexColor(window.getComputedStyle(opt).backgroundColor) === normalized
            ) || null;
        }

        function syncColorPickerState() {
            const preset = PEN_COLOR_PRESETS[normalizeHexColor(currentPenColor && currentPenColor.hex)] || null;
            const displayColor = {
                ...(preset || {}),
                ...(currentPenColor || DEFAULT_PEN_COLOR)
            };

            if (!displayColor.tab) {
                displayColor.tab = (preset && preset.tab) || DEFAULT_PEN_COLOR.tab;
            }

            let matchedOption = findColorOption(displayColor.hex, displayColor.tab);
            if (!matchedOption) {
                const fallbackColor = getDefaultColorForTab(displayColor.tab);
                Object.assign(displayColor, fallbackColor);
                matchedOption = findColorOption(displayColor.hex, displayColor.tab);
            }

            activateColorTab(displayColor.tab);
            document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('active'));
            if (matchedOption) matchedOption.classList.add('active');

            updateColorInfo(
                displayColor.name || DEFAULT_PEN_COLOR.name,
                displayColor.rgb || DEFAULT_PEN_COLOR.rgb,
                normalizeHexColor(displayColor.hex || DEFAULT_PEN_COLOR.hex)
            );
            currentPenColor = displayColor;

            // Sync pen width slider to current value
            const penSlider = document.getElementById('pen-width-slider');
            if (penSlider) {
                setThicknessSliderValue(penSlider, inkPenWidth);
            }
        }

        function syncHighlightColorAvailability() {
            const isCom = (currentConfig || {}).penMode !== 'self-developed';
            const tabHighlight = document.getElementById('tab-highlight');
            const hint = document.getElementById('highlight-color-unsupported-hint');
            if (tabHighlight) tabHighlight.classList.toggle('color-disabled', isCom);
            if (hint) hint.style.display = isCom ? 'block' : 'none';
        }

        function syncThicknessPanelContent() {
            const panel = document.getElementById('thickness-panel');
            if (!panel) return;
            const isSelfDev = (currentConfig || {}).penMode === 'self-developed';
            if (!isSelfDev) {
                panel.classList.remove('visible');
                return;
            }
            const penSection = panel.querySelector('.ink-width-section[data-tool="pen"]');
            const hlSection = panel.querySelector('.ink-width-section[data-tool="highlight"]');
            if (penSection) penSection.classList.remove('active');
            if (hlSection) hlSection.classList.remove('active');
            if (currentTool === 'pen') {
                if (penSection) penSection.classList.add('active');
            } else if (currentTool === 'highlight' && isSelfDev) {
                if (hlSection) hlSection.classList.add('active');
            }
            const picker = document.getElementById('color-picker');
            const pickerVisible = picker && picker.classList.contains('visible');
            const anyActive = panel.querySelector('.ink-width-section.active');
            if (pickerVisible && anyActive) {
                panel.classList.add('visible');
                positionThicknessPanel(picker);
            } else {
                panel.classList.remove('visible');
            }
        }

        function resetPenColorState() {
            currentPenColor = getDefaultColorForTab('pen');
            syncColorPickerState();
        }

        function toggleStatusBar(visible) {
            const sb = document.getElementById('status-bar');
            if (visible) {
                sb.classList.add('visible');
                sb.classList.add('interactive');
            } else {
                sb.classList.remove('visible');
                sb.classList.remove('interactive');
            }
        }

        function showInkPrompt() {
            console.log('[Overlay] showInkPrompt called');
            const prompt = document.getElementById('ink-prompt');
            if (prompt) {
                console.log('[Overlay] Found ink-prompt element, adding visible class');
                prompt.classList.add('visible');
            } else {
                console.error('[Overlay] ink-prompt element not found!');
            }
        }

        function hideInkPrompt() {
            const prompt = document.getElementById('ink-prompt');
            if (prompt) prompt.classList.remove('visible');
        }

        function onInkPrompt(value) {
            hideInkPrompt();
            if (bridge && typeof bridge.inkPromptResult === 'function') {
                // Convert to string to ensure reliable transmission over WebChannel
                bridge.inkPromptResult(String(value));
            }
        }

        function showLastSlideExitPrompt() {
            const prompt = document.getElementById('last-slide-exit-prompt');
            if (prompt) {
                prompt.classList.add('visible');
            }
        }

        function hideLastSlideExitPrompt() {
            const prompt = document.getElementById('last-slide-exit-prompt');
            if (prompt) {
                prompt.classList.remove('visible');
            }
        }

        function shouldPromptExitOnLastSlide() {
            const isCompat = currentConfig && currentConfig.compatibilityMode;
            if (isCompat) return false;
            if (currentPage <= 0 || totalPage <= 0) return false;
            return currentPage >= totalPage && !hasRemainingAnimation;
        }

        function handlePrevPageClick() {
            if (bridge && typeof bridge.prevPage === 'function') {
                bridge.prevPage(window.noop);
            }
        }

        function handleNextPageClick() {
            console.log('[InkPage] handleNextPageClick called, currentPage:', currentPage, 'inkActive:', inkActive);
            const disabledTools = (currentConfig && currentConfig.disabledTools) ? currentConfig.disabledTools : [];
            if (disabledTools.includes('next')) {
                console.log('[InkPage] handleNextPageClick: next is disabled in config');
                return;
            }

            var _shouldPrompt = shouldPromptExitOnLastSlide();
            if (_shouldPrompt) {
                console.log('[InkPage] handleNextPageClick: on last slide, prompting exit');
                if (webChannelReady && bridge && typeof bridge.showLastSlideExitPrompt === 'function') {
                    bridge.showLastSlideExitPrompt();
                } else {
                    showLastSlideExitPrompt();
                }
                return;
            }

            if (bridge && typeof bridge.nextPage === 'function') {
                console.log('[InkPage] handleNextPageClick: calling bridge.nextPage');
                bridge.nextPage(window.noop);
            } else {
                console.error('[InkPage] handleNextPageClick: bridge.nextPage not available!');
            }
        }

        function onLastSlideExitPrompt(shouldExit) {
            hideLastSlideExitPrompt();
            if (shouldExit && bridge && typeof bridge.endShow === 'function') {
                bridge.endShow();
            }
        }

        let opacityHelperDiv = null;

        function applyOpacity() {
            if (!currentConfig) return;

            const toolbarOpacity = currentConfig.toolbarOpacity !== undefined ? currentConfig.toolbarOpacity : 1.0;
            const sidePageOpacity = currentConfig.sidePageOpacity !== undefined ? currentConfig.sidePageOpacity : 1.0;

            // Detect backdrop-filter support; if supported, cap base opacity so the
            // blurred background is actually visible through the glass surface.
            const supportsBackdropFilter =
                CSS.supports('backdrop-filter: blur(1px)') ||
                CSS.supports('-webkit-backdrop-filter: blur(1px)');
            const glassToolbarOpacity = supportsBackdropFilter ? Math.min(toolbarOpacity, 0.65) : toolbarOpacity;
            const glassSidePageOpacity = supportsBackdropFilter ? Math.min(sidePageOpacity, 0.65) : sidePageOpacity;

            // Get base colors from CSS variables
            const rootStyle = getComputedStyle(document.documentElement);
            const toolbarBgVar = rootStyle.getPropertyValue('--overlay-toolbar-bg').trim();
            const pageBgVar = rootStyle.getPropertyValue('--overlay-page-bg').trim();

            function resolveColor(colorStr, opacity) {
                if (!colorStr) return '';

                if (!opacityHelperDiv) {
                    opacityHelperDiv = document.createElement('div');
                    opacityHelperDiv.style.visibility = 'hidden';
                    opacityHelperDiv.style.position = 'absolute';
                    opacityHelperDiv.style.pointerEvents = 'none';
                    document.body.appendChild(opacityHelperDiv);
                }

                opacityHelperDiv.style.color = colorStr;
                const computed = getComputedStyle(opacityHelperDiv).color;

                const match = computed.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
                if (match) {
                    let a = match[4] !== undefined ? parseFloat(match[4]) : 1;
                    a *= opacity;
                    return `rgba(${match[1]}, ${match[2]}, ${match[3]}, ${a})`;
                }
                return colorStr;
            }

            const toolbar = document.getElementById('toolbar');
            if (toolbar) {
                toolbar.style.removeProperty('background-color');
                const newColor = resolveColor(toolbarBgVar, glassToolbarOpacity);
                toolbar.style.setProperty('--overlay-toolbar-bg', newColor);
            }

            document.querySelectorAll('.flipper').forEach(el => {
                el.style.removeProperty('background-color');
                const newColor = resolveColor(pageBgVar, glassSidePageOpacity);
                el.style.setProperty('--overlay-page-bg', newColor);
            });
        }

        function updateConfig(config) {
            currentConfig = config;
            if (config && config.language) {
                document.documentElement.lang = config.language;
            }
            // Apply SelfPen config (defensive: COM-mode configs also include these fields now)
if (config.selfPenWidth !== undefined) { inkPenWidth = config.selfPenWidth; const s = document.getElementById('pen-width-slider'); if (s) { setThicknessSliderValue(s, inkPenWidth); } }
if (config.selfHighlightWidth !== undefined) { inkHighlightWidth = config.selfHighlightWidth; const s = document.getElementById('hl-width-slider'); if (s) { setThicknessSliderValue(s, inkHighlightWidth); } }
            if (config.selfEraserWidth !== undefined) { inkEraserWidth = config.selfEraserWidth; const s = document.getElementById('eraser-width-slider'); if (s) { s.value = inkEraserWidth; const v = document.getElementById('eraser-width-value'); if (v) v.textContent = inkEraserWidth; } }
            if (config.selfHighlightOpacity !== undefined) inkHighlightOpacity = config.selfHighlightOpacity;
            if (config.selfPenColor !== undefined) inkPenColor = config.selfPenColor;
            if (config.selfHighlightColor !== undefined) inkHighlightColor = config.selfHighlightColor;
            if (config.selfPenFrameRateMode !== undefined) selfPenFrameRateMode = config.selfPenFrameRateMode;
            if (config.selfPenPenEffect !== undefined) selfPenPenEffect = config.selfPenPenEffect;
            if (config.selfPenPalmErase !== undefined) selfPenPalmErase = config.selfPenPalmErase;
            if (config.selfPenWidthPresetIndex !== undefined) selfPenWidthPresetIndex = config.selfPenWidthPresetIndex;
            if (config.selfEraserWidthPresetIndex !== undefined) selfEraserWidthPresetIndex = config.selfEraserWidthPresetIndex;
            applyAnimationPreference();
            // Apply pen mode: initialize canvas then sync mode
            if (config.penMode === 'self-developed') {
                initInkCanvas();
            }
            syncInkCanvasMode();
            applyOpacity();
            syncHighlightColorAvailability();
            syncThicknessPanelContent();

            halfCollapseEnabled = config.toolbarAutoHalfCollapse || false;
            if (halfCollapseEnabled) {
                resetHalfCollapseTimer();
            } else {
                stopHalfCollapseTimer();
                document.getElementById('toolbar-container').classList.remove('half-collapsed');
            }
            
            toggleStatusBar(config.showStatusBar);

            const toolbarContainer = document.getElementById('toolbar-container');
            if (!toolbarContainer.dataset.maskBound) {
                toolbarContainer.addEventListener('transitionend', () => scheduleMaskUpdate());
                toolbarContainer.dataset.maskBound = '1';
            }
            
            // Remove existing position classes
            toolbarContainer.classList.remove('pos-top', 'pos-bottom', 'pos-left', 'pos-right');
            
            // Add new position class
            const pos = config.toolbarPosition || 'bottom';
            toolbarContainer.classList.add('pos-' + pos);

            const flipperPos = config.flipperPosition || 'center';
            const leftFlipper = document.getElementById('left-flipper');
            const rightFlipper = document.getElementById('right-flipper');
            
            // Handle strict edge alignment
            const strictEdgeAlignment = config.strictEdgeAlignment || false;
            if (strictEdgeAlignment) {
                toolbarContainer.classList.add('strict-edge-alignment');
                [leftFlipper, rightFlipper].forEach(el => {
                    if (el) el.classList.add('strict-edge-alignment');
                });
            } else {
                toolbarContainer.classList.remove('strict-edge-alignment');
                [leftFlipper, rightFlipper].forEach(el => {
                    if (el) el.classList.remove('strict-edge-alignment');
                });
            }
            
            // Reset Flipper styles
            [leftFlipper, rightFlipper].forEach(el => {
                if (!el) return;
                el.classList.remove('flipper-bottom');
                // Don't reset transform here as it might be set by side toolbar logic later
                // But we should ensure we start clean if we switch modes
                if (flipperPos === 'center') {
                     el.style.position = '';
                     el.style.bottom = '';
                     el.style.left = '';
                     el.style.right = '';
                }
            });

            const toolbar = document.getElementById('toolbar');

            // Apply Scale and SafeArea
            const scale = config.scale || 1.0;
            const safeArea = strictEdgeAlignment ? 0 : (config.safeArea || 0);
            
            // Apply safe area to bottom flippers
            if (flipperPos === 'bottom') {
                 [leftFlipper, rightFlipper].forEach(el => {
                    if (!el) return;
                    el.classList.add('flipper-bottom');
                    el.style.bottom = (strictEdgeAlignment ? 0 : 20 + safeArea) + 'px';
                });
                
                if (leftFlipper) leftFlipper.style.left = (strictEdgeAlignment ? 0 : 20 + safeArea) + 'px';
                if (rightFlipper) rightFlipper.style.right = (strictEdgeAlignment ? 0 : 20 + safeArea) + 'px';
            }
            
            toolbar.style.transform = `scale(${scale})`;
            toolbar.style.transformOrigin = {
                'bottom': 'center bottom',
                'top': 'center top',
                'left': 'left center',
                'right': 'right center'
            }[pos] || 'center bottom';

            // Reset margins/padding
            toolbarContainer.style.paddingBottom = '';
            toolbarContainer.style.paddingTop = '';
            toolbarContainer.style.paddingLeft = '';
            toolbarContainer.style.paddingRight = '';

            if (pos === 'bottom') {
                toolbarContainer.style.paddingBottom = (strictEdgeAlignment ? 0 : 20 + safeArea) + 'px';
            } else if (pos === 'top') {
                toolbarContainer.style.paddingTop = (strictEdgeAlignment ? 0 : 20 + safeArea) + 'px';
            } else if (pos === 'left') {
                toolbarContainer.style.paddingLeft = (strictEdgeAlignment ? 0 : 20 + safeArea) + 'px';
            } else if (pos === 'right') {
                toolbarContainer.style.paddingRight = (strictEdgeAlignment ? 0 : 20 + safeArea) + 'px';
            }

            // Adjust center-area padding to avoid overlap with side toolbar
            const centerArea = document.getElementById('center-area');
            if (centerArea) {
                // Reset horizontal padding (previously added)
                centerArea.style.paddingLeft = '';
                centerArea.style.paddingRight = '';
                
                // Reset vertical padding
                centerArea.style.paddingTop = '';
                centerArea.style.paddingBottom = '';
                
                const leftFlipper = document.getElementById('left-flipper');
                const rightFlipper = document.getElementById('right-flipper');
                
                // Reset transforms
                if (leftFlipper) leftFlipper.style.transform = '';
                if (rightFlipper) rightFlipper.style.transform = '';
                
                if (pos === 'left') {
                    // Reset Toolbar Container overrides
                    toolbarContainer.style.justifyContent = '';

            const clearSlider = document.getElementById('clear-slider');

        // ─── Self-developed Pen (InkCanvas) Drawing Engine ────────────────
        let inkCanvasInited = false;
        let inkCtx = null;
        let inkIsDrawing = false;
        let inkCurrentStroke = null;
        let inkStrokes = [];
        const INK_STROKES_MAX = 2000;
        let inkPenWidth = 3;
        let inkHighlightWidth = 24;
        let inkEraserWidth = 30;
        // SelfPen config-driven variables (defaults match cfg SelfPen defaults)
        let inkHighlightOpacity = 0.45;
        let inkPenColor = '#000000';
        let inkHighlightColor = '#FFFF00';
        let selfPenFrameRateMode = 'adaptive';
        let selfPenPenEffect = 'limited';
        let selfPenPalmErase = false;
        let selfPenWidthPresetIndex = -1;
        let selfEraserWidthPresetIndex = -1;
        let inkActive = false; // true when self-developed mode AND pen/eraser tool active
        let guideActive = false; // true when toolbar onboarding guide is active

        const INK_MODE_PEN = 'pen';
        const INK_MODE_HIGHLIGHT = 'highlight';
        const INK_MODE_ERASER = 'eraser';

        // ─── Board-style thickness slider helpers ───
        function setThicknessSliderValue(sliderEl, value) {
            if (!sliderEl) return;
            const handle = sliderEl.querySelector('.ts-handle');
            const fill = sliderEl.querySelector('.ts-fill');
            const valueEl = sliderEl.parentElement?.querySelector('.ink-width-value');
            if (!handle || !fill) return;
            const min = parseFloat(sliderEl.dataset.min);
            const max = parseFloat(sliderEl.dataset.max);
            if (isNaN(min) || isNaN(max)) return;
            const clamped = Math.max(min, Math.min(max, value));
            const ratio = Math.max(0, Math.min(1, (clamped - min) / (max - min)));
            handle.style.top = ((1 - ratio) * 100) + '%';
            fill.style.height = (ratio * 100) + '%';
            if (valueEl) valueEl.textContent = Math.round(clamped);
        }

        function initThicknessSliders() {
            document.querySelectorAll('.thickness-slider').forEach(slider => {
                const handle = slider.querySelector('.ts-handle');
                const fill = slider.querySelector('.ts-fill');
                if (!handle || !fill) return;
                const min = parseFloat(slider.dataset.min);
                const max = parseFloat(slider.dataset.max);
                const step = parseFloat(slider.dataset.step);
                if (isNaN(min) || isNaN(max) || isNaN(step)) return;
                const valueEl = slider.parentElement?.querySelector('.ink-width-value');
                const isHighlight = slider.closest('[data-tool="highlight"]');

                function updateSlider(value) {
                    const ratio = Math.max(0, Math.min(1, (value - min) / (max - min)));
                    handle.style.top = ((1 - ratio) * 100) + '%';
                    fill.style.height = (ratio * 100) + '%';
                    if (valueEl) valueEl.textContent = Math.round(value);
                }

                function valueFromPointer(clientY) {
                    const rect = slider.getBoundingClientRect();
                    const ratio = 1 - Math.max(0, Math.min(1,
                        (clientY - rect.top) / rect.height));
                    const raw = min + ratio * (max - min);
                    const stepped = step > 0 ? Math.round(raw / step) * step : raw;
                    return Math.max(min, Math.min(max, stepped));
                }

                let isDragging = false;

                function onPointerDown(e) {
                    e.preventDefault();
                    isDragging = true;
                    slider.setPointerCapture(e.pointerId);
                    const v = valueFromPointer(e.clientY);
                    const target = isHighlight ? 'HighlightWidth' : 'PenWidth';
                    if (isHighlight) inkHighlightWidth = v;
                    else inkPenWidth = v;
                    updateSlider(v);
                    if (bridge && bridge.setSelfPenSetting)
                        bridge.setSelfPenSetting(target, Math.round(v));
                }

                function onPointerMove(e) {
                    if (!isDragging) return;
                    const v = valueFromPointer(e.clientY);
                    const target = isHighlight ? 'HighlightWidth' : 'PenWidth';
                    if (isHighlight) inkHighlightWidth = v;
                    else inkPenWidth = v;
                    updateSlider(v);
                    if (bridge && bridge.setSelfPenSetting)
                        bridge.setSelfPenSetting(target, Math.round(v));
                }

                function onPointerUp(e) {
                    isDragging = false;
                    slider.releasePointerCapture(e.pointerId);
                }

                slider.addEventListener('pointerdown', onPointerDown);
                slider.addEventListener('pointermove', onPointerMove);
                slider.addEventListener('pointerup', onPointerUp);
                slider.addEventListener('pointercancel', onPointerUp);

                // Set initial value
                const initialVal = isHighlight ? inkHighlightWidth : inkPenWidth;
                updateSlider(initialVal);
            });
        }

        function initInkCanvas() {
            if (inkCanvasInited) return;
            inkCanvasInited = true;

            const canvas = document.getElementById('ink-canvas');
            if (!canvas) return;

            // Get device pixel ratio for sharp rendering
            function setupCanvas() {
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                inkCtx = canvas.getContext('2d');
                inkCtx.scale(dpr, dpr);
            }

            setupCanvas();
            window.addEventListener('resize', () => {
                setupCanvas();
                redrawAllStrokes();
                // While the pen is inactive, strokes are shown via the static background.
                // Regenerate that snapshot after a resize so it matches the new canvas.
                if (!inkActive && inkStrokes.length > 0) {
                    const bg = document.getElementById('ink-stroke-bg');
                    const cvs = document.getElementById('ink-canvas');
                    if (bg && cvs) {
                        const dataUrl = cvs.toDataURL();
                        bg.style.backgroundImage = 'url(' + dataUrl + ')';
                        // Sync the standalone StrokeBgWindow so it matches the new canvas.
                        if (typeof bridge !== 'undefined' && bridge && typeof bridge.showStrokeBg === 'function') {
                            try { bridge.showStrokeBg(dataUrl); } catch (e) {}
                        }
                    }
                }
            });

            // ── Pointer event handlers ──────────────────────────────────
            function getPos(e) {
                return { x: e.clientX, y: e.clientY };
            }

            function startStroke(e) {
                if (!inkActive) return;
                e.preventDefault();
                const pos = getPos(e);
                inkIsDrawing = true;
                inkCurrentStroke = {
                    points: [pos],
                    color: getCurrentInkColor(),
                    width: getCurrentInkWidth(),
                    mode: getCurrentInkMode(),
                    strokeId: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                };
                // Lock Y for highlighter — purely horizontal stroke
                if (inkCurrentStroke.mode === INK_MODE_HIGHLIGHT) {
                    inkCurrentStroke.lockedY = pos.y;
                }
            }

            function moveStroke(e) {
                if (!inkIsDrawing || !inkActive) return;
                e.preventDefault();
                const pos = getPos(e);
                // Highlighter: lock Y to starting position for pure horizontal motion
                if (inkCurrentStroke.mode === INK_MODE_HIGHLIGHT) {
                    pos.y = inkCurrentStroke.lockedY;
                }
                const last = inkCurrentStroke.points[inkCurrentStroke.points.length - 1];
                inkCurrentStroke.points.push(pos);
                drawSegment(last, pos, inkCurrentStroke);
            }

            function endStroke(e) {
                if (!inkIsDrawing) return;
                inkIsDrawing = false;
                if (inkCurrentStroke && inkCurrentStroke.points.length > 0) {
                    inkStrokes.push(inkCurrentStroke);
                    // Prevent unbounded memory growth
                    if (inkStrokes.length > INK_STROKES_MAX) {
                        inkStrokes.splice(0, inkStrokes.length - INK_STROKES_MAX);
                    }
                }
                inkCurrentStroke = null;
            }

            // Register pointer events (captures pen, touch, mouse)
            canvas.addEventListener('pointerdown', startStroke);
            canvas.addEventListener('pointermove', moveStroke);
            canvas.addEventListener('pointerup', endStroke);
            canvas.addEventListener('pointerleave', endStroke);
            canvas.addEventListener('pointercancel', endStroke);

            // Prevent default touch behavior (scrolling)
            canvas.addEventListener('touchstart', e => { if (inkActive) e.preventDefault(); }, { passive: false });
            canvas.addEventListener('touchmove', e => { if (inkActive) e.preventDefault(); }, { passive: false });

            // Initialize custom thickness sliders
            initThicknessSliders();
        }

        function getCurrentInkColor() {
            // In self-developed mode, prefer config-driven colors (inkPenColor / inkHighlightColor)
            // so settings-page changes take effect immediately. Fall back to currentPenColor.hex
            // (and ultimately '#000000') if the config color is empty.
            if ((currentConfig || {}).penMode === 'self-developed') {
                if (getCurrentInkMode() === INK_MODE_HIGHLIGHT) {
                    return inkHighlightColor || (currentPenColor && currentPenColor.hex) || '#FFFF00';
                }
                return inkPenColor || (currentPenColor && currentPenColor.hex) || '#000000';
            }
            const raw = currentPenColor && currentPenColor.hex;
            return raw || '#000000';
        }

        function getCurrentInkWidth() {
            const mode = getCurrentInkMode();
            if (mode === INK_MODE_HIGHLIGHT) return inkHighlightWidth;
            if (mode === INK_MODE_ERASER) return inkEraserWidth;
            return inkPenWidth;
        }

        function getCurrentInkMode() {
            if (currentTool === 'highlight') return INK_MODE_HIGHLIGHT;
            if (currentTool === 'eraser') return INK_MODE_ERASER;
            return INK_MODE_PEN;
        }

        // SelfPen rendering hooks (variables ready, algorithms to be implemented):
        // - selfPenFrameRateMode: throttle/RAF scheduling
        // - selfPenPenEffect: pressure/velocity-based width modulation
        // - selfPenPalmErase: multi-touch palm erasure
        function drawSegment(p1, p2, stroke) {
            if (!inkCtx) return;
            const ctx = inkCtx;
            ctx.save();

            if (stroke.mode === INK_MODE_ERASER) {
                // Eraser: use destination-out compositing
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
                ctx.lineWidth = stroke.width;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            } else if (stroke.mode === INK_MODE_HIGHLIGHT) {
                // Highlighter: flat rectangular stroke like real chisel-tip pen
                const color = stroke.color || '#FFFF00';
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
                ctx.globalAlpha = inkHighlightOpacity;
                ctx.lineWidth = stroke.width;
                ctx.lineCap = 'butt';
                ctx.lineJoin = 'miter';
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            } else {
                // Normal pen
                const color = stroke.color || '#000000';
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
                ctx.globalAlpha = 1.0;
                ctx.lineWidth = stroke.width;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }

            ctx.restore();
        }

        function redrawAllStrokes() {
            if (!inkCtx) return;
            const canvas = document.getElementById('ink-canvas');
            if (!canvas) return;
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            inkCtx = canvas.getContext('2d');
            inkCtx.scale(dpr, dpr);

            for (const stroke of inkStrokes) {
                if (stroke.mode === INK_MODE_ERASER) {
                    // For eraser strokes, we need to re-apply over existing strokes
                    // This is approximate: just draw eraser with destination-out
                    for (let i = 1; i < stroke.points.length; i++) {
                        drawSegment(stroke.points[i - 1], stroke.points[i], stroke);
                    }
                } else {
                    for (let i = 1; i < stroke.points.length; i++) {
                        drawSegment(stroke.points[i - 1], stroke.points[i], stroke);
                    }
                }
            }
        }

        function clearInkCanvas() {
            if (!inkCtx) return;
            const canvas = document.getElementById('ink-canvas');
            if (!canvas) return;
            inkCtx.clearRect(0, 0, canvas.width, canvas.height);
            inkStrokes = [];
            inkCurrentStroke = null;
            inkIsDrawing = false;
            // Clear static stroke background too
            const bg = document.getElementById('ink-stroke-bg');
            if (bg) bg.style.backgroundImage = '';
            // Hide standalone stroke bg window
            if (typeof bridge !== 'undefined' && bridge && typeof bridge.hideStrokeBg === 'function') {
                try { bridge.hideStrokeBg(); } catch (e) {}
            }
            sendMaskUpdate();
        }

        function clearAllInkState() {
            clearInkCanvas();
            for (const key of Object.keys(perPageStrokes)) {
                delete perPageStrokes[key];
            }
            currentPage = 0;
        }

        function syncInkCanvasMode() {
            const config = currentConfig || {};
            const isSelfDev = config.penMode === 'self-developed';
            const isPenTool = (currentTool === 'pen' || currentTool === 'highlight' || currentTool === 'eraser');
            inkActive = isSelfDev && isPenTool;

            const canvas = document.getElementById('ink-canvas');
            if (!canvas) return;

            if (inkActive) {
                // Clear static stroke bg so live canvas is visible
                const bg = document.getElementById('ink-stroke-bg');
                if (bg) bg.style.backgroundImage = '';
                canvas.classList.add('active');
                // Set cursor based on tool
                if (currentTool === 'eraser') {
                    canvas.style.cursor = 'cell';
                } else {
                    canvas.style.cursor = 'crosshair';
                }
                // Replay stored strokes onto the live canvas — setupCanvas() may have
                // cleared it (resetting canvas.width/height wipes all content), so
                // without this the previously drawn strokes would be invisible.
                if (inkStrokes.length > 0) {
                    try { redrawAllStrokes(); } catch (e) { console.error('[InkPage] redraw on activate:', e); }
                }
                // Hide the standalone stroke bg window — the live canvas takes over
                if (typeof bridge !== 'undefined' && bridge && typeof bridge.hideStrokeBg === 'function') {
                    try { bridge.hideStrokeBg(); } catch (e) {}
                }
            } else {
                canvas.classList.remove('active');
                canvas.style.cursor = 'crosshair';
                // Snapshot canvas strokes into a standalone transparent window so
                // they stay visible even after overlay mask shrinks to toolbar-only
                // (Qt setMask clips visual output outside the mask region).
                if (inkStrokes.length > 0 && isSelfDev) {
                    try { redrawAllStrokes(); } catch (e) { console.error('[InkPage] redraw before snapshot:', e); }
                    // Also set the in-page bg as a fallback (harmless if clipped by mask)
                    const bg = document.getElementById('ink-stroke-bg');
                    // Synchronous so showStrokeBg runs before sendMaskUpdate() shrinks the mask (avoids flicker).
                    var dataUrl = canvas.toDataURL();
                    if (bg) bg.style.backgroundImage = 'url(' + dataUrl + ')';
                    if (typeof bridge !== 'undefined' && bridge && typeof bridge.showStrokeBg === 'function') {
                        try { bridge.showStrokeBg(dataUrl); } catch (e) {}
                    }
                } else {
                    // No strokes → hide standalone stroke bg window
                    if (typeof bridge !== 'undefined' && bridge && typeof bridge.hideStrokeBg === 'function') {
                        try { bridge.hideStrokeBg(); } catch (e) {}
                    }
                }
            }
            // Update window mask: full-screen when drawing, toolbar-only otherwise
            sendMaskUpdate();
        }

        function handleClearScreen() {
            const selfDev = (currentConfig || {}).penMode === 'self-developed';
            if (selfDev) {
                clearInkCanvas();
            } else if (bridge) {
                bridge.clearScreen(window.noop);
            }
        }

        function positionThicknessPanel(anchorEl) {
            const panel = document.getElementById('thickness-panel');
            if (!panel || !anchorEl) return;
            const anchorRect = anchorEl.getBoundingClientRect();
            const gap = 8;
            // Match panel height to anchor so slider fills the same vertical space
            panel.style.height = anchorRect.height + 'px';
            const panelRect = panel.getBoundingClientRect();
            let left = anchorRect.right + gap;
            // Flip to left side if overflow right edge
            if (left + panelRect.width > window.innerWidth) {
                left = anchorRect.left - panelRect.width - gap;
            }
            // Vertical: align tops
            let top = anchorRect.top;
            // If overflows bottom, shift up
            if (top + panelRect.height > window.innerHeight) {
                top = window.innerHeight - panelRect.height - 8;
            }
            if (top < 8) top = 8;
            panel.style.left = left + 'px';
            panel.style.top = top + 'px';
        }

        function togglePageSelector(e) {
            if (e && typeof e.stopPropagation === 'function') {
                e.stopPropagation();
            }
            const selector = document.getElementById('page-selector');
            if (selector.classList.contains('visible')) {
                selector.classList.remove('visible');
                document.getElementById('left-flipper').classList.remove('hidden-flipper');
                document.getElementById('right-flipper').classList.remove('hidden-flipper');
                document.body.classList.remove('popup-active');
            } else {
                closePopup();
                
                // Only render if empty or page count changed
                const grid = document.getElementById('page-grid-content');
                if (grid.children.length !== totalPage) {
                    renderPageSelector();
                } else {
                    // Just update active state
                    document.querySelectorAll('.page-item').forEach((item, index) => {
                         if ((index + 1) === currentPage) item.classList.add('active');
                         else item.classList.remove('active');
                    });
                }
                
                selector.classList.add('visible');
                document.body.classList.add('popup-active');
                
                // Determine side based on click position
                let isLeft = false;
                if (e && e.clientX < window.innerWidth / 2) {
                    isLeft = true;
                }
                
                if (isLeft) {
                    selector.classList.add('left-side');
                    document.getElementById('left-flipper').classList.add('hidden-flipper');
                } else {
                    selector.classList.remove('left-side');
                    document.getElementById('right-flipper').classList.add('hidden-flipper');
                }
                
                // Force layout reset
                selector.setAttribute('style', '');
                selector.style.position = 'fixed';
                selector.style.top = '24px';
                selector.style.bottom = '24px';
                selector.style.width = '260px';
                selector.style.maxHeight = 'none';
                selector.style.borderRadius = '16px';
                selector.style.border = '1px solid var(--overlay-popup-border)';
                
                if (isLeft) {
                    selector.style.left = '16px';
                    selector.style.right = 'auto';
                } else {
                    selector.style.right = '16px';
                    selector.style.left = 'auto';
                }

                // Important: clear transform to allow CSS class to handle it
                // We need to do this slightly after adding the class to ensure transition works
                requestAnimationFrame(() => {
                    selector.style.transform = ''; 
                });

                // Notify backend about mask update to include the sidebar
                // We do this after a small delay to ensure the DOM has updated and transition started
                setTimeout(() => {
                    if (typeof sendMaskUpdate === 'function') sendMaskUpdate();
                }, motionDelay(50));

                if (typeof bridge !== 'undefined' && bridge && typeof bridge.resizeNudge === 'function') {
                    bridge.resizeNudge();
                }
                
                // Auto scroll to current page
                setTimeout(() => {
                    const activeItem = selector.querySelector('.page-item.active');
                    if (activeItem) {
                        activeItem.scrollIntoView({ block: 'center', behavior: motionBehavior() });
                    }
                }, motionDelay(300)); // Wait for transition
            }
        }

        // Tracks which thumbnails have been requested or are cached
        const thumbnailCache = new Set();
        
        function renderPageSelector() {
            const grid = document.getElementById('page-grid-content');
            grid.innerHTML = '';
            
            for (let i = 1; i <= totalPage; i++) {
                const item = document.createElement('div');
                item.className = 'page-item';
                if (i === currentPage) item.classList.add('active');
                
                const img = document.createElement('img');
                img.id = 'thumb-' + i;
                img.alt = 'Slide ' + i;
                
                // Loading Spinner
                const spinner = document.createElement('div');
                spinner.className = 'loading-spinner';
                spinner.id = 'spinner-' + i;
                spinner.innerHTML = `
                  <svg viewBox="0 0 27 27">
                    <circle class="spinner-ring" cx="13.5" cy="13.5" r="10"></circle>
                    <g class="spinner-orbit">
                      <circle class="spinner-dot" cx="13.5" cy="8.0" r="2.5"></circle>
                    </g>
                  </svg>
                `;
                
                const num = document.createElement('div');
                num.className = 'page-num';
                num.innerText = i;
                
                item.appendChild(spinner);
                item.appendChild(img);
                item.appendChild(num);
                item.onclick = () => selectPage(i);
                grid.appendChild(item);
            }
            
            // Request thumbnails for current page ±5 pages first
            requestThumbnailsForRange(
                Math.max(1, currentPage - 5),
                Math.min(totalPage, currentPage + 5)
            );
            
            // Setup scroll listener for dynamic loading
            const selector = document.getElementById('page-selector');
            const grid_el = document.getElementById('page-grid-content');
            if (selector && !selector._scrollListenerAttached) {
                selector.addEventListener('scroll', onPageGridScroll);
                selector._scrollListenerAttached = true;
            }
            
            // Start background caching
            startBackgroundThumbnailCaching();
        }
        
        function requestThumbnailsForRange(start, end) {
            for (let i = start; i <= end; i++) {
                if (!thumbnailCache.has(i)) {
                    thumbnailCache.add(i);
                    if (bridge && typeof bridge.requestThumbnail === 'function') {
                        bridge.requestThumbnail(i);
                    }
                }
            }
        }
        
        function onPageGridScroll() {
            const selector = document.getElementById('page-selector');
            if (!selector) return;
            
            const rect = selector.getBoundingClientRect();
            const scrollTop = selector.scrollTop;
            const itemHeight = 160; // Approximate height of page-item
            
            // Calculate visible range
            const visibleStart = Math.max(1, Math.floor(scrollTop / itemHeight));
            const visibleEnd = Math.min(totalPage, Math.ceil((scrollTop + selector.clientHeight) / itemHeight) + 2);
            
            // Request thumbnails for visible range ±3 pages
            const rangeStart = Math.max(1, visibleStart - 3);
            const rangeEnd = Math.min(totalPage, visibleEnd + 3);
            
            requestThumbnailsForRange(rangeStart, rangeEnd);
        }
        
        function startBackgroundThumbnailCaching() {
            // Start background caching if not already running
            if (window._thumbnailCachingRunning) return;
            window._thumbnailCachingRunning = true;
            
            if (bridge && typeof bridge.startBackgroundThumbnailCaching === 'function') {
                bridge.startBackgroundThumbnailCaching(totalPage);
            }
        }

        // ─── Per-page ink stroke storage ─────────────────────────────────
        const perPageStrokes = {};

        function saveInkPageState(page) {
            if (!page) return;
            const isSelfDev = (currentConfig || {}).penMode === 'self-developed';
            if (!isSelfDev) return;
            perPageStrokes[page] = {
                strokes: inkStrokes.length > 0 ? [...inkStrokes] : [],
                snapshot: null
            };
        }

        function restoreInkPageState(page) {
            const isSelfDev = (currentConfig || {}).penMode === 'self-developed';
            if (!isSelfDev) return;
            const data = perPageStrokes[page];
            const canvas = document.getElementById('ink-canvas');
            const bg = document.getElementById('ink-stroke-bg');
            if (!canvas || !bg) return;

            if (!data || (data.strokes.length === 0 && !data.snapshot)) {
                clearInkCanvas();
                return;
            }

            // Restore stroke data
            inkStrokes = data.strokes.length > 0 ? data.strokes : [];
            inkCurrentStroke = null;
            inkIsDrawing = false;

            if (inkActive) {
                // Pen active: replay strokes onto live canvas, clear static bg
                bg.style.backgroundImage = '';
                canvas.classList.add('active');
                try { redrawAllStrokes(); } catch (e) { console.error('[InkPage] redraw error:', e); }
                // Hide standalone stroke bg window
                if (typeof bridge !== 'undefined' && bridge && typeof bridge.hideStrokeBg === 'function') {
                    try { bridge.hideStrokeBg(); } catch (e) {}
                }
            } else {
                // Pen inactive: show via standalone stroke bg window, clear canvas
                if (data.strokes.length > 0) {
                    // Redraw strokes and generate snapshot on demand
                    try { redrawAllStrokes(); } catch (e) { console.error('[InkPage] redraw on restore:', e); }
                    var dataUrl = canvas.toDataURL();
                    bg.style.backgroundImage = 'url(' + dataUrl + ')';
                    if (typeof bridge !== 'undefined' && bridge && typeof bridge.showStrokeBg === 'function') {
                        try { bridge.showStrokeBg(dataUrl); } catch (e) {}
                    }
                } else {
                    clearInkCanvas();
                }
                canvas.classList.remove('active');
                const ctx = canvas.getContext('2d');
                if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            sendMaskUpdate();
        }

        function updatePageInfo(current, total) {
            // Per-page ink save/restore — must happen BEFORE currentPage overwrite
            const isSelfDev = (currentConfig || {}).penMode === 'self-developed';
            if (isSelfDev && currentPage !== 0 && currentPage !== current) {
                try {
                    console.log('[InkPage] updatePageInfo: saving page', currentPage, 'restoring page', current);
                    saveInkPageState(currentPage);
                    restoreInkPageState(current);
                } catch (e) {
                    console.error('[InkPage] save/restore error:', e);
                }
            } else {
                console.log('[InkPage] updatePageInfo: skip save/restore, isSelfDev:', isSelfDev, 'currentPage:', currentPage, 'newPage:', current);
            }

            currentPage = current;
            totalPage = total;
            
            const isCompat = currentConfig && currentConfig.compatibilityMode;

            // Fix: Select only previous buttons (left arrow)

            allBtns.forEach(btn => {

                } else if (isNext) {
                    if (disabledTools.includes('next')) {
                        btn.classList.add('disabled');
                    } else {
                        btn.classList.remove('disabled');
                    }
                }
            });
        }

            const variant = isDark ? 'dark' : 'light';

            if (!window.initialSettings.Appearance) window.initialSettings.Appearance = {};
            window.initialSettings.Appearance.ResolvedIsDark = !!isDark;
            window.initialSettings.Appearance.ThemeId = themeId || 'default';
            window.initialSettings.Appearance.ThemeMode = isDark ? 'Dark' : 'Light';
            
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            
            document.documentElement.setAttribute('data-theme-variant', variant);
            
            if (themeId) {

        function getStatusDisplayChar(char) {
            return char === ' ' ? '\u00A0' : char;
        }

        function getStatusLogicalChar(text) {
            return String(text || '').replace(/\u00A0/g, ' ');
        }

        function updateStatusDisplay(element, newText, animateAll = false) {
            if (!element) return;
            const chars = newText.split('');
            const wrappers = element.querySelectorAll('.status-digit-wrapper');
            const charCount = chars.filter(c => c !== '|').length;

            // If length mismatch, rebuild
            if (wrappers.length !== charCount) {
                element.innerHTML = '';
                chars.forEach(char => {
                    if (char === '|') {
                        const sep = document.createElement('span');
                        sep.className = 'status-separator';
                        element.appendChild(sep);
                    } else {
                        const wrap = document.createElement('span');
                        wrap.className = 'status-digit-wrapper';
                        const span = document.createElement('span');
                        span.textContent = getStatusDisplayChar(char);
                        wrap.appendChild(span);
                        element.appendChild(wrap);
                    }
                });
                return;
            }

            // Update existing - map chars to wrappers, skipping '|'
            let wrapperIndex = 0;
            chars.forEach(char => {
                if (char === '|') return;
                
                const wrap = wrappers[wrapperIndex++];
                if (!wrap) return;
                
                const currentSpan = wrap.firstElementChild;
                if (!currentSpan) return;
                
                // Check if value changed
                if (getStatusLogicalChar(currentSpan.textContent) !== char) {
                    // Only animate digits (0-9), not letters or symbols when animateAll is false
                    const isDigit = /\d/.test(char);
                    const shouldAnimate = !animationsDisabled() && (animateAll || isDigit);
                    
                    if (shouldAnimate && !currentSpan.classList.contains('status-digit-old')) {
                        const newSpan = document.createElement('span');
                        newSpan.textContent = getStatusDisplayChar(char);
                        newSpan.className = 'status-digit-new';

                        currentSpan.className = 'status-digit-old';
                        wrap.appendChild(newSpan);

                        setTimeout(() => {
                            if (currentSpan.parentNode === wrap) {
                                wrap.removeChild(currentSpan);
                            }
                            newSpan.className = '';
                        }, motionDelay(350));
                    } else {
                        currentSpan.textContent = getStatusDisplayChar(char);
                    }
                }
            });
        }

        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayMap = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const day = dayMap[now.getDay()];
            
            let timeString = '';
            
            // Check if showTime config exists, default to true if not set
            const showTime = currentConfig ? (currentConfig.statusBarShowTime !== false) : true;
            const showSeconds = currentConfig ? currentConfig.statusBarShowSeconds : false;
            
            if (showTime) {
                if (showSeconds) {
                    timeString = `${hours}:${minutes}:${seconds}|${month}月${date}日 ${day}`;
                } else {
                    timeString = `${hours}:${minutes}|${month}月${date}日 ${day}`;
                }
            }
            
            const timeDisplay = document.getElementById('time-display');
            if (timeDisplay) {
                // Only update if text actually changes
                if (timeString !== lastTimeString) {
                    updateStatusDisplay(timeDisplay, timeString);
                    lastTimeString = timeString;
                }
                timeDisplay.style.display = showTime ? 'inline' : 'none';
            }
        }

        function updateTimerStatus() {
            try {
                const timerDisplay = document.getElementById('timer-display');
                const timerArea = document.getElementById('timer-area');
                if (!timerDisplay || !timerArea) return;

                // Get timer state from bridge
                bridge.getTimerState(function(result) {
                    try {
                        const state = JSON.parse(result);
                        if (state.isRunning && state.totalSeconds > 0) {
                            timerDisplay.textContent = state.displayText;
                            timerArea.classList.add('active');
                        } else {
                            timerArea.classList.remove('active');
                        }
                    } catch (e) {
                        console.error('Error parsing timer state:', e);
                    }
                });
            } catch (e) {
                console.error('Error updating timer status:', e);
            }
        }
        
        // Restartable clock timer: interval depends on whether seconds are shown.
        // updateTimerStatus is now driven by the Python-side timer_manager.updated signal
        // via _on_timer_updated, so the 200ms polling interval is no longer needed.
        let _clockTimerId = null;
        function _startClockTimer() {
            if (_clockTimerId) clearInterval(_clockTimerId);
            const showSeconds = (currentConfig || {}).statusBarShowSeconds;
            _clockTimerId = setInterval(updateTime, showSeconds ? 1000 : 10000);
        }
        _startClockTimer();
        updateTime();

            const minutes = Math.floor(wholeSeconds / 60);

            const smtcItem = document.getElementById('status-smtc');

            const musicIcon = document.getElementById('smtc-music-icon');
            const artworkThumb = document.getElementById('smtc-artwork-thumb');
            if (!smtcItem || !smtcText) return;

            if (!showMusic || !currentMusicState.visible) {

                return;

            smtcItem.style.display = 'flex';

            if (artworkThumb && currentMusicState.artworkDataUrl) {

                    lastStatusArtworkUrl = currentMusicState.artworkDataUrl;
                }
                artworkThumb.style.display = '';
                if (musicIcon) musicIcon.style.display = 'none';
            } else {
                if (artworkThumb) {
                    if (lastStatusArtworkUrl !== '') {
                        artworkThumb.src = '';
                        lastStatusArtworkUrl = '';
                    }
                    artworkThumb.style.display = 'none';
                }
                if (musicIcon) musicIcon.style.display = '';
            }

            const newMusicText = buildMusicStatusText({
                smtc_title: currentMusicState.baseText,
                smtc_status: currentMusicState.status
            });
            if (!newMusicText) {
                hideMusicStatus();
                return;
            }
            if (smtcText.textContent === newMusicText) {
                return;
            }

            const updateMusicDigits = () => {
                updateStatusDisplay(smtcText, newMusicText);
                lastStatusValues.music = newMusicText;
                lastStatusValues.musicBase = currentMusicState.baseText;
            };

            if (flipTitle && !animationsDisabled() && lastStatusValues.musicBase !== currentMusicState.baseText) {
                smtcText.classList.remove('status-music-flip-in');
                smtcText.classList.add('status-music-flip');

                setTimeout(() => {
                    smtcText.textContent = '';
                    updateMusicDigits();
                    smtcText.classList.remove('status-music-flip');
                    smtcText.classList.add('status-music-flip-in');

                    setTimeout(() => {
                        smtcText.classList.remove('status-music-flip-in');
                    }, motionDelay(300));

        function updateSystemStatus(data) {
            // Get display settings from config
            const showBattery = currentConfig ? (currentConfig.statusBarShowBattery !== false) : true;
            const showVolume = currentConfig ? (currentConfig.statusBarShowVolume !== false) : true;
            const showNetwork = currentConfig ? (currentConfig.statusBarShowNetwork !== false) : true;
            const showMusic = currentConfig ? (currentConfig.statusBarShowMusic !== false) : true;
            
            // Battery
            const batteryItem = document.getElementById('status-battery');
            const batteryText = document.getElementById('battery-text');
            const batteryIcon = document.querySelector('#status-battery .icon-mask');
            
            if (showBattery) {
                batteryItem.style.display = 'flex';
                if (data.is_desktop) {
                    const newBatteryText = "台式机";
                    if (batteryText.innerText !== newBatteryText) {
                        updateStatusDisplay(batteryText, newBatteryText);
                        lastStatusValues.battery = newBatteryText;
                    }
                    batteryIcon.className = 'icon-mask icon-desktop';
                } else {
                    const newBatteryText = data.battery_percent + '%';
                    if (batteryText.innerText !== newBatteryText) {
                        updateStatusDisplay(batteryText, newBatteryText);
                        lastStatusValues.battery = newBatteryText;
                    }
                    if (data.battery_charging) {

                batteryItem.style.display = 'none';

            // Network

            const netIcon = document.querySelector('#status-network .icon-mask');

                     updateStatusDisplay(volText, newVolText);

        function initSlider() {
            const thumb = document.getElementById('clear-thumb');
            const container = document.getElementById('clear-slider');
            const text = container.querySelector('.slider-text');
            let isDragging = false;
            let startX = 0;
            let currentX = 0;
            const maxDrag = 156;

            function onStart(e) {
                isDragging = true;
                startX = (e.touches ? e.touches[0].clientX : e.clientX) - currentX;
                thumb.style.transition = 'none';
                text.style.opacity = 1;
            }

            function onMove(e) {
                if (!isDragging) return;
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let newX = clientX - startX;
                
                if (newX < 0) newX = 0;
                if (newX > maxDrag) newX = maxDrag;
                
                currentX = newX;
                thumb.style.transform = `translateX(${currentX}px)`;
                
                text.style.opacity = 1 - (currentX / maxDrag);
            }

            function onEnd() {
                if (!isDragging) return;
                isDragging = false;
                thumb.style.transition = animationsDisabled() ? 'none' : 'transform 0.3s ease';
                
                if (currentX > maxDrag * 0.8) {
                    currentX = maxDrag;
                    thumb.style.transform = `translateX(${currentX}px)`;
                    if (bridge) {
                        const selfDev = (currentConfig || {}).penMode === 'self-developed';
                        if (selfDev) {
                            clearInkCanvas();
                        } else {
                            bridge.clearScreen();
                        }
                    }
                    
                    setTimeout(() => {
                        currentX = 0;
                        thumb.style.transform = `translateX(0px)`;
                        text.style.opacity = 1;
                        document.getElementById('eraser-settings').classList.remove('visible');
                    }, motionDelay(300));
                } else {
                    currentX = 0;
                    thumb.style.transform = `translateX(0px)`;
                    text.style.opacity = 1;
                }
            }

            thumb.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            
            thumb.addEventListener('touchstart', onStart);
            document.addEventListener('touchmove', onMove);
            document.addEventListener('touchend', onEnd);
        }
        
        window.addEventListener('load', initSlider);

        let _maskResizeScheduled = false;
        const observer = new ResizeObserver(entries => {

                    sendMaskUpdate();
                });

        });

        let _maskUpdateScheduled = false;
        function scheduleMaskUpdate() {
            if (_maskUpdateScheduled) return;
            _maskUpdateScheduled = true;
            requestAnimationFrame(() => {
                _maskUpdateScheduled = false;

            setTimeout(() => {

        // Toolbar Collapse Logic
        let isToolbarCollapsed = false;
        let toolbarTouchStartY = 0;
        let toolbarTouchStartX = 0;

        function toggleToolbar(collapsed) {
            if (typeof collapsed === 'undefined') collapsed = !isToolbarCollapsed;
            isToolbarCollapsed = collapsed;
            
            const container = document.getElementById('toolbar-container');
            if (collapsed) {
                container.classList.add('collapsed');
                container.classList.remove('half-collapsed');
                stopHalfCollapseTimer();
            } else {
                container.classList.remove('collapsed');
                resetHalfCollapseTimer();
            }
            
            scheduleMaskUpdate();
        }

        let halfCollapseTimer = null;
        let halfCollapseEnabled = false;

        function stopHalfCollapseTimer() {
            if (halfCollapseTimer) {
                clearTimeout(halfCollapseTimer);
                halfCollapseTimer = null;
            }
        }

        function resetHalfCollapseTimer() {
            stopHalfCollapseTimer();
            const container = document.getElementById('toolbar-container');
            if (container.classList.contains('half-collapsed')) {
                container.classList.remove('half-collapsed');
                scheduleMaskUpdate();
            }
            if (!halfCollapseEnabled || isToolbarCollapsed) return;
            halfCollapseTimer = setTimeout(() => {
                const c = document.getElementById('toolbar-container');
                if (!isToolbarCollapsed && !c.classList.contains('half-collapsed')) {
                    c.classList.add('half-collapsed');
                    scheduleMaskUpdate();
                }
            }, 3000);

        function onToolbarInteraction() {
            if (!halfCollapseEnabled) return;
            const container = document.getElementById('toolbar-container');
            if (container.classList.contains('half-collapsed')) {
                container.classList.remove('half-collapsed');
                scheduleMaskUpdate();
            }
            resetHalfCollapseTimer();
