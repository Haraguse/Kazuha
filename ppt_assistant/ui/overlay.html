        // Gestures
        const toolbarEl = document.getElementById('toolbar');
        const handleEl = document.getElementById('toolbar-handle');

        toolbarEl.addEventListener('mouseenter', () => onToolbarInteraction());
        toolbarEl.addEventListener('click', () => onToolbarInteraction());
        toolbarEl.addEventListener('touchstart', () => onToolbarInteraction(), {passive: true});
        
        // Handle Click
        handleEl.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleToolbar(false);
        });

        // Toolbar Swipe Down (Collapse)
        toolbarEl.addEventListener('mousedown', e => {
            toolbarTouchStartY = e.clientY;
            toolbarTouchStartX = e.clientX;
        });
        
        toolbarEl.addEventListener('touchstart', e => {
            if(e.touches.length > 0) {
                toolbarTouchStartY = e.touches[0].clientY;
                toolbarTouchStartX = e.touches[0].clientX;
            }
        }, {passive: true});

        function handleToolbarSwipe(e, clientX, clientY) {
            const diffY = clientY - toolbarTouchStartY;
            const diffX = clientX - toolbarTouchStartX;
            const config = currentConfig || {};
            const pos = config.toolbarPosition || 'bottom';
            const threshold = 40; // Pixel threshold

            if (pos === 'bottom') {
                if (diffY > threshold) toggleToolbar(true);
            } else if (pos === 'top') {
                if (diffY < -threshold) toggleToolbar(true);
            } else if (pos === 'left') {
                if (diffX < -threshold) toggleToolbar(true);
            } else if (pos === 'right') {
                if (diffX > threshold) toggleToolbar(true);
            }
        }

        toolbarEl.addEventListener('mouseup', e => {
            handleToolbarSwipe(e, e.clientX, e.clientY);
        });
        
        toolbarEl.addEventListener('touchend', e => {
            if (e.changedTouches.length > 0) {
                handleToolbarSwipe(e, e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
        });
        
        // Handle Swipe Up (Expand)
        handleEl.addEventListener('mousedown', e => {
            toolbarTouchStartY = e.clientY;
            toolbarTouchStartX = e.clientX;
        });
        
        handleEl.addEventListener('touchstart', e => {
             if(e.touches.length > 0) {
                toolbarTouchStartY = e.touches[0].clientY;
                toolbarTouchStartX = e.touches[0].clientX;
            }
        }, {passive: true});
        
        function handleHandleSwipe(e, clientX, clientY) {
            const diffY = clientY - toolbarTouchStartY;
            const diffX = clientX - toolbarTouchStartX;
            const config = currentConfig || {};
            const pos = config.toolbarPosition || 'bottom';
            const threshold = 30; 

            if (pos === 'bottom') {
                if (diffY < -threshold) toggleToolbar(false);
            } else if (pos === 'top') {
                if (diffY > threshold) toggleToolbar(false);
            } else if (pos === 'left') {
                if (diffX > threshold) toggleToolbar(false);
            } else if (pos === 'right') {
                if (diffX < -threshold) toggleToolbar(false);
            }
        }
        
        handleEl.addEventListener('mouseup', e => {
            handleHandleSwipe(e, e.clientX, e.clientY);
        });
        
        handleEl.addEventListener('touchend', e => {
            if (e.changedTouches.length > 0) {
                handleHandleSwipe(e, e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
        });

        // Override sendMaskUpdate to exclude collapsed toolbar
        // Updated: synchronous execution (no rAF) to eliminate timing windows where mask is stale.
        // Removed hasStrokeBg early return — toolbar mask always applies so buttons stay clickable.
        function sendMaskUpdate() {
            if (!bridge) return;

            // Pen active OR guide active → full-screen mask
            if (inkActive || guideActive) {
                bridge.updateMask([{
                    x: 0,
                    y: 0,
                    width: window.innerWidth,
                    height: window.innerHeight
                }], window.noop);
                return;
            }

            // Collect interactive element rects → toolbar-only mask.
            // Area outside the toolbar has no mask → events pass through to PPT normally.
            const rects = [];
            const isCollapsed = document.getElementById('toolbar-container').classList.contains('collapsed');

            // First pass: batch-read all layout-dependent properties (offsetParent,
            // computedStyle, getBoundingClientRect) to avoid layout thrashing.
            // page-selector needs no layout reads; media-popup only reads rect when visible.
            const info = [];
            for (let i = 0; i < _interactiveEls.length; i++) {
                const el = _interactiveEls[i];
                const entry = { el: el, id: el.id };
                if (el.id === 'media-popup') {
                    entry.visible = el.classList.contains('visible');
                    entry.rect = entry.visible ? el.getBoundingClientRect() : null;
                } else if (el.id !== 'page-selector') {
                    entry.offsetParent = el.offsetParent;
                    const style = window.getComputedStyle(el);
                    entry.opacity = style.opacity;
                    entry.pointerEvents = style.pointerEvents;
                    entry.visibility = style.visibility;
                    entry.rect = el.getBoundingClientRect();
                }
                info.push(entry);
            }

            // Second pass: build rects from cached reads (no layout reads here).
            for (let i = 0; i < info.length; i++) {
                const entry = info[i];
                const el = entry.el;

                // Special handling for page selector to ensure it's detected even if transition is running
                if (entry.id === 'page-selector') {
                    if (el.classList.contains('visible')) {
                        // Force send full rect for sidebar
                        const isLeft = el.classList.contains('left-side');
                        rects.push({
                            x: isLeft ? 0 : (window.innerWidth - 260 - 64), // Larger buffer for right side
                            y: 0,
                            width: 324, // Significantly wider interaction area (260 + 64)
                            height: window.innerHeight
                        });
                    }
                    continue;
                }

                // Explicit handling for media popup because window mask clips visual output.
                // Its soft transitions/shadow can be outside normal layout bounds.
                if (entry.id === 'media-popup') {
                    if (entry.visible) {
                        const r = entry.rect;
                        rects.push({
                            x: Math.max(0, r.x - 2),
                            y: Math.max(0, r.y - 2),
                            width: r.width + 4,
                            height: r.height + 4
                        });
                    }
                    continue;
                }

                if (entry.offsetParent === null) continue;

                if (entry.opacity === '0' || entry.pointerEvents === 'none' || entry.visibility === 'hidden') continue;

                // Skip toolbar if collapsed (redundant with pointerEvents check but explicit)
                if (isCollapsed && entry.id === 'toolbar') continue;

                // Skip handle if NOT collapsed (handle is only interactive when collapsed)
                if (!isCollapsed && entry.id === 'toolbar-handle') continue;

                const r = entry.rect;
                if (r.width === 0 || r.height === 0) continue;

                rects.push({
                    x: r.x,
                    y: r.y,
                    width: r.width,
                    height: r.height
                });
            }
            // Include overlay tooltip in mask so it stays visible outside toolbar bounds
            const _tooltipEl = document.getElementById('overlay-tooltip');
            if (_tooltipEl && _tooltipEl.classList.contains('visible')) {
                const tr = _tooltipEl.getBoundingClientRect();
                if (tr.width > 0 && tr.height > 0) {
                    rects.push({
                        x: Math.max(0, tr.x - 2),
                        y: Math.max(0, tr.y - 2),
                        width: tr.width + 4,
                        height: tr.height + 4
                    });
                }
            }

            bridge.updateMask(rects, window.noop);
        }

            function detectLocale() {
                let lang = '';
                try {
                    lang = (
                        (currentConfig && currentConfig.language) ||
                        document.documentElement.lang ||
                        navigator.language ||
                        'zh-CN'
                    );
                } catch (e) { lang = 'zh-CN'; }
                lang = String(lang).toLowerCase();
                if (lang.indexOf('zh') === 0) {
                    if (lang.indexOf('cn') >= 0 || lang.indexOf('hans') >= 0) return 'zh-CN';
                    if (lang.indexOf('yue') >= 0) return 'yue-HK';
                    if (lang.indexOf('tw') >= 0 || lang.indexOf('hant') >= 0) return 'zh-TW';
                    if (lang.indexOf('hk') >= 0 || lang.indexOf('mo') >= 0) return 'yue-HK';
                    return 'zh-CN';
                }
                if (lang.indexOf('ja') === 0) return 'ja-JP';
                if (lang.indexOf('en') === 0) return 'en-US';
                return 'zh-CN';
            }

            function t(key) {
                const locale = detectLocale();
                const table = GUIDE_I18N[locale] || GUIDE_I18N['zh-CN'];
                let val = table[key];
                if (val === undefined) val = GUIDE_I18N['zh-CN'][key];
                if (val === undefined) return key;
                return val;
            }

            // ── Bridge helper — safe bridge access with typeof guard ──
            function bridgeCall(method) {
                if (typeof bridge !== 'undefined' && bridge && typeof bridge[method] === 'function') {
                    bridge[method]();
                }
            }

            // ── Demo timing constants (milliseconds) ──
            const DEMO_DELAYS = {
                SHORT: 300,
                MEDIUM: 500,
                LONG: 600,
                CONTENT_SWAP: 220,
                CARD_FOLLOW: 350,
                MASK_RESTORE: 300,
            };

            // Resolve the last app launcher button rendered in the toolbar
            // (app buttons carry no stable id — detect by icon class).
            function findAppsButton() {
                const toolbar = document.getElementById('toolbar');
                if (!toolbar) return null;
                const appBtns = Array.from(toolbar.querySelectorAll('.tool-btn')).filter(function (btn) {
                    return !!(btn.querySelector('.icon-img') || (btn.querySelector('.mi') && btn.querySelector('.mi').textContent.trim() === 'apps'));
                });
                return appBtns.length > 0 ? appBtns[appBtns.length - 1] : null;
            }

            const GUIDE_STEPS = [
                { type: 'intro', titleKey: 'welcome.title', descKey: 'welcome.desc' },
                { type: 'button', selector: '#btn-select', titleKey: 'step.select.title', descKey: 'step.select.desc' },
                { type: 'button', selector: '#btn-pen', titleKey: 'step.pen.title', descKey: 'step.pen.desc', skipIfMissing: true, demoTarget: '#color-picker',
                    demo: function () { if (currentTool !== 'pen') document.querySelector('#btn-pen').click(); if (!document.getElementById('color-picker').classList.contains('visible')) document.querySelector('#btn-pen').click(); },
                    undoDemo: function () { closePopup(); document.querySelector('#btn-select').click(); } },
                { type: 'button', selector: '#btn-eraser', titleKey: 'step.eraser.title', descKey: 'step.eraser.desc', skipIfMissing: true, demoTarget: '#eraser-settings',
                    demo: function () { if (currentTool !== 'eraser') document.querySelector('#btn-eraser').click(); if (!document.getElementById('eraser-settings').classList.contains('visible')) document.querySelector('#btn-eraser').click(); },
                    undoDemo: function () { closePopup(); document.querySelector('#btn-select').click(); } },
                { type: 'button', selector: '#btn-spotlight', titleKey: 'step.spotlight.title', descKey: 'step.spotlight.desc', skipIfMissing: true,
                    demo: function () {},
                    undoDemo: function () { closePopup(); bridgeCall('spotlightClearDemoFrame'); if (demoState.spotlight) { document.querySelector('#btn-spotlight').click(); demoState.spotlight = false; } } },
                { type: 'button', titleKey: 'step.spotlightPanel.title', descKey: 'step.spotlightPanel.desc', skipIfMissing: true,
                    demo: function () {
                        bridgeCall('closeOtherPluginWindows', '聚光灯');
                        if (demoState.board) demoState.board = false;
                        if (demoState.timer) demoState.timer = false;
                        var btn = document.querySelector('#btn-spotlight');
                        demoState.spotlight = btn && !btn.classList.contains('active');
                        demoState._spotlightTimers = [];
                        if (demoState.spotlight) btn.click();
                        bridgeCall('spotlightSetTransparent');
                        demoState._spotlightTimers.push(window.setTimeout(function () {
                            bridgeCall('spotlightDrawDemoFrame');
                        }, DEMO_DELAYS.MEDIUM));
                    },
                    undoDemo: function () {
                        closePopup();
                        if (demoState._spotlightTimers) {
                            demoState._spotlightTimers.forEach(function (t) { window.clearTimeout(t); });
                            demoState._spotlightTimers = null;
                        }
                        bridgeCall('spotlightClearDemoFrame');
                        if (demoState.spotlight) {
                            document.querySelector('#btn-spotlight').click();
                            demoState.spotlight = false;
                        }
                    } },
                { type: 'button', selector: '#btn-board_in_board', titleKey: 'step.boardPanel.title', descKey: 'step.boardPanel.desc', skipIfMissing: true,
                    demo: function () {
                        bridgeCall('closeOtherPluginWindows', '板中板');
                        if (demoState.spotlight) demoState.spotlight = false;
                        if (demoState.timer) demoState.timer = false;
                        if (demoState.spotlight) {
                            document.querySelector('#btn-spotlight').click();
                            demoState.spotlight = false;
                        }
                        var btn = document.querySelector('#btn-board_in_board');
                        var isActive = btn && btn.classList.contains('active');
                        demoState.board = btn && !isActive;
                        if (demoState.board) {
                            btn.click();
                        }
                        window.setTimeout(function () { bridgeCall('boardDrawDemoFrame'); }, DEMO_DELAYS.SHORT);
                        window.setTimeout(function () { bridgeCall('boardFocusGuideSpotlight'); }, DEMO_DELAYS.MEDIUM);
                    },
                    undoDemo: function () { closePopup(); bridgeCall('clearBoardDemoFrame'); demoState.board = false; } },
                { type: 'button', selector: '#btn-timer', titleKey: 'step.timer.title', descKey: 'step.timer.desc', skipIfMissing: true,
                    demo: function () {
                        bridgeCall('closeOtherPluginWindows', '计时器');
                        if (demoState.spotlight) demoState.spotlight = false;
                        if (demoState.board) demoState.board = false;
                        var btn = document.querySelector('#btn-timer');
                        demoState.timer = btn && !btn.classList.contains('active');
                            if (demoState.timer) {
                            bridgeCall('toggleTimer');
                            window.setTimeout(function () {
                                bridgeCall('timerDrawDemoFrame');
                            }, DEMO_DELAYS.SHORT);
                            window.setTimeout(function () { bridgeCall('timerFocusGuideSpotlight'); }, DEMO_DELAYS.SHORT);
                        }
                    },
                    undoDemo: function () { closePopup(); bridgeCall('clearTimerDemoFrame'); if (demoState.timer) { bridgeCall('toggleTimer'); demoState.timer = false; } } },
                { type: 'button', customSelector: findAppsButton, titleKey: 'step.apps.title', descKey: 'step.apps.desc', skipIfMissing: true },
                { type: 'button', selector: '#left-flipper', titleKey: 'step.pageNav.title', descKey: 'step.pageNav.desc', padX: 12, padY: 10, skipIfMissing: true },
                { type: 'button', selector: '#left-flipper .page-info-container', titleKey: 'step.pageSelector.title', descKey: 'step.pageSelector.desc', padX: 8, padY: 6, skipIfMissing: true, demoTarget: '#page-selector',
                    demo: function () { var sel = document.getElementById('page-selector'); demoState.pageSelector = !sel || !sel.classList.contains('visible'); if (demoState.pageSelector) document.querySelector('#left-flipper .page-info-container').click(); },
                    undoDemo: function () { closePopup(); if (demoState.pageSelector) document.querySelector('#left-flipper .page-info-container').click(); } },
                { type: 'button', selector: '#btn-end', titleKey: 'step.endShow.title', descKey: 'step.endShow.desc' },
                { type: 'outro', titleKey: 'done.title', descKey: 'done.desc' }
            ];

            // ── State ──
            let isActive = false;
            let currentStep = -1;
            let visibleSteps = [];
            let activeButton = null;
            let listenersAttached = false;
            let contentSwapTimer = null;
            let maskRestoreTimer = null;
            let demoTimer = null;
            let demoState = {};

            // ── Element refs ──
            const root = document.getElementById('toolbar-guide-root');
            const spotlight = document.getElementById('toolbar-guide-spotlight');
            const card = document.getElementById('toolbar-guide-card');
            const titleEl = root ? root.querySelector('.toolbar-guide-title') : null;
            const descEl = root ? root.querySelector('.toolbar-guide-desc') : null;
            const contentEl = root ? root.querySelector('.toolbar-guide-content') : null;
            const dotsEl = root ? root.querySelector('.toolbar-guide-dots') : null;
            const skipBtn = root ? root.querySelector('.toolbar-guide-skip') : null;
            const prevBtn = root ? root.querySelector('.toolbar-guide-prev') : null;
            const nextBtn = root ? root.querySelector('.toolbar-guide-next') : null;

            function resolveStepElement(step) {
                if (!step) return null;
                if (typeof step.customSelector === 'function') return step.customSelector();
                if (step.selector) return document.querySelector(step.selector);
                return null;
            }

            function clearActiveButton() {
                if (activeButton) {
                    activeButton.classList.remove('toolbar-guide-active');
                    activeButton = null;
                }
            }

            function positionCardCentered() {
                if (!card) return;
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const cardW = card.offsetWidth || 340;
                const cardH = card.offsetHeight || 220;
                card.style.transform = '';
                card.style.left = Math.max(0, (vw - cardW) / 2) + 'px';
                card.style.top = Math.max(0, (vh - cardH) / 2) + 'px';
            }

            function positionCardForRect(rect) {
                if (!card) return;
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const cardW = card.offsetWidth || 340;
                const cardH = card.offsetHeight || 220;
                card.style.transform = '';
                let left = rect.left + rect.width / 2 - cardW / 2;
                left = Math.max(16, Math.min(left, vw - cardW - 16));
                card.style.left = left + 'px';
                const placeBelow = (rect.top + rect.height / 2) < (vh / 2);
                let top;
                if (placeBelow) {
                    top = rect.bottom + 16;
                    if (top + cardH > vh - 16) {
                        const above = rect.top - cardH - 16;
                        top = (above >= 16) ? above : Math.max(16, vh - cardH - 16);
                    }
                } else {
                    top = rect.top - cardH - 16;
                    if (top < 16) {
                        const below = rect.bottom + 16;
                        top = (below + cardH <= vh - 16) ? below : 16;
                    }
                }
                card.style.top = top + 'px';
            }

            window.toolbarGuideSpotlightAt = function (x, y, w, h) {
                if (!isActive) return;
                if (!spotlight) return;
                // Use instant class to disable transitions, move without flashing
                spotlight.classList.add('toolbar-guide-spotlight-instant');
                spotlight.style.left = (x - 6) + 'px';
                spotlight.style.top = (y - 6) + 'px';
                spotlight.style.width = (w + 12) + 'px';
                spotlight.style.height = (h + 12) + 'px';
                void spotlight.offsetWidth; // force reflow
                spotlight.classList.remove('toolbar-guide-spotlight-instant');
                spotlight.style.opacity = '1';
                positionCardForRect({ left: x, top: y, width: w, height: h, bottom: y + h });
            };

            function renderDots(activeIndex, total) {
                if (!dotsEl) return;
                dotsEl.innerHTML = '';
                for (let i = 0; i < total; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'dot' + (i === activeIndex ? ' active' : '');
                    dotsEl.appendChild(dot);
                }
            }

            function renderStep(index, skipInitialFade) {
                const step = visibleSteps[index];
                if (!step || !root) return;
                console.log('[ToolbarGuide] renderStep(index=' + index + ', type=' + step.type + ')');
                const total = visibleSteps.length;
                const isLast = index === total - 1;
                const isModal = step.type === 'intro' || step.type === 'outro';
                const previousStepWasModal = currentStep >= 0 && visibleSteps[currentStep] &&
                    (visibleSteps[currentStep].type === 'intro' || visibleSteps[currentStep].type === 'outro');
                const shouldFadeInSpotlight = !isModal && previousStepWasModal;
                const goingBackward = index < currentStep;

                // Undo previous step's demo before switching
                if (currentStep >= 0 && currentStep !== index) {
                    var prevDemoStep = visibleSteps[currentStep];
                    // When going backward to a noUndoOnAdvance step, skip undoDemo
                    // to preserve the shared state (e.g., board/spotlight) that was
                    // intentionally kept open during forward navigation.
                    var targetStep = visibleSteps[index];
                    var skipUndo = goingBackward && targetStep && targetStep.noUndoOnAdvance;
                    var isForward = index > currentStep;
                    if (prevDemoStep && !skipUndo && typeof prevDemoStep.undoDemo === 'function') {

                            var currTop = parseFloat(spotlight.style.top) || 0;
                            var currWidth = parseFloat(spotlight.style.width) || 0;
                            var currHeight = parseFloat(spotlight.style.height) || 0;

                            var currCenterY = currTop + currHeight / 2;

                            var targetCenterY = rect.top + rect.height / 2;

                            spotlight.style.top = (rect.top - padY) + 'px';

                                                    top: Math.min(rect.top, tpRect.top),
                                                    right: Math.max(rect.right, tpRect.right),
                                                    bottom: Math.max(rect.bottom, tpRect.bottom),
                                                    width: Math.max(rect.right, tpRect.right) - Math.min(rect.left, tpRect.left),
                                                    height: Math.max(rect.bottom, tpRect.bottom) - Math.min(rect.top, tpRect.top)

                                        // animate position/size change (480ms cubic-bezier)

                                        spotlight.style.height = (rect.height + 12) + 'px';

                observer.observe(toolbar, { childList: true });

                // Also observe center-area for flipper changes
                const centerArea = document.getElementById('center-area');
                if (centerArea) {
                    const caObserver = new MutationObserver(function (mutations) {
                        let shouldScan = false;
                        for (let i = 0; i < mutations.length; i++) {
                            if (mutations[i].addedNodes.length > 0) {
                                shouldScan = true;
                                break;
                            }
                        }
                        if (shouldScan) {
                            requestAnimationFrame(scanAndAttach);
                        }
                    });
                    caObserver.observe(centerArea, { childList: true, subtree: true });
                }
            }

            // Initialize: wait for toolbar to be ready, then scan
            function init() {
                console.log('[OverlayTooltip] init');
                ensureTooltipEl();
                scanAndAttach();
                initObserver();
            }

            // Poll for toolbar readiness (toolbar content is built dynamically)
            function waitForToolbar() {
                const startTime = Date.now();
                function poll() {
                    if (document.querySelector('#toolbar .tool-btn')) {
                        init();
                    } else if (Date.now() - startTime < 5000) {
                        requestAnimationFrame(poll);
                    } else {
                        console.warn('[OverlayTooltip] toolbar not ready after 5s, initializing anyway');
                        init();
                    }
                }
                requestAnimationFrame(poll);
            }

            waitForToolbar();
            console.log('[OverlayTooltip] module registered');
        })();
    </script>
</body>
</html>
