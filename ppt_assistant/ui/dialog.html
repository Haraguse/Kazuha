<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dialog</title>
  <style>
    @font-face {
      font-family: "Google Sans Flex";
      src: url("../../fonts/Google Sans Flex.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: "MiSans VF";
      src: url("../../fonts/MiSansVF.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: "MiSans Japanese VF";
      src: url("../../fonts/MiSansJapaneseVF.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: "MiSans TC VF";
      src: url("../../fonts/MiSansTCVF.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --bg-body: transparent;
      --bg-app: rgba(255, 255, 255, 0.6);
      --text-primary: #191919;
      --text-secondary: #666666;
      --accent-blue: #3275F5;
      --divider: rgba(0, 0, 0, 0.08);
      --card-bg: rgba(0, 0, 0, 0.03);
      --card-border: rgba(0, 0, 0, 0.02);
      --item-hover: rgba(0, 0, 0, 0.05);
      --btn-cancel-bg: rgba(245, 245, 245, 0.5);
      --font-stack: "Google Sans Flex", "MiSans VF", "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-weight-override: 400;
    }

    :root[data-disable-animations="true"] *,
    :root[data-disable-animations="true"] *::before,
    :root[data-disable-animations="true"] *::after {
      transition: none !important;
      scroll-behavior: auto !important;
    }

    [data-theme="dark"] {
      --bg-body: transparent;
      --bg-app: rgba(30, 30, 30, 0.6);
      --text-primary: #E5E5E5;
      --text-secondary: #909090;
      --accent-blue: #4A85F6;
      --divider: rgba(255, 255, 255, 0.08);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.02);
      --item-hover: rgba(255, 255, 255, 0.05);
      --btn-cancel-bg: rgba(44, 44, 44, 0.5);
    }

    [data-theme-id="year-of-horse"] {
      --accent-blue: #D32F2F;
      --bg-app: rgba(255, 235, 238, 0.95);
      --card-bg: rgba(211, 47, 47, 0.15);
      --card-border: rgba(211, 47, 47, 0.2);
      --item-hover: rgba(211, 47, 47, 0.18);
      --btn-cancel-bg: rgba(211, 47, 47, 0.15);
      --text-primary: #B71C1C;
      --text-secondary: rgba(183, 28, 28, 0.6);
      --divider: rgba(211, 47, 47, 0.2);
    }

    [data-theme="dark"][data-theme-id="year-of-horse"] {
      --accent-blue: #FF4500;
      --bg-app: rgba(69, 18, 18, 0.95);
      --card-bg: rgba(255, 69, 0, 0.15);
      --card-border: rgba(255, 69, 0, 0.25);
      --item-hover: rgba(255, 69, 0, 0.22);
      --btn-cancel-bg: rgba(255, 69, 0, 0.15);
      --text-primary: #FFD700;
      --text-secondary: rgba(255, 215, 0, 0.6);
      --divider: rgba(255, 69, 0, 0.3);
    }

    /* Year of Horse Background Pattern */
    :root[data-theme-id="year-of-horse"] body {
      background-image: radial-gradient(circle at 100% 0%, rgba(230, 0, 0, 0.12) 0%, transparent 25%),
                        radial-gradient(circle at 0% 100%, rgba(230, 0, 0, 0.12) 0%, transparent 25%),
                        radial-gradient(circle at 50% 50%, rgba(230, 0, 0, 0.08) 0%, transparent 40%) !important;
      background-attachment: fixed;
    }

    :root[data-theme="dark"][data-theme-id="year-of-horse"] body {
      background-image: radial-gradient(circle at 100% 0%, rgba(255, 69, 0, 0.15) 0%, transparent 30%),
                        radial-gradient(circle at 0% 100%, rgba(255, 69, 0, 0.15) 0%, transparent 30%),
                        radial-gradient(circle at 50% 50%, rgba(255, 69, 0, 0.08) 0%, transparent 40%) !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-drag: none;
    }

    html, body {
      background: var(--bg-body) !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      color: var(--text-primary);
      font-family: var(--font-stack);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-body) !important;
    }

    html[data-font-weight-mode="override"] body,
    html[data-font-weight-mode="override"] body * {
      font-weight: var(--font-weight-override) !important;
    }

    .rtl {
      direction: rtl;
    }

    .rtl .dialog-container,
    .rtl .dialog-title,
    .rtl .dialog-text {
      text-align: right;
    }

    .rtl .dialog-buttons {
      flex-direction: row-reverse;
    }

    .dialog-window {
      background: var(--bg-body);
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .drag-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      -webkit-app-region: drag;
      z-index: 100;
    }

    .container {
      width: 100%;
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 24px 20px 24px;
      gap: 16px;
      position: relative;
    }

    .title {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-primary);
      padding: 0 4px;
    }

    .content-container {
      width: 100%;
      min-width: 0;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg-app);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--divider);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
    }

    .input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dialog-input {
      width: 100%;
      height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--divider);
      background: rgba(255, 255, 255, 0.6);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }

    [data-theme="dark"] .dialog-input {
      background: rgba(30, 30, 30, 0.6);
    }

    [data-theme="dark"] .content-container {
      background: var(--bg-app);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
    }

    .text-content {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text-primary);
      white-space: pre-wrap;
    }

    .error-card {
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-break: break-all;
      background: rgba(0, 0, 0, 0.02);
      padding: 12px;
      border-radius: 8px;
      max-height: 360px;
      overflow: auto;
    }

    [data-theme="dark"] .error-card {
      background: rgba(255, 255, 255, 0.03);
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 4px;
    }

    .btn {
      min-width: 88px;
      height: 34px;
      border-radius: 17px;
      border: none;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }

    .btn-cancel {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--divider);
    }

    .btn-cancel:hover {
      background: rgba(0, 0, 0, 0.04);
      color: var(--text-primary);
    }

    [data-theme="dark"] .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-confirm {
      background: transparent;
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
    }

    .btn-confirm:hover {
      background: var(--accent-blue);
      color: #FFFFFF;
    }

    .btn:active {
      transform: translateY(0);
      filter: brightness(0.9);
    }

    .dev-watermark {
      position: fixed;
      right: 16px;
      bottom: 12px;
      font-size: 11px;
      color: var(--text-secondary);
      text-align: right;
      pointer-events: none;
      line-height: 1.4;
      white-space: pre-line;
      z-index: 9999;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      backdrop-filter: blur(6px);
    }

    .loading-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 18px 22px;
      background: var(--bg-app);
      border-radius: 12px;
      border: 1px solid var(--divider);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
      color: var(--text-primary);
      font-size: 13px;
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
    }

    .loading-spinner svg {
      width: 100%;
      height: 100%;
      transform-origin: center;
      animation: spin-rotate 1s linear infinite;
    }

    .loading-spinner circle {
      fill: none;
      stroke: var(--accent-blue);
      stroke-width: 2;
      stroke-linecap: round;
    }

    @keyframes spin-rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--divider);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    /* Command Link Styles matching Settings Card Design */
    .command-links {
      display: flex;
      flex-direction: column;
      margin-top: 16px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--card-border);
      overflow: hidden;
    }

    .command-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      min-height: 60px;
      background: transparent;
      border-bottom: 1px solid var(--divider);
      cursor: pointer;
      transition: background 0.15s;
      text-align: left;
    }

    .command-link:last-child {
      border-bottom: none;
    }

    [data-theme="dark"] .command-link {
      background: transparent;
    }

    .command-link:hover {
      background: var(--item-hover);
    }

    [data-theme="dark"] .command-link:hover {
      background: var(--item-hover);
    }

    .command-link:active {
      background: var(--item-hover);
      filter: brightness(0.95);
    }

    .command-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .command-icon svg {
      width: 20px;
      height: 20px;
    }

    .command-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .command-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: 0.2px;
    }

    .command-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      opacity: 0.85;
    }
    
    .command-arrow {
      width: 14px;
      height: 14px;
      opacity: 0.4;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    /* Inline confirmation modal - reused from settings.html */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-dialog {
      background: var(--bg-app);
      width: 420px;
      max-width: 90vw;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      animation: modalFadeIn 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      padding: 0 4px;
    }

    .modal-island {
      background: var(--bg-surface);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--divider);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .modal-text {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text-primary);
      white-space: pre-wrap;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 0 4px;
    }

    .modal-btn {
      min-width: 88px;
      height: 36px;
      border-radius: 18px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }

    .modal-btn-secondary {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--divider);
    }

    .modal-btn-secondary:hover {
      background: var(--item-hover);
      color: var(--text-primary);
      border-color: var(--text-secondary);
    }

    .modal-btn-confirm {
      background: transparent;
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
    }

    .modal-btn-confirm:hover {
      background: var(--accent-blue);
      color: #FFFFFF;
    }

    .modal-btn:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }

    .rtl .modal-title,
    .rtl .modal-text {
      text-align: right;
    }

    .rtl .modal-footer {
      flex-direction: row-reverse;
    }
  </style>
</head>
<body>
  <div class="dialog-window">
    <div class="drag-area"></div>
    <div class="container">
      <div id="title" class="title">提示</div>
      <div class="content-container">
        <div id="text-content" class="text-content"></div>
        <div id="command-links" class="command-links" style="display: none;"></div>
        <div id="error-card" class="error-card" style="display: none;"></div>
        <div id="input-wrapper" class="input-wrapper" style="display: none;">
          <input id="dialog-input" class="dialog-input" type="password" />
        </div>
      </div>
      <div class="footer">
        <button id="btn-cancel" class="btn btn-cancel" onclick="onCancel()">取消</button>
        <button id="btn-confirm" class="btn btn-confirm" onclick="onConfirm()">确认</button>
      </div>
    </div>
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
      <div class="loading-card">
        <div class="loading-spinner">
          <svg viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="12"></circle>
          </svg>
        </div>
        <div id="loading-text"></div>
      </div>
    </div>
  </div>

  <!-- Multi-instance warning inline modal -->
  <div id="multi-warning-modal" class="modal-overlay">

      <div class="modal-title" id="multi-warning-title"></div>
      <div class="modal-island">
        <div class="modal-text" id="multi-warning-text"></div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-secondary" id="multi-warning-back"></button>
        <button class="modal-btn modal-btn-confirm" id="multi-warning-confirm"></button>
      </div>
    </div>
  </div>

  <div id="dev-watermark" class="dev-watermark" style="display: none;"></div>

    let settings = window.initialSettings || {};
    let currentLanguage = (settings.General && settings.General.Language) || "zh-CN";
    let inputMode = false;
    let confirmPending = false;

    function applyAnimationPreference() {
      const disabled = !!settings?.General?.DisableAnimations;
      document.documentElement.setAttribute("data-disable-animations", disabled ? "true" : "false");
    }

    applyAnimationPreference();

    function updateLanguageAndSettings(s) {
      if (s && typeof s === "object") {
        settings = s;
        window.initialSettings = s;
        if (s.General && s.General.Language) {
          currentLanguage = s.General.Language;
        }
      }
      applyAnimationPreference();
      applyDirection(currentLanguage);
    }

    function getText(key) {
      const fallbackLang = currentLanguage === "yue-HK" ? "zh-TW" : "zh-CN";
      const langPack = I18N[currentLanguage] || I18N[fallbackLang] || I18N["zh-CN"];
      if (langPack && key in langPack) return langPack[key];
      const fallback = I18N[fallbackLang] || I18N["zh-CN"];
      if (fallback && key in fallback) return fallback[key];
      return "";
    }

    function getDefaultFontStack(lang) {
      if (lang === "zh-TW") {
        return "\"Google Sans Flex\", \"MiSans Japanese VF\", \"MiSans TC VF\", \"Segoe UI\", system-ui, -apple-system, sans-serif";
      }
      if (lang === "yue-HK") {
        return "\"Google Sans Flex\", \"MiSans VF\", \"Segoe UI\", system-ui, -apple-system, sans-serif";
      }
      if (lang === "ja-JP") {
        return "\"Google Sans Flex\", \"MiSans Japanese VF\", \"MiSans TC VF\", \"Segoe UI\", system-ui, -apple-system, sans-serif";
      }
      if (lang === "ug-CN") {
        return "\"Google Sans Flex\", \"Segoe UI\", \"MiSans VF\", system-ui, -apple-system, sans-serif";
      }
      return "\"Google Sans Flex\", \"MiSans VF\", \"Segoe UI\", system-ui, -apple-system, sans-serif";
    }

    function getSelectedWebFont(lang) {
      if (settings && settings.Fonts && !settings.Fonts.CustomFont) return "";
      const profiles = settings && settings.Fonts && settings.Fonts.Profiles;
      const langProfile = profiles && profiles[lang];
      const v = langProfile && langProfile.web;
      return (typeof v === "string" && v.trim()) ? v.trim() : "";
    }

    function normalizeFontWeightValue(value) {
      let normalized = value;
      if (typeof normalized === "number" && Number.isFinite(normalized)) {
        normalized = String(Math.round(normalized));
      }
      if (typeof normalized !== "string") return "";
      normalized = normalized.trim();
      if (!normalized || !/^\d{3,4}$/.test(normalized)) return "";
      const num = Number(normalized);
      if (!Number.isInteger(num) || num < 100 || num > 1000 || num % 100 !== 0) return "";
      return String(num);
    }

    function getSelectedWebFontWeight(lang) {
      if (settings && settings.Fonts && !settings.Fonts.CustomFont) return "";
      const weights = settings && settings.Fonts && settings.Fonts.Weights;
      const langProfile = weights && weights[lang];
      return normalizeFontWeightValue(langProfile && langProfile.web);
    }

    function applyWebFontWeight(weightValue) {
      const normalized = normalizeFontWeightValue(weightValue);
      if (normalized) {
        document.documentElement.dataset.fontWeightMode = "override";
        document.documentElement.style.setProperty("--font-weight-override", normalized);
      } else {
        document.documentElement.removeAttribute("data-font-weight-mode");
        document.documentElement.style.removeProperty("--font-weight-override");
      }
    }

    function applyLanguageFont(lang) {
      const targetLang = lang || currentLanguage;
      const base = getDefaultFontStack(targetLang);
      const selected = getSelectedWebFont(targetLang);
      const stack = selected ? `"${selected.replace(/"/g, '\\"')}", ${base}` : base;
      document.documentElement.style.setProperty("--font-stack", stack);
      applyWebFontWeight(getSelectedWebFontWeight(targetLang));
      document.documentElement.lang = targetLang;
    }

    function applyDirection(lang) {
      const isRtl = lang === "ug-CN";
      document.documentElement.dir = isRtl ? "rtl" : "ltr";
      document.documentElement.classList.toggle("rtl", isRtl);
    }

    function init(data) {
      const isCrash = !!data.isError;
      const isMulti = data.code === "multi_instance";
      const isTest = data.code === "test_dialog";
      const isFontWarning = data.code === "font_warning";
      const isPassword = data.code === "password_verify";
      const isInk = data.code === "ink_keep";

      // If it's a font warning, we might want to preview a specific language's font
      if (isFontWarning && data.targetLang) {
        applyLanguageFont(data.targetLang);
      } else {
        applyLanguageFont();
      }
      applyDirection(currentLanguage);

      if (!data.title) {
        if (isCrash) {
          data.title = getText("dialog.crash.title") || "程序崩溃了 (´；ω；`) ";
        } else if (isMulti) {
          data.title = getText("dialog.multiInstance.title") || "检测到程序已在运行";
        } else if (isTest) {
          data.title = getText("testDialog.title") || "测试对话框";
        } else if (isFontWarning) {
          data.title = getText("dialog.fontWarning.title") || "自定义字体风险提示";
        } else if (isPassword) {
          data.title = getText("dialog.password.title") || "验证设置密码";
        } else if (isInk) {
          data.title = getText("dialog.ink.title") || "是否保留墨迹注释？";
        }
      }

      if (!data.text) {
        if (isMulti) {
          data.text = getText("dialog.multiInstance.text");
        } else if (isFontWarning) {
          data.text = getText("dialog.fontWarning.text");
        } else if (isPassword) {
          data.text = getText("dialog.password.text");
        } else if (isInk) {
          data.text = getText("dialog.ink.text");
        }
      }

      if (!data.confirmText) {
        if (isCrash) {
          data.confirmText = getText("dialog.crash.confirm") || getText("dialog.generic.ok");
        } else if (isMulti) {
          data.confirmText = getText("dialog.multiInstance.confirm") || getText("dialog.generic.ok");
        } else if (isTest) {
          data.confirmText = getText("testDialog.confirm") || getText("dialog.generic.ok");
        } else if (isFontWarning) {
          data.confirmText = getText("dialog.fontWarning.confirm") || getText("dialog.generic.ok");
        } else if (isPassword) {
          data.confirmText = getText("dialog.password.confirm") || getText("dialog.generic.ok");
        } else if (isInk) {
          data.confirmText = getText("dialog.ink.keep") || getText("dialog.generic.ok");
        } else {
          data.confirmText = getText("dialog.generic.ok") || "确认";
        }
      }

      if (!data.cancelText && !data.hideCancel) {
        if (isCrash) {
          data.cancelText = getText("dialog.crash.cancel") || getText("dialog.generic.cancel");
        } else if (isMulti) {
          data.cancelText = getText("dialog.multiInstance.cancel") || getText("dialog.generic.cancel");
        } else if (isTest) {
          data.cancelText = getText("testDialog.cancel") || getText("dialog.generic.cancel");
        } else if (isInk) {
          data.cancelText = getText("dialog.ink.discard") || getText("dialog.generic.cancel");
        } else {
          data.cancelText = getText("dialog.generic.cancel") || "取消";
        }
      }

      if (data.title) titleEl.innerText = data.title;
      if (data.text) textEl.innerText = data.text;
      if (data.isError) {
        errorEl.innerText = data.text;
        errorEl.style.display = 'block';
        textEl.style.display = 'none';
      }
      if (data.confirmText) btnConfirm.innerText = data.confirmText;
      if (data.cancelText) btnCancel.innerText = data.cancelText;
      if (data.hideCancel) btnCancel.style.display = 'none';

      if (isMulti) {
        // Multi-instance dialog special handling
        commandLinksEl.innerHTML = '';
        commandLinksEl.style.display = 'flex';
        
        // Option 1: Restart Existing Instance (Primary Action)
        const linkRestart = createCommandLink(
          getText("dialog.multiInstance.restartOld.title"),
          getText("dialog.multiInstance.restartOld.desc"),
          `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>`,
          () => {
             if (window.pywebview && window.pywebview.api) {
                 window.pywebview.api.on_confirm_with_value("RESTART_OLD");
             } else {
                 window.close();
             }
          }
        );
        
        // Option 2: Continue New Instance (Secondary Action)
        const linkContinue = createCommandLink(
          getText("dialog.multiInstance.continueNew.title"),
          getText("dialog.multiInstance.continueNew.desc"),
          `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`,
          () => {
             showMultiInstanceWarning();
          }
        );

        commandLinksEl.appendChild(linkRestart);
        commandLinksEl.appendChild(linkContinue);
        
        // Hide standard confirm button, keep cancel button as "Close"
        btnConfirm.style.display = 'none';
        
        // Override cancel button action to be explicitly CLOSE_NEW
        btnCancel.onclick = () => {
             if (window.pywebview && window.pywebview.api) {
                 window.pywebview.api.on_confirm_with_value("CLOSE_NEW");
             } else {
                 window.close();
             }
        };
      } else {
        commandLinksEl.style.display = 'none';
      }

      if (data.inputType || isPassword) {
        inputMode = true;
        inputWrapper.style.display = 'flex';
        inputEl.type = data.inputType || 'password';
        inputEl.placeholder = data.inputPlaceholder || getText("dialog.password.placeholder");
        setTimeout(() => inputEl.focus(), 0);
      } else {
        inputMode = false;
        inputWrapper.style.display = 'none';
      }
      
      let mode = data.theme || 'light';
      let themeId = data.themeId || (settings && settings.Appearance && settings.Appearance.ThemeId);
      
      if (mode === 'auto') {
        mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      const isDark = mode === 'dark';
      updateTheme(mode, themeId);
    }

    function showMultiInstanceWarning() {
      const modal = document.getElementById("multi-warning-modal");
      const titleEl = document.getElementById("multi-warning-title");
      const textEl = document.getElementById("multi-warning-text");
      const backBtn = document.getElementById("multi-warning-back");
      const confirmBtn = document.getElementById("multi-warning-confirm");

      if (!modal || !titleEl || !textEl || !backBtn || !confirmBtn) return;

      titleEl.textContent = getText("dialog.multiInstance.warning.title") || "不建议多开实例";
      textEl.textContent = getText("dialog.multiInstance.warning.text") || "同时运行多个实例，可能会导致：资源占用翻倍、数据冲突或丢失、功能异常或崩溃等。\n\n因此，开发者不推荐用户多开实例。若您在生产环境中强行使用此类功能，开发者不对该行为产生的后果承担任何责任。";
      backBtn.textContent = getText("dialog.multiInstance.warning.back") || "返回";
      confirmBtn.textContent = getText("dialog.multiInstance.warning.confirm") || "仍然启动";

      backBtn.onclick = () => {
        modal.classList.remove("active");
      };

      confirmBtn.onclick = () => {
        modal.classList.remove("active");
        if (window.pywebview && window.pywebview.api) {
          window.pywebview.api.on_confirm_with_value("CONTINUE_NEW");
        } else {
          window.close();
        }
      };

      modal.classList.add("active");
    }

    function createCommandLink(title, desc, iconSvg, onClick) {
      const link = document.createElement('div');
      link.className = 'command-link';
      link.onclick = onClick;
      
      const icon = document.createElement('div');
      icon.className = 'command-icon';
      icon.innerHTML = iconSvg;
      
      const content = document.createElement('div');
      content.className = 'command-content';
      
      const titleDiv = document.createElement('div');
      titleDiv.className = 'command-title';
      titleDiv.innerText = title;
      
      const descDiv = document.createElement('div');
      descDiv.className = 'command-desc';
      descDiv.innerText = desc;
      
      content.appendChild(titleDiv);
      content.appendChild(descDiv);
      
      // Arrow Icon
      const arrow = document.createElement('div');
      arrow.className = 'command-arrow';
      arrow.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"/></svg>`;
      
      link.appendChild(icon);
      link.appendChild(content);
      link.appendChild(arrow);
      
      return link;
    }

    function onConfirm() {
      if (confirmPending) return;
      if (window.pywebview && window.pywebview.api) {
        if (inputMode && window.pywebview.api.on_confirm_with_value) {
          confirmPending = true;
          loadingText.textContent = getText("dialog.password.loading") || "";
          loadingOverlay.style.display = "flex";
          btnConfirm.disabled = true;
          btnCancel.disabled = true;
          window.pywebview.api.on_confirm_with_value(inputEl.value || "");
        } else {
          window.pywebview.api.on_confirm();
        }
      } else {
        window.close();
      }
    }

    function onCancel() {
      if (errorEl.style.display !== 'none') {
        const text = errorEl.innerText;
        navigator.clipboard.writeText(text).then(() => {
          const originalText = btnCancel.innerText;
          btnCancel.innerText = "已复制！";
          btnCancel.style.color = "#4CAF50";
          setTimeout(() => {
            btnCancel.innerText = originalText;
            btnCancel.style.color = "";
          }, 2000);
        }).catch(err => {
          console.error('Failed to copy: ', err);
        });
        return;
      }

      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.on_cancel();
      } else {
        window.close();
      }
    }

    function updateTheme(mode, themeId) {
      let theme = mode || 'light';
      if (theme === 'auto') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      const isDark = theme === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      
      if (themeId) {
        document.documentElement.setAttribute('data-theme-id', themeId);
      } else {
        document.documentElement.removeAttribute('data-theme-id');
      }

      let accent = isDark ? '#E1EBFF' : '#3275F5';
      if (themeId === 'year-of-horse') {
        accent = isDark ? '#FF4500' : '#D32F2F';
      }
      document.documentElement.style.setProperty('--accent-blue', accent);
    }

    function updateAccentColor(hex) {
      if (hex) {
        document.documentElement.style.setProperty('--accent-blue', hex);
      }
    }

    window.addEventListener('pywebviewready', () => {
      if (window.pywebview && window.pywebview.api) {
        const api = window.pywebview.api;
        const settingsPromise = api.get_settings ? api.get_settings().catch(() => null) : Promise.resolve(null);
        const dialogPromise = api.get_dialog_data ? api.get_dialog_data() : Promise.resolve(null);

        Promise.all([settingsPromise, dialogPromise]).then(([s, d]) => {
          if (s) updateLanguageAndSettings(s);
          if (d) init(d);
        });

        if (api.get_version) {
          api.get_version().then(v => {
            if (!v) return;
            const version = v.version || "";
            const wm = document.getElementById("dev-watermark");
            if (wm && version) {
              const parts = String(version).trim().split(".");
              const suffix = parts[parts.length - 1];
              const isDev = parts.length >= 2 && ["1", "2", "3", "4"].includes(suffix);
              let displayVersion = String(version).trim();
              if (["5", "6", "7"].includes(suffix)) {
                const patchNum = Number(suffix) - 4;
                displayVersion = parts.slice(0, -1).join(".") + " Patch " + patchNum;
              }
              if (isDev) {
                const tmpl = getText("general.devWatermark") || "开发中版本/技术预览版本\n不保证最终品质 （{version}）";
                wm.textContent = tmpl.replace("{version}", displayVersion);
                wm.style.display = "block";
              } else {
                wm.style.display = "none";
              }
            }
          }).catch(err => console.error("Failed to get version:", err));
        }
      }
    });

    if (inputEl) {
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") onConfirm();
      });
    }
  </script>
</body>
</html>
