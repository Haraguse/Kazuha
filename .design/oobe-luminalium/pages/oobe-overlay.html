<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放映设置 — Luminalium</title>
    <style id="theme-vars">
/* Luminalium OOBE — Colors & Type
   Free-explore mode: single brand hue, no secondary/accent */

:root {
  /* === Spacing (8pt grid) === */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;
  --s-9: 120px;

  /* === Type Scale === */
  --text-display: clamp(40px, 6vw, 64px);
  --text-h1: clamp(28px, 3.5vw, 40px);
  --text-h2: clamp(22px, 2.4vw, 28px);
  --text-h3: 20px;
  --text-body-l: 18px;
  --text-body: 16px;
  --text-caption: 13px;
  --text-mono: 14px;

  --leading-display: 1.08;
  --leading-h1: 1.18;
  --leading-h2: 1.25;
  --leading-h3: 1.3;
  --leading-body: 1.6;
  --leading-caption: 1.5;

  --weight-display: 600;
  --weight-heading: 600;
  --weight-body: 400;
  --weight-mono: 500;

  /* === Radius === */
  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-pill: 999px;

  /* === Shadows === */
  --shadow-1: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 1px rgba(15, 23, 42, 0.02);
  --shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.12);
  --shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.22);

  /* === Light Theme === */
  --brand-background: #FAFBFD;
  --brand-foreground: #1A1D26;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #1A1D26;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1A1D26;
  --brand-primary: #4F6EF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F4F5F7;
  --brand-muted-foreground: #5F6570;
  --brand-border: #E5E7EB;
  --brand-input: #E5E7EB;
  --brand-ring: rgba(79, 110, 247, 0.3);

  /* === Semantic surface & text aliases === */
  --brand-surface: #FFFFFF;
  --brand-surface-2: #F4F5F7;
  --brand-ink: #1A1D26;
  --brand-ink-2: #5F6570;
  --brand-ink-3: #9CA3AF;
  --brand-line: #E5E7EB;
  --brand-brand-ink: #FFFFFF;

  /* === State colors === */
  --brand-state-success: #22C55E;
  --brand-state-warning: #F59E0B;
  --brand-state-error: #EF4444;
  --brand-state-info: #3B82F6;

  /* === Radius aliases for head contract === */
  --brand-radius-sm: 4px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 16px;
}

/* === Dark Theme === */
.dark {
  --brand-background: #0D0F15;
  --brand-foreground: #E8EAF0;
  --brand-card: #151820;
  --brand-card-foreground: #E8EAF0;
  --brand-popover: #151820;
  --brand-popover-foreground: #E8EAF0;
  --brand-primary: #6B8AFF;
  --brand-primary-foreground: #0D0F15;
  --brand-muted: #1A1E2A;
  --brand-muted-foreground: #8B92A0;
  --brand-border: #252A36;
  --brand-input: #252A36;
  --brand-ring: rgba(107, 138, 255, 0.3);
  --brand-surface: #151820;
  --brand-surface-2: #1A1E2A;
  --brand-ink: #E8EAF0;
  --brand-ink-2: #8B92A0;
  --brand-ink-3: #5C6370;
  --brand-line: #252A36;
  --brand-brand-ink: #0D0F15;
  --brand-state-success: #4ADE80;
  --brand-state-warning: #FBBF24;
  --brand-state-error: #F87171;
  --brand-state-info: #60A5FA;
}

/* === Base === */
*, *::before, *::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: var(--text-body);
  line-height: var(--leading-body);
  color: var(--brand-foreground);
  background: var(--brand-background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* === Utility === */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">

      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen flex items-center justify-center p-6">
        <!-- Wizard Card -->
        <div class="w-[960px] h-[720px] bg-card/70 backdrop-blur-xl rounded-2xl border border-border shadow-[0_24px_60px_-20px_rgba(15,23,42,0.22)] flex overflow-hidden">
            <!-- Left Sidebar: Step Dots -->
            <aside class="w-[72px] flex-shrink-0 flex flex-col items-center justify-center gap-6 border-r border-border bg-muted/40">
                <div class="flex flex-col items-center gap-5">
                    <!-- Step 1 -->
                    <div class="w-3 h-3 rounded-full bg-muted-foreground/25" title="欢迎"></div>
                    <!-- Step 2 -->
                    <div class="w-3 h-3 rounded-full bg-muted-foreground/25" title="声明"></div>
                    <!-- Step 3 -->
                    <div class="w-3 h-3 rounded-full bg-muted-foreground/25" title="外观"></div>
                    <!-- Step 4 -->
                    <div class="w-3 h-3 rounded-full bg-muted-foreground/25" title="行为"></div>
                    <!-- Step 5 (Active) -->
                    <div class="w-3.5 h-3.5 rounded-full bg-primary ring-4 ring-primary/20" title="放映设置"></div>
                    <!-- Step 6 -->
                    <div class="w-3 h-3 rounded-full bg-muted-foreground/25" title="完成"></div>
                </div>
            </aside>

            <!-- Right Content Area -->
            <div class="flex-1 flex flex-col p-12 min-w-0">
                <!-- Header -->
                <div class="mb-10">
                    <h2 class="text-[var(--text-h2)] font-semibold leading-[var(--leading-h2)] text-foreground mb-2">放映设置</h2>
                    <p class="text-[var(--text-body)] text-muted-foreground">配置演示放映时的界面行为</p>
                </div>

                <!-- Toggle Settings -->
                <div class="space-y-5 mb-10">
                    <!-- Toggle 1: 自动显示放映工具栏 -->
                    <div class="flex items-center justify-between p-4 rounded-xl bg-muted/40 border border-border/50">
                        <div class="flex items-center gap-3.5 min-w-0">
                            <div class="flex-shrink-0 w-9 h-9 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
                                <i data-lucide="panel-top" class="w-5 h-5"></i>
                            </div>
                            <div class="min-w-0">
                                <p class="text-[var(--text-body)] font-medium text-foreground">自动显示放映工具栏</p>
                                <p class="text-[var(--text-caption)] text-muted-foreground mt-0.5">开始演示时自动显示控制工具栏</p>
                            </div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer flex-shrink-0 ml-4">
                            <input type="checkbox" class="sr-only peer" checked id="toggle-toolbar">
                            <div class="w-11 h-6 rounded-full bg-muted-foreground/20 peer-checked:bg-primary transition-colors duration-200 after:content-[''] after:absolute after:top-0.5 after:start-[2px] after:bg-card after:rounded-full after:h-5 after:w-5 after:shadow-sm after:transition-all after:duration-200 peer-checked:after:translate-x-5"></div>
                        </label>
                    </div>

                    <!-- Toggle 2: 显示状态栏 -->
                    <div class="flex items-center justify-between p-4 rounded-xl bg-muted/40 border border-border/50">
                        <div class="flex items-center gap-3.5 min-w-0">
                            <div class="flex-shrink-0 w-9 h-9 rounded-lg bg-muted-foreground/10 flex items-center justify-center text-muted-foreground">
                                <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                            </div>
                            <div class="min-w-0">
                                <p class="text-[var(--text-body)] font-medium text-foreground">显示状态栏</p>
                                <p class="text-[var(--text-caption)] text-muted-foreground mt-0.5">在放映界面底部显示状态信息</p>
                            </div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer flex-shrink-0 ml-4">
                            <input type="checkbox" class="sr-only peer" id="toggle-statusbar">
                            <div class="w-11 h-6 rounded-full bg-muted-foreground/20 peer-checked:bg-primary transition-colors duration-200 after:content-[''] after:absolute after:top-0.5 after:start-[2px] after:bg-card after:rounded-full after:h-5 after:w-5 after:shadow-sm after:transition-all after:duration-200 peer-checked:after:translate-x-5"></div>
                        </label>
                    </div>
                </div>

                <!-- Slider Controls -->
                <div class="space-y-7 mb-auto">
                    <!-- Slider 1: 工具栏缩放 -->
                    <div class="p-4 rounded-xl bg-muted/40 border border-border/50">
                        <div class="flex items-center gap-3.5 mb-4">
                            <div class="flex-shrink-0 w-9 h-9 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
                                <i data-lucide="maximize-2" class="w-5 h-5"></i>
                            </div>
                            <div class="min-w-0">
                                <p class="text-[var(--text-body)] font-medium text-foreground">工具栏缩放</p>
                                <p class="text-[var(--text-caption)] text-muted-foreground mt-0.5">调整放映工具栏的大小</p>
                            </div>
                            <span class="ml-auto flex-shrink-0 text-[var(--text-body)] font-semibold text-primary tabular-nums min-w-[48px] text-right" id="scale-value">1.0x</span>
                        </div>
                        <div class="relative px-1">
                            <input type="range" id="scale-slider" min="0.5" max="2.0" step="0.1" value="1.0"
                                class="w-full h-2 rounded-full appearance-none cursor-pointer bg-muted
                                    [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-4 [&::-webkit-slider-thumb]:h-4 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-card [&::-webkit-slider-thumb]:border-2 [&::-webkit-slider-thumb]:border-primary [&::-webkit-slider-thumb]:shadow-sm [&::-webkit-slider-thumb]:cursor-pointer
                                    [&::-moz-range-thumb]:w-4 [&::-moz-range-thumb]:h-4 [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:bg-card [&::-moz-range-thumb]:border-2 [&::-moz-range-thumb]:border-primary [&::-moz-range-thumb]:shadow-sm [&::-moz-range-thumb]:cursor-pointer [&::-moz-range-thumb]:box-border"
                                style="background: linear-gradient(to right, var(--brand-primary) 0%, var(--brand-primary) 33.33%, var(--brand-muted) 33.33%, var(--brand-muted) 100%);">
                            <!-- Step Markers -->
                            <div class="flex justify-between px-[2px] mt-1.5">
                                <span class="text-[11px] text-muted-foreground cursor-pointer hover:text-foreground transition-colors" onclick="document.getElementById('scale-slider').value=0.5; updateScaleSlider();">0.5x</span>
                                <span class="text-[11px] text-muted-foreground cursor-pointer hover:text-foreground transition-colors" onclick="document.getElementById('scale-slider').value=1.0; updateScaleSlider();">1.0x</span>
                                <span class="text-[11px] text-muted-foreground cursor-pointer hover:text-foreground transition-colors" onclick="document.getElementById('scale-slider').value=1.5; updateScaleSlider();">1.5x</span>
                                <span class="text-[11px] text-muted-foreground cursor-pointer hover:text-foreground transition-colors" onclick="document.getElementById('scale-slider').value=2.0; updateScaleSlider();">2.0x</span>
                            </div>
                        </div>
                    </div>

                    <!-- Slider 2: 安全区域 -->
                    <div class="p-4 rounded-xl bg-muted/40 border border-border/50">
                        <div class="flex items-center gap-3.5 mb-4">
                            <div class="flex-shrink-0 w-9 h-9 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
                                <i data-lucide="frame" class="w-5 h-5"></i>
                            </div>
                            <div class="min-w-0">
                                <p class="text-[var(--text-body)] font-medium text-foreground">安全区域</p>
                                <p class="text-[var(--text-caption)] text-muted-foreground mt-0.5">调整放映界面的边距</p>
                            </div>
                            <span class="ml-auto flex-shrink-0 text-[var(--text-body)] font-semibold text-primary tabular-nums min-w-[56px] text-right" id="safe-area-value">0 px</span>
                        </div>
                        <div class="relative px-1">
                            <input type="range" id="safe-area-slider" min="0" max="48" step="4" value="0"
                                class="w-full h-2 rounded-full appearance-none cursor-pointer bg-muted
                                    [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-4 [&::-webkit-slider-thumb]:h-4 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-card [&::-webkit-slider-thumb]:border-2 [&::-webkit-slider-thumb]:border-primary [&::-webkit-slider-thumb]:shadow-sm [&::-webkit-slider-thumb]:cursor-pointer
                                    [&::-moz-range-thumb]:w-4 [&::-moz-range-thumb]:h-4 [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:bg-card [&::-moz-range-thumb]:border-2 [&::-moz-range-thumb]:border-primary [&::-moz-range-thumb]:shadow-sm [&::-moz-range-thumb]:cursor-pointer [&::-moz-range-thumb]:box-border"
                                style="background: linear-gradient(to right, var(--brand-primary) 0%, var(--brand-primary) 0%, var(--brand-muted) 0%, var(--brand-muted) 100%);">
                            <div class="flex justify-between mt-1.5">
                                <span class="text-[11px] text-muted-foreground">0 px</span>
                                <span class="text-[11px] text-muted-foreground">48 px</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Navigation Buttons -->
                <div class="flex items-center justify-between mt-10 pt-6 border-t border-border">
                    <button class="inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-lg border border-border text-[var(--text-body)] font-medium text-foreground bg-card hover:bg-muted transition-colors duration-150 cursor-pointer">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        上一步
                    </button>
                    <button class="inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-lg bg-primary text-primary-foreground text-[var(--text-body)] font-medium hover:opacity-90 transition-opacity duration-150 cursor-pointer shadow-sm">
                        下一步
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Scale slider update
        function updateScaleSlider() {
            const slider = document.getElementById('scale-slider');
            const valueEl = document.getElementById('scale-value');
            const val = parseFloat(slider.value).toFixed(1);
            valueEl.textContent = val + 'x';

            // Update filled track portion
            const pct = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
            slider.style.background = `linear-gradient(to right, var(--brand-primary) 0%, var(--brand-primary) ${pct}%, var(--brand-muted) ${pct}%, var(--brand-muted) 100%)`;
        }

        // Safe area slider update
        function updateSafeAreaSlider() {
            const slider = document.getElementById('safe-area-slider');
            const valueEl = document.getElementById('safe-area-value');
            valueEl.textContent = slider.value + ' px';

            // Update filled track portion
            const pct = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
            slider.style.background = `linear-gradient(to right, var(--brand-primary) 0%, var(--brand-primary) ${pct}%, var(--brand-muted) ${pct}%, var(--brand-muted) 100%)`;
        }

        // Initialize sliders
        document.getElementById('scale-slider').addEventListener('input', updateScaleSlider);
        document.getElementById('safe-area-slider').addEventListener('input', updateSafeAreaSlider);

        // Initialize toggle icons color based on state
        function updateToggleIcons() {
            const toolbarToggle = document.getElementById('toggle-toolbar');
            const statusbarToggle = document.getElementById('toggle-statusbar');
            const toolbarIcon = toolbarToggle.closest('.flex.items-center.justify-between').querySelector('.flex-shrink-0');
            const statusbarIcon = statusbarToggle.closest('.flex.items-center.justify-between').querySelector('.flex-shrink-0');

            if (toolbarToggle.checked) {
                toolbarIcon.className = 'flex-shrink-0 w-9 h-9 rounded-lg bg-primary/10 flex items-center justify-center text-primary';
            } else {
                toolbarIcon.className = 'flex-shrink-0 w-9 h-9 rounded-lg bg-muted-foreground/10 flex items-center justify-center text-muted-foreground';
            }

            if (statusbarToggle.checked) {
                statusbarIcon.className = 'flex-shrink-0 w-9 h-9 rounded-lg bg-primary/10 flex items-center justify-center text-primary';
            } else {
                statusbarIcon.className = 'flex-shrink-0 w-9 h-9 rounded-lg bg-muted-foreground/10 flex items-center justify-center text-muted-foreground';
            }
        }

        document.getElementById('toggle-toolbar').addEventListener('change', updateToggleIcons);
        document.getElementById('toggle-statusbar').addEventListener('change', updateToggleIcons);

        // Run initial setup
        updateScaleSlider();
        updateSafeAreaSlider();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
