/* Luminalium OOBE — Colors & Type
   Free-explore mode: single brand hue, no secondary/accent */

:root {
  /* === Spacing (8pt grid) === */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;
  --s-9: 120px;

  /* === Type Scale === */
  --text-display: clamp(40px, 6vw, 64px);
  --text-h1: clamp(28px, 3.5vw, 40px);
  --text-h2: clamp(22px, 2.4vw, 28px);
  --text-h3: 20px;
  --text-body-l: 18px;
  --text-body: 16px;
  --text-caption: 13px;
  --text-mono: 14px;

  --leading-display: 1.08;
  --leading-h1: 1.18;
  --leading-h2: 1.25;
  --leading-h3: 1.3;
  --leading-body: 1.6;
  --leading-caption: 1.5;

  --weight-display: 600;
  --weight-heading: 600;
  --weight-body: 400;
  --weight-mono: 500;

  /* === Radius === */
  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-pill: 999px;

  /* === Shadows === */
  --shadow-1: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 1px rgba(15, 23, 42, 0.02);
  --shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.12);
  --shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.22);

  /* === Light Theme === */
  --brand-background: #FAFBFD;
  --brand-foreground: #1A1D26;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #1A1D26;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1A1D26;
  --brand-primary: #4F6EF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F4F5F7;
  --brand-muted-foreground: #5F6570;
  --brand-border: #E5E7EB;
  --brand-input: #E5E7EB;
  --brand-ring: rgba(79, 110, 247, 0.3);

  /* === Semantic surface & text aliases === */
  --brand-surface: #FFFFFF;
  --brand-surface-2: #F4F5F7;
  --brand-ink: #1A1D26;
  --brand-ink-2: #5F6570;
  --brand-ink-3: #9CA3AF;
  --brand-line: #E5E7EB;
  --brand-brand-ink: #FFFFFF;

  /* === State colors === */
  --brand-state-success: #22C55E;
  --brand-state-warning: #F59E0B;
  --brand-state-error: #EF4444;
  --brand-state-info: #3B82F6;

  /* === Theme preview palette (decorative swatches) === */
  --theme-preview-default-1: #4F6EF7;
  --theme-preview-default-2: #758AF8;
  --theme-preview-default-3: #9BA8FA;
  --theme-preview-default-4: #C1C8FC;
  --theme-preview-sunset-1: #F59E0B;
  --theme-preview-sunset-2: #F7B73C;
  --theme-preview-sunset-3: #F9CC6D;
  --theme-preview-sunset-4: #FCE09E;
  --theme-preview-teal-1: #10B981;
  --theme-preview-teal-2: #3CC99A;
  --theme-preview-teal-3: #6DD9B3;
  --theme-preview-teal-4: #9EE8CD;
  --theme-preview-pink-1: #EC4899;
  --theme-preview-pink-2: #F06DAE;
  --theme-preview-pink-3: #F493C3;
  --theme-preview-pink-4: #F8B9D9;
  --theme-preview-slate-1: #64748B;
  --theme-preview-slate-2: #8390A2;
  --theme-preview-slate-3: #A1ACB9;
  --theme-preview-slate-4: #C0C8D0;
  --theme-preview-amber-1: #D97706;
  --theme-preview-amber-2: #E5922D;
  --theme-preview-amber-3: #F0AD55;
  --theme-preview-amber-4: #F6C97D;
  --theme-preview-deepblue-1: #3B82F6;
  --theme-preview-deepblue-2: #629BF8;
  --theme-preview-deepblue-3: #89B4FA;
  --theme-preview-deepblue-4: #B0CDFD;
  --theme-preview-emerald-1: #059669;
  --theme-preview-emerald-2: #2EAB82;
  --theme-preview-emerald-3: #57C09B;
  --theme-preview-emerald-4: #80D5B4;

  /* === Radius aliases for head contract === */
  --brand-radius-sm: 4px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 16px;
}

/* === Dark Theme === */
.dark {
  --brand-background: #0D0F15;
  --brand-foreground: #E8EAF0;
  --brand-card: #151820;
  --brand-card-foreground: #E8EAF0;
  --brand-popover: #151820;
  --brand-popover-foreground: #E8EAF0;
  --brand-primary: #6B8AFF;
  --brand-primary-foreground: #0D0F15;
  --brand-muted: #1A1E2A;
  --brand-muted-foreground: #8B92A0;
  --brand-border: #252A36;
  --brand-input: #252A36;
  --brand-ring: rgba(107, 138, 255, 0.3);
  --brand-surface: #151820;
  --brand-surface-2: #1A1E2A;
  --brand-ink: #E8EAF0;
  --brand-ink-2: #8B92A0;
  --brand-ink-3: #5C6370;
  --brand-line: #252A36;
  --brand-brand-ink: #0D0F15;
  --brand-state-success: #4ADE80;
  --brand-state-warning: #FBBF24;
  --brand-state-error: #F87171;
  --brand-state-info: #60A5FA;
}

/* === Base === */
*, *::before, *::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: var(--text-body);
  line-height: var(--leading-body);
  color: var(--brand-foreground);
  background: var(--brand-background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* === Utility === */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}

    <script>
    (function() {
        const modes = document.querySelectorAll('#mode-light, #mode-dark, #mode-system');
        const cards = document.querySelectorAll('[data-theme]');

        function setActiveMode(activeBtn) {
            modes.forEach(b => {
                b.classList.remove('bg-primary', 'text-primary-foreground', 'border-x', 'border-border');
                b.classList.add('bg-muted', 'text-muted-foreground');
            });
            activeBtn.classList.remove('bg-muted', 'text-muted-foreground');
            activeBtn.classList.add('bg-primary', 'text-primary-foreground');
            // Re-add border-x to the middle button if it's not the active one
            const darkBtn = document.getElementById('mode-dark');
            if (activeBtn !== darkBtn) {
                darkBtn.classList.add('border-x', 'border-border');
            }
        }

        function setActiveCard(activeCard) {
            cards.forEach(c => {
                c.classList.remove('ring-2', 'ring-primary', 'ring-offset-2', 'ring-offset-card');
            });
            activeCard.classList.add('ring-2', 'ring-primary', 'ring-offset-2', 'ring-offset-card');
        }

        modes.forEach(btn => {
            btn.addEventListener('click', () => setActiveMode(btn));
        });

        cards.forEach(card => {
            card.addEventListener('click', () => setActiveCard(card));
        });
    })();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
